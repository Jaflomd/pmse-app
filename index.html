<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>pMSE App</title>
<style>
:root {
  /* ── Base surfaces (DARK SEPIA) ── */
  --bg: #1a140d;
  --bg-alt: #211a12;
  --surface: #2a2016;
  --surface-raised: #33271a;

  /* ── Azul system → ORO ANTIGUO (acento primario sepia) ── */
  --azul: #c89b4f;
  --azul-deep: #a67f36;
  --azul-mid: #d4ac60;
  --azul-light: #e2bf78;
  --azul-soft: rgba(200,155,79,0.10);
  --azul-soft-hover: rgba(200,155,79,0.17);
  --azul-border: rgba(200,155,79,0.30);
  --azul-border-strong: rgba(200,155,79,0.48);
  /* gradient variants */
  --azul-grad: linear-gradient(135deg, #b9863a 0%, #c89b4f 60%, #dcb368 100%);
  --azul-grad-subtle: linear-gradient(135deg, #a67f36 0%, #c4933f 100%);

  /* ── Teal system → VERDIGRIS / pátina (acento secundario) ── */
  --teal: #6e9b8f;
  --teal-bright: #7fb0a2;
  --teal-soft: rgba(110,155,143,0.12);
  --teal-border: rgba(110,155,143,0.32);

  /* ── Semantic colors (sobre fondo oscuro cálido) ── */
  --text: #ece0cb;
  --text-muted: #b3a283;
  --text-subtle: #88795e;
  --border: #3a2d1f;
  --border-strong: #50402b;

  --red: #d2403a;
  --red-soft: rgba(210,64,58,0.16);
  --orange: #e07b1e;
  --orange-soft: rgba(224,123,30,0.16);
  --gray: #9a8d78;
  --green: #6e9b5a;
  --green-soft: rgba(110,155,90,0.16);
  --purple: #a07bd8;
  --gold: #d8b264;

  /* ── Shadow system (multi-layer, like Stripe/Linear) ── */
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.30);
  --shadow:    0 1px 3px rgba(0,0,0,0.38), 0 1px 2px rgba(0,0,0,0.30);
  --shadow-md: 0 4px 8px rgba(0,0,0,0.42), 0 1px 3px rgba(0,0,0,0.32);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.50), 0 2px 6px rgba(0,0,0,0.38);
  --shadow-xl: 0 16px 40px rgba(0,0,0,0.58), 0 4px 12px rgba(0,0,0,0.42);
  /* inset glow for selected state */
  --shadow-azul: 0 0 0 3px rgba(200,155,79,0.22), 0 2px 6px rgba(200,155,79,0.30);

  /* ── Radius system ── */
  --r-sm: 5px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-pill: 999px;

  /* ── Easing ── */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* ── Typography ── */
  --font-display: 'Instrument Serif', Georgia, serif;
  --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  font-family: var(--font-body);
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* HEADER — glassmorfismo refinado */
header {
  padding: 12px 28px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px) saturate(1.4);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 0 rgba(24,22,15,0.04), 0 2px 8px rgba(24,22,15,0.04);
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 50;
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand .mark {
  font-family: var(--font-display);
  font-size: 27px;
  font-weight: 400;
  letter-spacing: -0.01em;
  color: var(--text);
  line-height: 1;
}
.brand .sub {
  font-size: 9.5px;
  color: var(--text-subtle);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  font-weight: 500;
}
.progress {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
}
.progress .bar {
  width: 140px;
  height: 3px;
  background: var(--surface);
  border-radius: var(--r-pill);
  overflow: hidden;
}
/* gradient fill para progress bar */
.progress .fill {
  height: 100%;
  background: var(--azul-grad);
  transition: width 0.4s var(--ease-out);
  width: 0%;
}
.completion-cta {
  font-family: var(--font-body);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 5px 13px 6px;
  border-radius: var(--r-pill);
  background: var(--green);
  color: #fff;
  border: none;
  cursor: pointer;
  transition: all 0.2s var(--ease-out);
  white-space: nowrap;
  box-shadow: 0 2px 6px rgba(47,158,68,0.28);
  animation: ctaPop 0.3s var(--ease-spring);
}
.completion-cta:hover {
  background: #279039;
  transform: translateY(-1px);
  box-shadow: 0 4px 10px rgba(47,158,68,0.32);
}
@keyframes ctaPop { from { opacity: 0; transform: scale(0.82); } to { opacity: 1; transform: scale(1); } }

/* TABS — pill switcher refinado */
.tabs {
  margin-left: auto;
  display: flex;
  gap: 2px;
  padding: 3px;
  background: var(--surface);
  border-radius: var(--r-pill);
  border: 1px solid var(--border);
}
.tab-btn {
  padding: 6px 20px;
  border: none;
  background: transparent;
  border-radius: var(--r-pill);
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.055em;
  text-transform: uppercase;
  color: var(--text-muted);
  cursor: pointer;
  transition: color 0.15s, background 0.15s, box-shadow 0.15s;
}
.tab-btn:hover { color: var(--azul); }
.tab-btn.active {
  background: var(--azul-grad-subtle);
  color: #fff;
  box-shadow: var(--shadow-md), 0 0 0 1px rgba(30,58,138,0.18);
}

/* MAIN */
main { padding: 24px 28px 64px; max-width: 1180px; margin: 0 auto; }
body.profile-mode {
  overflow: auto;
}
body.profile-mode main {
  max-width: none;
  width: 100%;
  padding: 8px 10px 10px;
}
#scoreView {
  max-width: 900px;
  margin: 0 auto;
}
#profileView {
  max-width: 1180px;
  margin: 0 auto;
}
body.profile-mode #profileView {
  max-width: none;
  width: 100%;
}

/* SECTION NAV (sticky strip — C5) */
.section-nav {
  position: sticky;
  top: 57px;
  z-index: 40;
  background: rgba(255,255,255,0.94);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 0 rgba(24,22,15,0.03);
  padding: 7px 0 8px;
  margin: -22px -28px 14px;
  padding-left: 28px;
  padding-right: 28px;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  align-items: center;
}
.section-nav .nav-chip {
  font-family: var(--font-body);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
  padding: 3px 9px 4px;
  border-radius: var(--r-pill);
  background: var(--surface);
  color: var(--text-muted);
  border: 1px solid var(--border);
  cursor: pointer;
  text-decoration: none;
  transition: all 0.15s var(--ease-out);
  white-space: nowrap;
  box-shadow: var(--shadow-xs);
}
.section-nav .nav-chip:hover {
  background: var(--azul-soft-hover);
  color: var(--azul);
  border-color: var(--azul-border);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}
.section-nav .nav-chip.complete {
  background: var(--teal-soft);
  color: var(--teal-bright);
  border-color: var(--teal-border);
}
.section-nav .nav-chip .nav-count { opacity: 0.7; font-size: 9.5px; margin-left: 4px; font-weight: 500; }
.section-nav .nav-help {
  margin-left: auto;
  font-size: 9.5px;
  color: var(--text-muted);
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.section-nav .nav-help kbd {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 1px 5px;
  font-family: var(--font-body);
  font-size: 9.5px;
  font-weight: 700;
  color: var(--text);
  margin: 0 2px;
}
.section-nav .nav-sweep {
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 4px 12px 5px;
  border-radius: var(--r-pill);
  background: var(--azul-grad-subtle);
  color: #fff;
  border: none;
  cursor: pointer;
  transition: all 0.15s var(--ease-out);
  box-shadow: 0 1px 4px rgba(30,58,138,0.22);
}
.section-nav .nav-sweep:hover {
  background: var(--azul-deep);
  box-shadow: 0 3px 8px rgba(30,58,138,0.28);
  transform: translateY(-1px);
}
.section-nav .nav-sweep:active { transform: translateY(0); }
.section-nav .nav-sweep:disabled { background: var(--text-subtle); cursor: not-allowed; opacity: 0.55; box-shadow: none; transform: none; }

/* SECTION HEADER — con detalle visual (número de sección + accent line) */
.section-head {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 400;
  letter-spacing: -0.008em;
  color: var(--text);
  margin: 26px 0 6px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  scroll-margin-top: 115px;
  position: relative;
}
/* accent underline animado en la section head activa/completa */
.section-head::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  width: 0;
  height: 2px;
  background: var(--azul-grad);
  border-radius: 2px;
  transition: width 0.35s var(--ease-out);
}
.section-head.sec-complete::after { width: 48px; background: var(--teal); }
/* Section collapse toggle — visible when section is complete */
.section-head .sec-collapse {
  font-family: var(--font-body);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 2px 8px 3px;
  border-radius: 999px;
  background: var(--teal-soft);
  color: var(--teal);
  border: 1px solid var(--teal-border);
  cursor: pointer;
  transition: all 0.15s;
  flex-shrink: 0;
  display: none;
}
.section-head.sec-complete .sec-collapse { display: inline-flex; align-items: center; gap: 4px; }
.section-head.sec-complete .sec-collapse:hover { background: var(--teal); color: #fff; }
.section-head.sec-complete { color: var(--teal); border-bottom-color: var(--teal-border); }
/* Collapsed section grid: zero height, no pointer events */
.section-grid.collapsed { display: none; }
.section-head:first-child { margin-top: 0; }
.section-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
}
.section-grid > .dim-row.multitest,
.section-grid > .dim-row.two-axis { grid-column: 1 / -1; }

/* TENTATIVE (auto-default 0, awaiting clinician confirmation) — C1 */
.s-btn.tentative { border-style: dashed; background: rgba(107,103,96,0.04); color: var(--text-muted); }
.s-btn.tentative .num { font-weight: 600; opacity: 0.85; }
.s-btn.tentative .lbl { opacity: 0.75; }
.s-btn.tentative::after {
  content: '?';
  position: absolute;
  margin-left: 4px;
  font-size: 8.5px;
  color: var(--orange);
  font-weight: 700;
  vertical-align: super;
}
.s-btn { position: relative; }
.dim-row.tentative-only { background: transparent; }
.dim-row.tentative-only.scored { background: transparent; }
.section-head .count {
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* DIMENSION ROW — compact con hover refinado */
.dim-row {
  display: grid;
  grid-template-columns: minmax(150px, 190px) minmax(0, 780px);
  justify-content: center;
  align-items: start;
  column-gap: 16px;
  row-gap: 7px;
  padding: 13px 15px;
  border-radius: var(--r-md);
  transition: background 0.12s ease, box-shadow 0.12s ease;
}
.dim-row + .dim-row { border-top: 1px solid var(--border); }
.dim-row:hover { background: var(--bg-alt); }
.dim-row.scored { background: linear-gradient(to right, rgba(248,248,246,0.6), var(--bg-alt)); }
.dim-row.kbd-focus {
  box-shadow: inset 3px 0 0 var(--azul);
  background: var(--azul-soft);
  outline: none;
}
.section-grid > .dim-row.outcomes-score-row { grid-column: 1 / -1; }
.outcomes-score-row {
  grid-template-columns: 132px minmax(0, 1fr);
}
.outcomes-score-row .outcomes-grid {
  width: 100%;
  align-self: stretch;
}
.outcomes-score-row .dim-name .title {
  white-space: normal;
}
.dim-row.external-input-row {
  grid-template-columns: 150px minmax(0, 1fr);
  max-width: 100%;
}
.dim-row.external-input-row .dim-name .title {
  white-space: normal;
}
/* Multitest sub-row keyboard focus */
.mt-row.mt-kbd-focus { background: var(--azul-soft); border-radius: 4px; outline: 2px solid var(--azul-border); outline-offset: -1px; }
.mt-row.mt-kbd-focus .mt-label { color: var(--azul); font-weight: 700; }
.dim-name { display: flex; align-items: flex-start; gap: 8px; min-width: 0; padding-top: 4px; }
.dim-name .code {
  font-size: 9px;
  font-weight: 700;
  color: var(--teal);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  flex: 0 0 auto;
  padding-top: 2px;
}
.dim-title-stack { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.dim-name .title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 400;
  color: var(--text);
  line-height: 1.15;
  letter-spacing: -0.005em;
  overflow: visible;
  text-overflow: clip;
  white-space: normal;
  overflow-wrap: anywhere;
}
.eval-mode {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  flex-wrap: wrap;
  font-family: var(--font-body);
  font-size: 8px;
  line-height: 1;
  letter-spacing: 0.055em;
  text-transform: uppercase;
  color: var(--text-subtle);
}
.eval-mode .eval-k { font-weight: 850; opacity: 0.78; margin-right: 1px; }
.eval-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 4px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text-muted);
  font-size: 8px;
  font-weight: 900;
  letter-spacing: 0;
}
.eval-pill.s { border-color: rgba(160,123,216,0.35); color: var(--purple); background: rgba(160,123,216,0.10); }
.eval-pill.o { border-color: var(--teal-border); color: var(--teal-bright); background: var(--teal-soft); }
.eval-pill.p { border-color: var(--azul-border); color: var(--azul-light); background: var(--azul-soft); }
.priority-btn {
  width: 20px;
  height: 20px;
  flex: 0 0 auto;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: #fff;
  color: #b8b1ab;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 850;
  line-height: 1;
  cursor: pointer;
  box-shadow: var(--shadow-xs);
  transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease, transform 0.12s var(--ease-out);
}
.priority-btn:hover {
  color: var(--orange);
  border-color: rgba(194,102,13,0.45);
  background: var(--orange-soft);
  transform: translateY(-1px);
}
.priority-btn.active {
  color: #fff;
  background: var(--orange);
  border-color: var(--orange);
  box-shadow: 0 2px 7px rgba(194,102,13,0.22);
}
.priority-btn:disabled {
  opacity: 0.25;
  cursor: default;
  transform: none;
}
.dim-row.prioritized,
.mt-row.prioritized,
.ax-row.prioritized {
  box-shadow: inset 3px 0 0 var(--orange);
}
.dim-scores {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  width: min(100%, 720px);
  margin: 0 auto;
}
.loss-score-grid {
  display: grid;
  gap: 5px;
  width: 100%;
  max-width: 660px;
  margin: 0 auto;
  padding: 8px 10px 9px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: linear-gradient(180deg, #fff, var(--bg-alt));
  box-shadow: var(--shadow-xs);
}
.loss-head,
.loss-row {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) minmax(0, 1fr);
  gap: 6px;
  align-items: center;
}
.loss-head {
  padding: 0 8px;
  color: var(--text-muted);
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.loss-sev {
  font-size: 11px;
  font-weight: 800;
  color: var(--text);
  text-align: right;
}
.loss-chip {
  justify-content: flex-start;
  min-width: 0;
  min-height: 32px;
  padding: 5px 10px 6px;
}
.loss-chip .lbl {
  overflow: visible;
  text-overflow: clip;
  white-space: normal;
  line-height: 1.2;
}
.loss-chip.dep.selected {
  background: linear-gradient(135deg, #475569, #64748b);
  border-color: #475569;
  box-shadow: 0 2px 6px rgba(71,85,105,0.25);
}
.loss-chip.anx.selected {
  background: linear-gradient(135deg, #b85c0a, #d97706);
  border-color: #b85c0a;
  box-shadow: 0 2px 6px rgba(184,92,10,0.24);
}
.content-choice-btn .lbl {
  max-width: 210px;
}
.content-choice-btn .anchor {
  color: var(--text-muted);
}
.content-choice-btn.selected .anchor {
  color: rgba(255,255,255,0.82);
}
.content-spec-slot {
  width: 100%;
  margin: -1px 0 2px;
  padding: 7px 8px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface);
  box-shadow: var(--shadow-xs);
}
.content-spec-stack {
  display: grid;
  gap: 7px;
}
.content-spec-group {
  display: grid;
  gap: 5px;
}
.content-spec-group h4 {
  font-size: 8px;
  font-weight: 850;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-subtle);
}
.content-spec-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.content-spec-pill {
  min-height: 24px;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  background: var(--surface-raised);
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 750;
  line-height: 1.15;
  box-shadow: var(--shadow-xs);
  cursor: pointer;
  transition: border-color .12s ease, background .12s ease, color .12s ease, transform .12s var(--ease-out);
}
.content-spec-pill:hover {
  border-color: var(--azul-border-strong);
  background: var(--azul-soft);
  color: var(--azul-light);
  transform: translateY(-1px);
}
.content-spec-pill.selected {
  border-color: var(--azul-border-strong);
  background: var(--azul-soft-hover);
  color: var(--azul-light);
  box-shadow: var(--shadow);
}
.content-spec-pill.danger.selected {
  border-color: rgba(210,64,58,0.5);
  background: var(--red-soft);
  color: #f0847e;
}
.content-summary {
  width: 100%;
}
.testing-evidence {
  grid-column: 2;
  width: min(100%, 720px);
  margin: -2px auto 0;
  padding: 7px 9px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface);
  box-shadow: var(--shadow-xs);
  color: var(--text-muted);
  font-size: 10px;
  line-height: 1.35;
}
.testing-evidence h4 {
  font-size: 8px;
  font-weight: 850;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-subtle);
  margin-bottom: 5px;
}
.testing-evidence-list {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.testing-evidence-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 24px;
  padding: 4px 8px;
  border: 1px solid var(--border);

/* SCORE BUTTONS — small pills premium */
.s-btn {
  flex: 0 1 auto;
  padding: 3px 10px 4px;
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  background: #fff;
  cursor: pointer;
  font-family: var(--font-body);
  color: var(--text-muted);
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  transition: border-color 0.12s ease, color 0.12s ease, transform 0.12s var(--ease-out), box-shadow 0.12s ease, background 0.12s ease;
  line-height: 1.2;
  font-size: 11px;
  white-space: normal;
  overflow: visible;
  text-align: left;
  box-shadow: var(--shadow-xs);
}
.s-btn:hover {
  border-color: var(--azul-border-strong);
  color: var(--azul);
  background: var(--azul-soft);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}
.s-btn:active { transform: translateY(0); box-shadow: var(--shadow-xs); }
.s-btn .num {
  font-size: 11px;
  font-weight: 700;
  color: var(--text);
  flex: 0 0 auto;
}
.s-btn .lbl {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text);
  flex: 0 0 auto;
  max-width: 26ch;
  overflow: visible;
  text-overflow: clip;
  white-space: normal;
  overflow-wrap: normal;
  word-break: normal;
}
.s-btn .anchor {
  font-size: 10.5px;
  font-weight: 400;
  color: var(--text-muted);
  flex: 1 1 auto;
  overflow: visible;
  text-overflow: clip;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: normal;
}
.s-btn.loss-chip .lbl,
.s-btn.selfcare-chip .lbl,
.s-btn.sensory-chip .lbl,
.s-btn.sleep-chip .lbl,
.s-btn.moas-chip .lbl {
  flex: 1 1 auto;
  max-width: 100%;
  min-width: 0;
  overflow-wrap: break-word;
  word-break: normal;
}
/* Selected states con gradientes sutiles */
.s-btn.selected {
  color: #fff;
  background: var(--azul-grad-subtle);
  border-color: var(--azul);
  box-shadow: var(--shadow-md), 0 0 0 1px rgba(30,58,138,0.15);
  transform: translateY(0);
}
.s-btn.selected .num, .s-btn.selected .lbl, .s-btn.selected .anchor { color: rgba(255,255,255,0.96); }
.s-btn.selected[data-val="-2"] {
  background: linear-gradient(135deg, #b5261a, #d13222);
  border-color: #b5261a;
  box-shadow: 0 2px 6px rgba(181,38,26,0.28), 0 1px 2px rgba(181,38,26,0.16);
}
.s-btn.selected[data-val="-1"] {
  background: linear-gradient(135deg, #b85c0a, #c2660d);
  border-color: #c2660d;
  box-shadow: 0 2px 6px rgba(194,102,13,0.28), 0 1px 2px rgba(194,102,13,0.16);
}
.s-btn.selected[data-val="0"] {
  background: linear-gradient(135deg, #57534e, #706b65);
  border-color: #57534e;
  box-shadow: 0 2px 6px rgba(87,83,78,0.24);
}
.s-btn.selected[data-val="+1"], .s-btn.selected[data-val="1"] {
  background: linear-gradient(135deg, #0e8fa0, #1098ad);
  border-color: var(--teal);
  box-shadow: 0 2px 6px rgba(14,143,160,0.28), 0 1px 2px rgba(14,143,160,0.16);
}
.s-btn.selected[data-val="+2"], .s-btn.selected[data-val="2"] {
  background: var(--azul-grad-subtle);
  border-color: var(--azul);
  box-shadow: 0 2px 8px rgba(30,58,138,0.32), 0 1px 3px rgba(30,58,138,0.18);
}
.s-btn.selected[data-val="3"] {
  background: linear-gradient(135deg, #5e3aa6, #7040c4);
  border-color: #6f2d97;
  box-shadow: 0 2px 6px rgba(110,45,151,0.28);
}
.s-btn.selected[data-val="4"] {
  background: linear-gradient(135deg, #9b1e14, #b5261a);
  border-color: var(--red);
  box-shadow: 0 2px 8px rgba(181,38,26,0.34);
}
.s-btn.ne-btn { opacity: 0.48; padding: 3px 8px 4px; }
.s-btn.ne-btn:hover { opacity: 1; transform: translateY(0); }
.s-btn.ne-btn .num { font-size: 10px; }
.s-btn.ne-btn .lbl { display: none; }
.s-btn.ne-btn.selected { background: #a8a29e; border-color: #a8a29e; color: #fff; opacity: 1; box-shadow: none; }

/* MULTITEST */
.mt-stack { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.mt-row {
  display: grid;
  grid-template-columns: 1fr;
  justify-items: center;
  align-items: stretch;
  gap: 6px;
  padding: 10px 0;
}
.mt-row .mt-label {
  width: min(100%, 720px);
  font-size: 12px;
  color: var(--text);
  font-weight: 600;
  padding-left: 0;
  text-align: center;
  line-height: 1.25;
}
.mt-row .eval-mode,
.ax-row .eval-mode {
  justify-content: center;
  margin-top: 4px;
}
.mt-meta {
  width: min(100%, 720px);
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 5px;
  margin: -2px auto 1px;
  font-size: 9.5px;
  line-height: 1.25;

}

.mt-row .dim-scores,
.ax-row .dim-scores {

}

/* TWO AXIS */
.ax-stack { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.ax-row {
  display: grid;
  grid-template-columns: 1fr;
  justify-items: center;
  align-items: stretch;
  gap: 7px;
  padding: 10px 0;
}
.ax-row .ax-label {
  width: min(100%, 720px);
  font-size: 10.5px;
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding-left: 0;
  text-align: center;
  line-height: 1.25;
  display: flex;
  flex-direction: column;
  align-items: center;
}
/* Multitest + two-axis: parent name como header arriba, alinea pills con dim-rows regulares */
.dim-row.multitest, .dim-row.two-axis {
  display: block;
  padding: 14px 15px;
}
.dim-row.multitest .dim-name, .dim-row.two-axis .dim-name {
  display: inline-flex;
  align-items: baseline;
  justify-content: center;
  gap: 8px;
  padding-top: 0;
  padding-bottom: 9px;
  border-bottom: 1px dashed var(--border);
  margin-bottom: 6px;
  width: 100%;
  text-align: center;
}

/* MULTITEST abbreviated mode (C4) */
.mt-row.collapsed { display: none; }
.dim-row.multitest.expanded .mt-row.collapsed { display: grid; }
.mt-expand-toggle {
  margin-top: 4px;
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--azul);
  background: transparent;
  border: 1px dashed var(--azul-border);
  border-radius: 4px;
  padding: 3px 9px 4px;
  cursor: pointer;
  transition: all 0.15s;
}
.mt-expand-toggle:hover { background: var(--azul-soft); border-color: var(--azul); }
.mt-expand-toggle .chev { display: inline-block; transition: transform 0.18s; margin-right: 4px; }
.dim-row.multitest.expanded .mt-expand-toggle .chev { transform: rotate(90deg); }
/* per-test sweep button — applies "0" to all simple-score multitests with no current value */
.mt-sweep-btn {
  margin-left: 8px;
  font-family: var(--font-body);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  padding: 2px 7px 3px;
  cursor: pointer;
}
.mt-sweep-btn:hover { color: var(--azul); border-color: var(--azul); background: var(--azul-soft); }
.dim-name .mt-meta { font-size: 9.5px; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; margin-left: 8px; }
/* Kbd hint badge shown on focused multitest row */
.dim-row.kbd-focus .mt-enter-hint { display: inline-flex; }
.mt-enter-hint { display: none; align-items: center; gap: 3px; font-size: 9px; color: var(--azul); font-weight: 600; letter-spacing: 0.04em; background: var(--azul-soft); border: 1px solid var(--azul-border); border-radius: 4px; padding: 1px 6px 2px; margin-left: 6px; }
.mt-enter-hint kbd { font-family: var(--font-body); font-weight: 800; background: var(--azul); color: #fff; border-radius: 3px; padding: 0 4px; font-size: 8.5px; }

/* PROFILE — full view (Capa 2 outcomes + HiTOP + summary) */
.profile-block { margin-bottom: 42px; }
.profile-block h2 {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 400;
  color: var(--text);
  letter-spacing: -0.01em;
  margin-bottom: 5px;
  line-height: 1.15;
}
.profile-block .h-sub {
  font-size: 11.5px;
  color: var(--text-muted);
  margin-bottom: 16px;
  line-height: 1.55;
  max-width: 720px;
}
.radar-container { width: 100%; max-width: 720px; margin: 0 auto; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.radar-container svg { display: block; max-width: 100%; height: auto; }

/* PROFILE DASHBOARD — single-screen overview */
.profile-dashboard {
  min-height: calc(100vh - 74px);                /* al menos viewport; crece y la pagina scrollea */
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  grid-template-rows: minmax(82px, auto) minmax(520px, auto) auto auto auto auto;
  grid-template-areas:
    "outcomes outcomes"
    "bmse rdoc"
    "pheno pheno"
    "interpersonal interpersonal"
    "forbes forbes"

}
.dash-pheno { grid-area: pheno; }

/* Collapsible profile-block (MSE report) */

/* ── BRAIN INFERENCE WIDGET (portado de v2) ── */
.brain-fab { position: fixed; bottom: 80px; right: 24px; width: 56px; height: 56px; border-radius: 50%; background: var(--azul); color: #fff; border: none; cursor: pointer; box-shadow: 0 8px 24px rgba(30,58,138,0.25); display: flex; align-items: center; justify-content: center; font-size: 26px; z-index: 250; transition: transform 0.2s ease, box-shadow 0.2s ease; }

.brain-popup { position: fixed; bottom: 148px; right: 24px; width: 380px; max-width: calc(100vw - 32px); max-height: calc(100vh - 180px); background: #fff; border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.25); z-index: 240; display: none; flex-direction: column; overflow: hidden; border: 1px solid var(--border); }
.brain-popup.open { display: flex; animation: brainPopIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes brainPopIn { from { opacity: 0; transform: translateY(12px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
.brain-popup-header { padding: 14px 16px 10px; border-bottom: 1px solid var(--surface); display: flex; align-items: center; justify-content: space-between; }
.brain-popup-title { font-family: var(--font-display); font-size: 16px; font-weight: 400; color: var(--text); letter-spacing: -0.01em; }
.brain-popup-sub { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

/* HITOP grid */

.hitop-row { display: flex; gap: 6px; margin-bottom: 14px; align-items: stretch; }

.hitop-group { display: flex; flex-direction: column; min-width: 0; }
.hitop-group-head {

  font-weight: 700;
  letter-spacing: 0.06em;

.hitop-sub.signal {

}
.hitop-sub.convergent {

}
.hitop-sub.extreme {
  background: linear-gradient(180deg, #fff1f2, #fff7f7);
  border-color: var(--red);
  box-shadow: inset 0 3px 0 rgba(193,18,31,0.9), 0 0 0 1px rgba(193,18,31,0.18);
}
.hitop-sub.support {
  background: linear-gradient(180deg, #eff6ff, #f8fafc);

  box-shadow: inset 0 3px 0 rgba(59,130,246,0.42);
}
.hitop-sub-details {
  width: 100%;

}
.hitop-sub-head {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 5px;

  list-style: none;

}
.hitop-sub-details[open] .hitop-sub-head {

}
.hitop-sub-head::-webkit-details-marker { display: none; }
.hitop-sub-head::marker { content: ''; }
.hitop-sub-toggle {

  border: 1px solid var(--border);

  font-size: 11px;

}
.hitop-sub-toggle::before { content: '+'; }
.hitop-sub-details[open] .hitop-sub-toggle::before { content: '−'; }
.hitop-sub.signal .hitop-sub-toggle { border-color: var(--orange); color: var(--orange); background:#fff7ed; }
.hitop-sub.convergent .hitop-sub-toggle { border-color: var(--orange); color: #9a3412; background:#ffedd5; }
.hitop-sub.extreme .hitop-sub-toggle { border-color: var(--red); color: var(--red); background:#fff1f2; }
.hitop-sub.support .hitop-sub-toggle { border-color: #3b82f6; color: #1d4ed8; background:#eff6ff; }
.hitop-feeders {

}
.hitop-sub-head .sub-dot { width: 9px; height: 9px; border-radius: 50%; background: #a8a29e; }
.hitop-sub.signal .sub-dot { background: var(--orange); box-shadow: 0 0 0 3px rgba(215,106,3,0.18); }
.hitop-sub.convergent .sub-dot { background: #ea580c; box-shadow: 0 0 0 4px rgba(215,106,3,0.25); }
.hitop-sub.extreme .sub-dot { background: var(--red); box-shadow: 0 0 0 4px rgba(193,18,31,0.25); }
.hitop-sub.support .sub-dot { background: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.14); }
.hitop-sub-head .sub-name { font-size: 10.5px; font-weight: 600; color: var(--text); text-align: center; line-height: 1.18; overflow-wrap: anywhere; }
.hitop-sub.signal .sub-name { color: #9a3412; font-weight: 750; }
.hitop-sub.convergent .sub-name { color: #9a3412; font-weight: 820; }
.hitop-sub.extreme .sub-name { color: #991b1b; font-weight: 840; }
.hitop-sub.support .sub-name { color: #1d4ed8; font-weight: 720; }
.hitop-feeders { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; }
.hitop-feeder {

  align-items: center;
  font-weight: 700;
  background: var(--surface);

  padding: 2px 5px;
  border-radius: 4px;
  font-size: 9.5px;

  background: linear-gradient(135deg, #c2410c, #ea580c);

.hitop-feeder.extreme {

.hitop-feeder .feeder-role {

.hitop-feeder .feeder-nivel { font-size: 7.5px; font-weight: 500; line-height: 1; margin-top: 1px; opacity: 0.85; padding: 0 1px; text-align: center; word-break: break-word; }

.profile-stub {

.summary-card .sc-title { color: var(--text); font-weight: 500; }
.summary-card .sc-val {

}
.summary-card .sc-val.ne { background: var(--surface); color: var(--text-subtle); opacity: 0.75; }

#scoreTooltip .tt-num[data-val="4"] { background: var(--red); }
#scoreTooltip .tt-row { margin-bottom: 6px; display: flex; gap: 8px; align-items: baseline; }

#scoreTooltip .tt-label {

.s-btn { cursor: pointer; }

/* ══════════════════════════════════════════════════════
   MOBILE — 720px y menor (touch-first, guardia médica)
   Todos los cambios son ADDITIVE — desktop no se toca.
   ══════════════════════════════════════════════════════ */
@media (max-width: 720px) {

  /* ── Header compacto ── */
  header {
    padding: 10px 14px;
    gap: 8px;
    /* Stack: brand|progress arriba, tabs abajo */
    flex-wrap: wrap;
  }
  .brand .mark { font-size: 22px; }
  .brand .sub { display: none; }  /* ahorra espacio en header */
  .progress { font-size: 10px; }
  .progress .bar { width: 100px; }
  /* Tabs: ocupan su propia fila, centrados */
  .tabs { margin-left: 0; width: 100%; justify-content: center; }
  /* Tab buttons: touch target ≥44px */
  .tab-btn {
    padding: 10px 28px;
    font-size: 12px;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
  }

  /* ── Main: sin margen extra ── */
  main { padding: 10px 12px 120px; }

  /* extra bottom padding para que el bottom bar no tape contenido */

<div id="pmseAccessGate" role="dialog" aria-modal="true" aria-labelledby="pmseGateTitle">
  <form class="pmse-gate-panel" id="pmseGateForm" autocomplete="off">
    <div class="pmse-gate-title" id="pmseGateTitle">pMSE</div>
    <div class="pmse-gate-sub">Acceso privado</div>
    <div class="pmse-gate-row">
      <input id="pmseAccessCode" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="Clave" aria-label="Clave de acceso">

    </div>
    <div class="pmse-gate-error" id="pmseGateError" aria-live="polite"></div>
  </form>

<button id="pmseLockButton" type="button" aria-label="Bloquear acceso">Bloquear</button>
<script>
(() => {
  const ACCESS_HASH = "e267f4c4294d1224f07bd813f09fd98373448b58f8c5aa230fd7f4142c782970";
  const SESSION_KEY = "pmse_access_ok_v1";
  const body = document.body;
  const gate = document.getElementById("pmseAccessGate");
  const form = document.getElementById("pmseGateForm");
  const input = document.getElementById("pmseAccessCode");
  const error = document.getElementById("pmseGateError");
  const lockButton = document.getElementById("pmseLockButton");

  async function sha256(value) {
    const bytes = new TextEncoder().encode(value);
    const digest = await crypto.subtle.digest("SHA-256", bytes);
    return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  function unlock() {
    sessionStorage.setItem(SESSION_KEY, "1");
    body.classList.remove("pmse-locked");
    body.classList.add("pmse-unlocked");
    gate.setAttribute("hidden", "");
  }

  function lock() {
    sessionStorage.removeItem(SESSION_KEY);
    body.classList.add("pmse-locked");
    body.classList.remove("pmse-unlocked");
    gate.removeAttribute("hidden");
    input.value = "";
    input.focus();
  }

  if (sessionStorage.getItem(SESSION_KEY) === "1") {
    unlock();
  } else {
    body.classList.add("pmse-locked");
    setTimeout(() => input.focus(), 0);
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    error.textContent = "";
    const ok = await sha256(input.value.trim()) === ACCESS_HASH;
    if (ok) unlock();
    else {
      error.textContent = "Clave incorrecta.";
      input.select();
    }
  });

  lockButton.addEventListener("click", lock);
})();
</script>

<script>
// ── REORDER: orden de llenado clínico en vivo por pestañas manejables de entrevista
//    Muta el array DIMS in-place al cargar; mantiene scoreRows, navegación por teclado y agrupación sincronizados.
const FILL_SEQUENCE = [
  // 1 · Inicio observable: validez, activación, output, expresión y coherencia
  'NC.conciencia','G.arousal','F2.velocidad','F1.expresividad','E.regulación','G.coherencia',
  // 2 · Valencia positiva
  'F3.drive','F3.anticipación','F3.tono',
  // 3 · Valencia negativa
  'F6.amenaza','F6.frustración','F6.animo-meta','F6.autoevaluación','F6.desesperanza',
  // 4 · Pensamiento y percepción
  'F4.experiencia','F4.contenido','F2.sensorial','F7.testing',
  // 5 · Self e interpersonal
  'F7.coherencia-autobiografica','F7.auto-mentalización','F7.self-integracion','F7.mentalización-otro','P',
  // 6 · Cognición
  'F5.regulación','NC.perfil',
  // 7 · Motor
  'NM.coordinación',
  // 8 · Somático-ritmos
  'G.sueno-ritmo','G.interocepcion','G.apetito',
  // 9 · Funcionalidad
  'FUN.funcionalidad',
  // 10 · Insight / juicio / egodistonía
  'META.enfermedad',
  // 11 · Riesgo
  'EXT.inputs'
];
(function reorderDimsForClinicalFlow(){
  const rank = id => { const i = FILL_SEQUENCE.indexOf(id); return i < 0 ? 999 : i; };
  if (typeof DIMS !== 'undefined' && Array.isArray(DIMS)) DIMS.sort((a, b) => rank(a.id) - rank(b.id));
})();

const SECTION_MAP = {
  'NC.conciencia':'Inicio observable',
  'G.arousal':'Inicio observable',
  'F2.velocidad':'Inicio observable',
  'F1.expresividad':'Inicio observable',
  'E.regulación':'Inicio observable',
  'G.coherencia':'Inicio observable',
  'F3.drive':'Valencia positiva',
  'F3.anticipación':'Valencia positiva',
  'F3.tono':'Valencia positiva',
  'F6.amenaza':'Valencia negativa',
  'F6.frustración':'Valencia negativa',
  'F6.animo-meta':'Valencia negativa',
  'F6.autoevaluación':'Valencia negativa',
  'F6.desesperanza':'Valencia negativa',
  'F4.experiencia':'Pensamiento y percepción',
  'F4.contenido':'Pensamiento y percepción',
  'F2.sensorial':'Pensamiento y percepción',
  'F7.testing':'Pensamiento y percepción',
  'F7.coherencia-autobiografica':'Self e interpersonal',
  'F7.auto-mentalización':'Self e interpersonal',
  'F7.self-integracion':'Self e interpersonal',
  'F7.mentalización-otro':'Self e interpersonal',
  'P':'Self e interpersonal',
  'F5.regulación':'Cognición',
  'NC.perfil':'Cognición',
  'NM.coordinación':'Motor',
  'G.sueno-ritmo':'Somático-ritmos',
  'G.interocepcion':'Somático-ritmos',
  'G.apetito':'Somático-ritmos',
  'FUN.funcionalidad':'Funcionalidad',
  'META.enfermedad':'Insight · juicio · egodistonía',
  'EXT.plan_suicida':'Riesgo',
  'EXT.medios':'Riesgo',
  'EXT.intento_previo':'Riesgo',
  'EXT.soporte':'Riesgo',
  'EXT.hx_violencia':'Riesgo',
  'EXT.sustancias':'Riesgo',
  'EXT.bvc_ruidos':'Riesgo',
  'EXT.bvc_amenaza_verbal':'Riesgo',
  'EXT.bvc_objetos':'Riesgo',
  'EXT.rechazo_ayuda':'Riesgo',
  'EXT.decision_capacidad':'Capacidad',
  'EXT.inputs':'Riesgo'
};

// ── STATE (shared con v2 via localStorage 'bmse_state_v2') ──
function defaultState() {
  const s = {};
  DIMS.forEach(d => {
    if (d.type === 'two_axis') {
      d.axes.forEach(a => { s[a.id] = {score: null}; });
      s[d.id] = {score:null, specifiers:{}};
    } else {
      s[d.id] = {score: null, specifiers: {}};
    }
  });
  if (typeof VIRTUAL_SCORE_DEFINITIONS !== 'undefined') {
    Object.keys(VIRTUAL_SCORE_DEFINITIONS).forEach(id => { s[id] = {score:null, specifiers:{}}; });
  }
  s._timerStart = Date.now();
  return s;
}
function loadState() {
  try {
    const saved = localStorage.getItem('bmse_state_v2');
    if (saved) return JSON.parse(saved);
  } catch (e) {}
  return defaultState();
}
function saveState() {
  localStorage.setItem('bmse_state_v2', JSON.stringify(state));
  if (typeof refreshDerivedOutcomeRows === 'function') refreshDerivedOutcomeRows();
  if (typeof checkRiskInline === 'function') checkRiskInline();
}
let state = loadState();

// Apply canonical order
(function applyOrder() {
  const dimMap = {};
  DIMS.forEach(d => dimMap[d.id] = d);
  const ORDERED = DIM_ORDER.map(id => dimMap[id]).filter(Boolean);
  if (ORDERED.length === DIMS.length) {
    DIMS.length = 0;
    ORDERED.forEach(d => DIMS.push(d));
  }
})();

// ── HELPERS ──
function shortLabel(s, max) {
  if (!s) return '';
  return s;
}
function shortAnchor(text, max) {
  if (!text) return '';
  const firstSentence = text.split(/[.!?](?:\s|$)/)[0].trim();
  const base = firstSentence.length >= 20 ? firstSentence : text;
  return base;
}
function escapeHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escapeAttr(s) { return (s || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function fmtScore(v) {
  if (v === 'NE') return 'NE';
  if (v === null || v === undefined) return '—';
  const n = parseInt(v, 10);
  if (Number.isNaN(n)) return String(v);
  return n > 0 ? '+' + n : String(n);
}

// ── RENDER: SCORE VIEW ──
// Short labels for section-nav chips (C5)
const SECTION_SHORT = {
  'Inicio observable':'Inicio',
  'Valencia positiva':'Val+',
  'Valencia negativa':'Val−',
  'Pensamiento y percepción':'Pens/Perc',
  'Self e interpersonal':'Self/P',
  'Cognición':'Cognición',
  'Motor':'Motor',
  'Somático-ritmos':'Ritmos',
  'Funcionalidad':'Función',
  'Insight · juicio · egodistonía':'Juicio',
  'Riesgo':'Riesgo',
  'Capacidad':'Capacidad'
};
const SECTION_ORDER = [
  'Inicio observable',
  'Valencia positiva',
  'Valencia negativa',
  'Pensamiento y percepción',
  'Self e interpersonal',
  'Cognición',
  'Motor',
  'Somático-ritmos',
  'Funcionalidad',
  'Insight · juicio · egodistonía',
  'Riesgo',
  'Capacidad'
];
function slugSec(s) { return 'sec_' + (s || '').replace(/[^a-z0-9]+/gi,'_'); }
function sectionRank(sec) {
  const i = SECTION_ORDER.indexOf(sec);
  return i >= 0 ? i : 999;
}

function scoreRows() {
  const rows = [];
  DIMS.forEach((d, idx) => {
    if (d.type === 'multitest') {
      d.tests.forEach((test, testIdx) => rows.push({ kind:'test', d, test, idx, testIdx, id:test.id, section: SECTION_MAP[test.id] || SECTION_MAP[d.id] || d.code }));
    } else if (d.type === 'two_axis') {
      const section = SECTION_MAP[d.id] || d.code;
      d.axes.forEach((axis, axisIdx) => rows.push({ kind:'axis', d, axis, idx, axisIdx, id:axis.id, section }));
    } else {
      const section = SECTION_MAP[d.id] || d.code;
      rows.push({ kind:'dim', d, idx, id:d.id, section });
    }
  });
  rows.push({ kind:'risk-outcomes', id:'OUT.riesgo', section:'Riesgo' });
  rows.push({ kind:'capacity-outcome', id:'OUT.capacidad', section:'Capacidad' });
  return rows;
}

function isScoreRowScored(row) {
  if (!row) return false;
  if (row.kind === 'risk-outcomes' || row.kind === 'capacity-outcome') return true;
  if (row.id === 'EXT.decision_capacidad') return isCapacityComplete();
  if (row.id === 'FUN.psp_disruptivas') return isAggressionMoasComplete();
  if (row.kind === 'dim') return isDimScored(row.d);
  const v = state[row.id]?.score;
  return v !== null && v !== undefined;
}

// ── MODO PESTAÑAS: cada sección su propia pantalla + wizard ←/→ ──
let _secOrder = [];
let activeSectionIdx = 0;
function showSection(idx, scroll) {
  if (scroll === undefined) scroll = true;
  if (!_secOrder.length) return;
  idx = Math.max(0, Math.min(_secOrder.length - 1, idx));
  activeSectionIdx = idx;
  _secOrder.forEach((sec, i) => {
    const slug = slugSec(sec);
    const head = document.getElementById(slug);
    const grid = document.getElementById('grid_' + slug);
    const hide = (i !== idx);
    if (head) head.classList.toggle('sec-hidden', hide);
    if (grid) grid.classList.toggle('sec-hidden', hide);
  });
  document.querySelectorAll('.nav-chip').forEach(ch => ch.classList.toggle('nav-chip-active', Number(ch.dataset.secIdx) === idx));
  const prev = document.getElementById('wzPrev'), next = document.getElementById('wzNext'), pos = document.getElementById('wzPos');
  const last = _secOrder.length - 1;
  const shortName = s => (typeof SECTION_SHORT !== 'undefined' && SECTION_SHORT[s]) || s;
  if (prev) prev.disabled = idx === 0;
  if (next) { next.disabled = idx === last; next.innerHTML = idx < last ? (shortName(_secOrder[idx + 1]) + ' →') : 'Siguiente →'; }
  if (pos) pos.textContent = (idx + 1) + ' / ' + _secOrder.length + ' · ' + shortName(_secOrder[idx]);
  if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
}
function navSection(delta) { showSection(activeSectionIdx + delta); }

function renderScoreView() {
  const c = document.getElementById('scoreView');
  // Group score rows by section preserving order.
  const grouped = {};
  const order = [];
  scoreRows().forEach(row => {
    const sec = row.section;
    if (!grouped[sec]) { grouped[sec] = []; order.push(sec); }
    grouped[sec].push(row);
  });
  order.sort((a, b) => sectionRank(a) - sectionRank(b));

  // Build sticky section-nav strip (C5) + keyboard hint (C2) + sweep button (C1)
  let nav = '<nav class="section-nav" id="sectionNav">';
  _secOrder = order.slice();
  order.forEach((sec, i) => {
    const items = grouped[sec];
    const scoredCount = items.filter(isScoreRowScored).length;
    const completeCls = scoredCount === items.length ? 'complete' : '';
    const short = SECTION_SHORT[sec] || sec;

function ensureSelfcareState() {
  if (!state['FUN.psp_autocuidado']) state['FUN.psp_autocuidado'] = { score: null, specifiers: {} };
  if (!state['FUN.psp_autocuidado'].specifiers) state['FUN.psp_autocuidado'].specifiers = {};
  SELFCARE_EXCESS_CHANNELS.forEach(ch => {
    if (!state[ch.id]) state[ch.id] = { score: null, specifiers: {} };
  });
  const hasChannel = SELFCARE_EXCESS_CHANNELS.some(ch => state[ch.id]?.score === '+1' || state[ch.id]?.score === '+2');
  const base = state['FUN.psp_autocuidado']?.score;
  if (!hasChannel && (base === '+1' || base === '+2')) {
    state['FUN.psp_autocuidado_otro'].score = base;
  }
}
function selfcareLabel(ch, val) {
  return val === '+2' ? ch.plus2 : ch.plus1;
}
function syncSelfcareAggregate() {
  ensureSelfcareState();
  const vals = SELFCARE_EXCESS_CHANNELS
    .map(ch => state[ch.id]?.score)
    .filter(v => v === '+1' || v === '+2')
    .map(v => parseInt(v, 10));
  if (vals.length) {
    state['FUN.psp_autocuidado'].score = `+${Math.max(...vals)}`;
  } else if (parseInt(state['FUN.psp_autocuidado'].score, 10) > 0) {
    state['FUN.psp_autocuidado'].score = null;
  }
  SELFCARE_EXCESS_CHANNELS.forEach(ch => {
    const v = state[ch.id]?.score;
    if (v === '+1' || v === '+2') state['FUN.psp_autocuidado'].specifiers[ch.spec] = `${v} ${selfcareLabel(ch, v)}`;
    else delete state['FUN.psp_autocuidado'].specifiers[ch.spec];
  });
}
function selfcareSummary() {
  ensureSelfcareState();
  const parts = SELFCARE_EXCESS_CHANNELS
    .filter(ch => state[ch.id]?.score === '+1' || state[ch.id]?.score === '+2')
    .map(ch => ch.label);
  const score = state['FUN.psp_autocuidado']?.score;
  if (!parts.length) return score ? `Registrado: <strong>A3 = ${score}</strong>` : 'Seleccione un nivel basal o uno o más canales de autocuidado por exceso.';
  return `Registrado: <strong>A3 = ${score}</strong> · exceso: <strong>${parts.join(' + ')}</strong>`;
}

function ensureMoasState() {
  if (!state['FUN.psp_disruptivas']) state['FUN.psp_disruptivas'] = { score: null, specifiers: {} };
  if (!state['FUN.psp_disruptivas'].specifiers) state['FUN.psp_disruptivas'].specifiers = {};
  if (state['FUN.psp_disruptivas'].score === '+2' || state['FUN.psp_disruptivas'].score === '-1' || state['FUN.psp_disruptivas'].score === '-2') state['FUN.psp_disruptivas'].score = '+1';
  if (!state['FUN.oas_hetero_total']) state['FUN.oas_hetero_total'] = { score: null, specifiers: {} };
  if (!state['FUN.oas_auto_total']) state['FUN.oas_auto_total'] = { score: null, specifiers: {} };
}
function moasLevel(ch) {
  ensureMoasState();
  const n = parseInt(state['FUN.psp_disruptivas'].specifiers[ch.spec] || '0', 10);
  return Number.isNaN(n) ? 0 : Math.max(0, Math.min(4, n));
}
function moasTotal() {
  return OAS_CHANNELS.reduce((sum, ch) => sum + moasLevel(ch) * ch.weight, 0);
}
function moasHeteroTotal() {
  return OAS_CHANNELS.filter(ch => ch.group === 'hetero').reduce((sum, ch) => sum + moasLevel(ch) * ch.weight, 0);
}
function moasAutoTotal() {
  return OAS_CHANNELS.filter(ch => ch.group === 'auto').reduce((sum, ch) => sum + moasLevel(ch) * ch.weight, 0);
}
function moasSeverity(total) {
  if (!total) return 'sin agresión cuantificada';
  if (total <= 10) return 'baja';
  if (total <= 22) return 'moderada';
  return 'alta';
}
function clearMoasHetero() {
  ensureMoasState();
  const specs = state['FUN.psp_disruptivas'].specifiers;
  OAS_CHANNELS.forEach(ch => delete specs[ch.spec]);
  delete specs.oas_total;
  delete specs.oas_hetero_total;
  delete specs.oas_auto_total;
  delete specs.psp_heteroagresion;
  delete specs.psp_autoagresion;
  state['FUN.oas_hetero_total'].score = null;
  state['FUN.oas_auto_total'].score = null;
}
function syncMoasTotal() {
  ensureMoasState();
  const total = moasTotal();
  const hetero = moasHeteroTotal();
  const auto = moasAutoTotal();
  const specs = state['FUN.psp_disruptivas'].specifiers;
  if (total > 0) {
    state['FUN.psp_disruptivas'].score = '+1';
    state['FUN.oas_hetero_total'].score = hetero > 0 ? String(hetero) : null;
    state['FUN.oas_auto_total'].score = auto > 0 ? String(auto) : null;
    specs.oas_total = `${total}/40`;
    if (hetero > 0) specs.oas_hetero_total = `${hetero}/28`;
    else delete specs.oas_hetero_total;
    if (auto > 0) specs.oas_auto_total = `${auto}/12`;
    else delete specs.oas_auto_total;
    if (hetero > 0) specs.psp_heteroagresion = `OAS hetero ${hetero}/28`;
    else delete specs.psp_heteroagresion;
    if (auto > 0) specs.psp_autoagresion = `OAS auto ${auto}/12`;
    else delete specs.psp_autoagresion;
  } else {
    state['FUN.oas_hetero_total'].score = null;
    state['FUN.oas_auto_total'].score = null;
    delete specs.oas_total;
    delete specs.oas_hetero_total;
    delete specs.oas_auto_total;
    delete specs.psp_heteroagresion;
    delete specs.psp_autoagresion;
  }
}
function isAggressionMoasComplete() {
  ensureMoasState();
  const cur = state['FUN.psp_disruptivas']?.score;
  if (cur === '+1') return moasTotal() > 0;
  return cur !== null && cur !== undefined;
}
function renderAggressionMoasWidget(test) {
  ensureMoasState();
  const cur = state['FUN.psp_disruptivas']?.score;
  const keys = ['0','+1'];
  let buttons = keys.map(k => {
    const sel = cur !== null && String(cur) === String(k) ? 'selected' : '';
    const label = test.scores[k] || '';
    return `<button class="s-btn ${sel}" data-val="${k}" title="${escapeAttr(label)}" onclick="setMoasBaseScore('${k}',this)"><span class="num">${k}</span><span class="anchor">${label}</span></button>`;
  }).join('');
  const neSel = cur === 'NE' ? 'selected' : '';
  buttons += `<button class="s-btn ne-btn ${neSel}" data-val="NE" onclick="setMoasBaseScore('NE',this)"><span class="num">NE</span><span class="lbl">No eval.</span></button>`;
  const total = moasTotal();
  const hetero = moasHeteroTotal();
  const auto = moasAutoTotal();
  const active = cur === '+1' || total > 0;
  if (!active) return buttons;
  const chip = (ch, level) => {
    const selected = moasLevel(ch) === level;
    const label = ch.levels[level];
    return `<button class="s-btn moas-chip ${ch.key} ${selected ? 'selected' : ''}" data-val="${level}" title="${escapeAttr(label)} · peso x${ch.weight}" onclick="setMoasChannel('${ch.key}',${level},this)"><span class="lbl">${label}</span></button>`;
  };
  const rows = [1,2,3,4].map(level => `
    <div class="moas-row">
      <div class="moas-sev">+${level}</div>
      ${OAS_CHANNELS.map(ch => chip(ch, level)).join('')}
    </div>`).join('');
  return buttons + `<div class="moas-grid">
    <div class="moas-head"><span></span>${OAS_CHANNELS.map(ch => `<span>${ch.label}<br>x${ch.weight}</span>`).join('')}</div>
    ${rows}
    <div class="moas-total">OAS última semana <strong>${total}/40</strong><span>${moasSeverity(total)}</span><span>hetero ${hetero}/28</span><span>auto ${auto}/12</span></div>
  </div>`;
}

function isConcienciaHyperScore(v) {
  const n = parseInt(v, 10);
  return n === 1 || n === 2;
}
function concienciaConfActive(specs) {
  specs = specs || {};
  return !!(specs.CONF || specs.F || specs['O:T'] || specs['O:E'] || specs['O:P']);
}
function clearConcienciaConfSpec() {
  const entry = state['NC.conciencia'];
  if (!entry || !entry.specifiers) return;
  ['CONF','F','O:T','O:E','O:P'].forEach(k => delete entry.specifiers[k]);
}
function syncConcienciaSpecifierForScore(v) {
  if (!isConcienciaHyperScore(v)) clearConcienciaConfSpec();
}
function renderConcienciaSpecifier() {
  if (!state['NC.conciencia']) state['NC.conciencia'] = { score: null, specifiers: {} };
  if (!state['NC.conciencia'].specifiers) state['NC.conciencia'].specifiers = {};
  const cur = state['NC.conciencia'].score;
  if (!isConcienciaHyperScore(cur)) return '';

      <span class="spec-label">Fluctuante o desorientado</span>

}
function setConcienciaConf(on) {
  if (!state['NC.conciencia']) state['NC.conciencia'] = { score: null, specifiers: {} };

  rerenderDimById('NC.conciencia');

};
const EVAL_MODE_LABELS = { S:'Subjetivo', O:'Objetivo', P:'Probado' };
function evalModeFor(id) {
  if (EVAL_MODE_MAP[id]) return EVAL_MODE_MAP[id];
  if (/^NC\./.test(id)) return 'P';
  if (/^NM\./.test(id)) return 'O';
  if (/^FUN\./.test(id)) return 'S+O';
  if (/^EXT\./.test(id)) return 'S+O';
  if (/^F4\./.test(id) || /^F7\./.test(id)) return 'S+P';
  if (/^F[356]\./.test(id) || /^G\./.test(id) || /^P[12]\./.test(id)) return 'S+O';
  return 'S+O';
}
function renderEvalMode(id) {
  const mode = evalModeFor(id);
  if (!mode) return '';
  const parts = mode.split('+').filter(Boolean);
  const title = parts.map(x => `${x}: ${EVAL_MODE_LABELS[x] || x}`).join(' · ');
  return `<div class="eval-mode" title="${escapeAttr(title)}"><span class="eval-k">Eval</span>${parts.map(x => `<span class="eval-pill ${x.toLowerCase()}">${x}</span>`).join('')}</div>`;
}
function renderTitleStack(label, id) {
  return `<div class="dim-title-stack"><div class="title">${label}</div>${renderEvalMode(id)}</div>`;
}

function renderButtonGroup(d, cur, handlerFn, opts) {
  const bipolarOrder = ['-2','-1','0','+1','+2'];
  const convictionOrder = ['0','1','2','3','4'];
  const profileOrder = ['0','-1','-2'];
  let keys;
  if (d.type === 'bipolar' || d.type === 'gate') keys = bipolarOrder.filter(k => k in d.scores);
  else if (d.type === 'conviction') keys = convictionOrder.filter(k => k in d.scores);
  else if (d.type === 'profile') keys = profileOrder.filter(k => k in d.scores);
  else keys = Object.keys(d.scores);
  const detailsSource = (opts && opts.details) ? opts.details : d.details;
  let html = '';
  const isTent = !!(opts && opts.tentative);
  keys.forEach(k => {
    const isSel = cur !== null && String(cur) === String(k);
    let sel = isSel ? 'selected' : '';
    if (isSel && isTent) sel += ' tentative';
    const label = d.scores[k] || '';
    const det = detailsSource ? detailsSource[k] : null;
    const anchor = det ? shortAnchor(det.loQueVes) : '';
    const tip = det && det.loQueVes ? det.loQueVes : '';
    html += `<button class="s-btn ${sel}" data-val="${k}" title="${escapeAttr(tip)}" onclick="${handlerFn(k)}">`;
    html += `<span class="num">${k}</span>`;
    if (label) html += `<span class="lbl">${shortLabel(label)}</span>`;
    if (anchor) html += `<span class="anchor">${anchor}</span>`;
    html += `</button>`;
  });
  const neSel = cur === 'NE' ? 'selected' : '';
  html += `<button class="s-btn ne-btn ${neSel}" data-val="NE" onclick="${handlerFn('NE')}"><span class="num">NE</span><span class="lbl">No eval.</span></button>`;
  return html;
}

function renderTestScoreButtons(test) {
  if (test.id === 'FUN.psp_autocuidado') return renderSelfcareSubtypeGroup(test);
  if (test.id === 'FUN.psp_disruptivas') return renderAggressionMoasWidget(test);
  if (test.id === 'EXT.decision_capacidad') return renderCapacityWidget(test);
  if (!state[test.id]) state[test.id] = { score: null, specifiers: {} };
  const cur = state[test.id]?.score;
  const scoreKeys = test.scoreKeys || ['0','-1','-2'];
  const isCategorical = scoreKeys.some(k => !/^[-+]?\d+$/.test(k));
  const useAnchor = !isCategorical || scoreKeys.some(k => (test.scores[k] || '').length > 22);
  let buttons = '';
  scoreKeys.forEach(k => {
    const sel = cur !== null && String(cur) === String(k) ? 'selected' : '';
    const label = test.scores[k] || '';
    buttons += `<button class="s-btn ${sel}" data-val="${k}" title="${escapeAttr(label)}" onclick="setTestScore('${test.id}','${k}',this)">`;

    if (label) {

      else buttons += `<span class="lbl">${shortLabel(label, 22)}</span>`;

function isCompactExternalTest(test) {

  return keys.some(k => !/^[-+]?\d+$/.test(k));

function renderMultitestRow(d) {
  let inner = `<div class="mt-stack">`;

    const cur = state[test.id]?.score;

    // Stack vertical sólo si: keys numéricas bipolares (no categóricas) Y algún label >45 chars.
    // Categóricas (NO/SI/VAGO/etc.) → siempre inline horizontal.
    // FUN/META/PSP (numérico + labels largos) → stack vertical.
    // NM/NC (numérico + labels cortos) → inline.
    // EXT.inputs (categórico) → inline siempre, sin importar longitud.
    const isCategorical = scoreKeys.some(k => !/^[-+]?\d+$/.test(k));
    const useAnchor = !isCategorical && scoreKeys.some(k => (test.scores[k] || '').length > 45);
    let buttons = '';

      const sel = cur !== null && String(cur) === String(k) ? 'selected' : '';

      buttons += `<span class="num">${k}</span>`;

        if (useAnchor) buttons += `<span class="anchor">${label}</span>`;
        else buttons += `<span class="lbl">${shortLabel(label, 22)}</span>`;

    inner += `<div class="mt-row ${isPriority(test.id) ? 'prioritized' : ''}"><div class="mt-label"><div>${test.label} ${priorityButton(test.id)}</div>${renderEvalMode(test.id)}</div>${renderTestMeta(test)}<div class="dim-scores">${buttons}</div>${renderMotorSpecifiers(test.id)}</div>`;

function setScore(dimId, val, btn) {
  if (!state[dimId]) state[dimId] = { score: null, specifiers: {} };
  state[dimId].score = val;
  if (dimId === 'NC.conciencia') syncConcienciaSpecifierForScore(val);
  clearPriorityIfNoFinding(dimId);
  clearTentative(dimId);                            // confirm tentative → real
  const row = btn.closest('.dim-row');
  row.classList.remove('tentative-only');
  row.querySelectorAll('.dim-scores .s-btn').forEach(b => { b.classList.remove('selected'); b.classList.remove('tentative'); });
  btn.classList.add('selected');
  row.classList.add('scored');
  saveState();
  if (dimId === 'NC.conciencia' || dimId === 'F7.testing') rerenderDimById(dimId);
  if (dimId === 'F3.drive') rerenderAxisRowById('P2.afiliación');
  updateProgress();
}

function rerenderDimById(dimId) {
  const d = DIMS.find(x => x.id === dimId);
  const row = document.getElementById('row_' + dimId);
  if (d && row) row.outerHTML = renderDimRow(d);
}
function rerenderTestRowById(testId) {
  for (const d of DIMS) {
    if (!d.tests) continue;
    const test = d.tests.find(t => t.id === testId);
    const row = document.getElementById('row_' + testId);
    if (test && row) {
      row.outerHTML = renderTestDimRow(d, test);
      return;
    }
  }
}
function rerenderAxisRowById(axisId) {
  for (const d of DIMS) {
    if (!d.axes) continue;
    const axisIdx = d.axes.findIndex(a => a.id === axisId);
    const axis = d.axes[axisIdx];
    const row = document.getElementById('row_' + axisId);
    if (axis && row) {
      row.outerHTML = renderAxisDimRow(d, axis, axisIdx);
      return;
    }
  }
}

    if (cur.length) specs[key] = cur;

  clearPriorityIfNoFinding('FUN.oas_auto_total');

  rerenderTestRowById('FUN.psp_disruptivas');

}
function setMoasChannel(channelKey, level, btn) {

// Sweep: mark all unscored simple bipolar/gate dims as tentative 0 (C1)
function sweepDefaults() {
  let touched = 0;
  DIMS.forEach(d => {
    if (d.type === 'multitest' || d.type === 'two_axis') return;
    // Only sweep dims that support '0' key
    if (!('0' in (d.scores || {}))) return;
    const cur = state[d.id]?.score;
    if (cur === null || cur === undefined) {
      if (!state[d.id]) state[d.id] = { score: null, specifiers: {} };
      state[d.id].score = '0';
      markTentative(d.id);
      touched++;
    }
  });
  if (touched > 0) {
    saveState();
    renderScoreView();
  }
}

// ── KEYBOARD NAVIGATION (C2) ──
// Maps numeric keys to score values per dimension type
const KEY_MAP_BIPOLAR  = { '1':'-2', '2':'-1', '3':'0', '4':'+1', '5':'+2', '0':'NE' };
const KEY_MAP_PROFILE  = { '1':'-2', '2':'-1', '3':'0', '0':'NE' };
const KEY_MAP_CONV     = { '1':'0', '2':'1', '3':'2', '4':'3', '5':'4', '0':'NE' };
let kbdFocusIdx = -1;
function findNextUnscored(fromIdx) {
  for (let i = fromIdx + 1; i < DIMS.length; i++) {
    const d = DIMS[i];
    if (d.type === 'multitest' || d.type === 'two_axis') continue;
    if (!isDimScored(d) || isTentative(d.id)) return i;
  }
  // wrap-around
  for (let i = 0; i <= fromIdx && i < DIMS.length; i++) {
    const d = DIMS[i];
    if (d.type === 'multitest' || d.type === 'two_axis') continue;
    if (!isDimScored(d) || isTentative(d.id)) return i;
  }
  return -1;
}
function setKbdFocus(idx) {
  document.querySelectorAll('.dim-row.kbd-focus').forEach(r => r.classList.remove('kbd-focus'));
  if (idx < 0 || idx >= DIMS.length) { kbdFocusIdx = -1; return; }
  kbdFocusIdx = idx;
  const d = DIMS[idx];
  if (d.type === 'multitest' || d.type === 'two_axis') return;
  if (_secOrder.length && typeof SECTION_MAP !== 'undefined') {
    const si = _secOrder.indexOf(SECTION_MAP[d.id]);
    if (si >= 0 && si !== activeSectionIdx) showSection(si, false);
  }
  const row = document.getElementById('row_' + d.id);
  if (row) {
    row.classList.add('kbd-focus');
    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}
function kbdAdvance(delta) {
  let start = kbdFocusIdx >= 0 ? kbdFocusIdx : -1;
  let idx = start;
  for (let step = 0; step < DIMS.length; step++) {
    idx = (idx + delta + DIMS.length) % DIMS.length;
    const d = DIMS[idx];
    if (d.type === 'multitest' || d.type === 'two_axis') continue;
    setKbdFocus(idx);
    return;
  }
}
// Multitest sub-navigation state
let mtFocusDimIdx = -1;  // DIMS index of the focused multitest dim
let mtFocusTestIdx = -1; // sub-test index within that dim

function enterMtMode(dimIdx) {
  const d = DIMS[dimIdx];
  if (!d || d.type !== 'multitest') return;
  mtFocusDimIdx = dimIdx;
  mtFocusTestIdx = 0;
  highlightMtRow();
}
function exitMtMode() {
  clearMtHighlight();
  mtFocusDimIdx = -1;
  mtFocusTestIdx = -1;
}
function highlightMtRow() {
  clearMtHighlight();
  if (mtFocusDimIdx < 0) return;
  const d = DIMS[mtFocusDimIdx];
  const row = document.getElementById('row_' + d.id);
  if (!row) return;
  const mtRows = row.querySelectorAll('.mt-row');
  if (mtRows[mtFocusTestIdx]) {
    mtRows[mtFocusTestIdx].classList.add('mt-kbd-focus');
    mtRows[mtFocusTestIdx].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}
function clearMtHighlight() {
  document.querySelectorAll('.mt-row.mt-kbd-focus').forEach(r => r.classList.remove('mt-kbd-focus'));
}

document.addEventListener('keydown', (e) => {
  // Ignore when typing in inputs
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  // Only act when score view is visible
  const scoreView = document.getElementById('scoreView');
  if (!scoreView || scoreView.style.display === 'none') return;

  // Global shortcuts (always available): S = sweep, T = confirm tentatives
  if (e.key === 's' || e.key === 'S') {
    e.preventDefault();
    const sweepBtn = document.getElementById('sweepBtn');
    if (sweepBtn && !sweepBtn.disabled) sweepBtn.click();
    return;
  }
  if (e.key === 't' || e.key === 'T') {
    e.preventDefault();
    if (Object.keys(tentative).length > 0) confirmAllTentative();
    return;
  }

  // ── MULTITEST sub-navigation mode ──
  if (mtFocusDimIdx >= 0) {
    const d = DIMS[mtFocusDimIdx];
    if (!d || d.type !== 'multitest') { exitMtMode(); return; }
    const tests = d.tests;
    if (e.key === 'Tab') {
      e.preventDefault();
      if (e.shiftKey) {
        mtFocusTestIdx = (mtFocusTestIdx - 1 + tests.length) % tests.length;
      } else {
        mtFocusTestIdx = (mtFocusTestIdx + 1) % tests.length;
      }
      highlightMtRow();
      return;
    }
    if (e.key === 'Escape' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      exitMtMode();
      // On Escape stay on current dim; on Arrow advance
      if (e.key !== 'Escape') { e.preventDefault(); kbdAdvance(1); }
      return;
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      exitMtMode();
      e.preventDefault();
      kbdAdvance(-1);
      return;
    }
    // Score keys for sub-test: keys 1-5 mapped to available scoreKeys, 0 = NE
    const test = tests[mtFocusTestIdx];
    if (!test) return;
    const scoreKeys = test.scoreKeys || Object.keys(test.scores || {});
    const mtKeyMap = {};
    scoreKeys.forEach((k, i) => { mtKeyMap[String(i + 1)] = k; });
    mtKeyMap['0'] = 'NE';
    if (e.key in mtKeyMap) {
      e.preventDefault();
      const val = mtKeyMap[e.key];
      if (!state[test.id]) state[test.id] = { score: null, specifiers: {} };
      state[test.id].score = val;
      clearPriorityIfNoFinding(test.id);
      saveState();
      // Re-render the dim row
      const row = document.getElementById('row_' + d.id);
      if (row) {
        row.outerHTML = renderMultitestRow(d);
      }
      updateProgress();
      // Advance to next sub-test or exit mt mode if done
      const nextTestIdx = mtFocusTestIdx + 1;
      if (nextTestIdx < tests.length) {
        mtFocusTestIdx = nextTestIdx;
        highlightMtRow();
      } else {
        exitMtMode();
        const nxt = findNextUnscored(mtFocusDimIdx);
        if (nxt >= 0) setKbdFocus(nxt);
      }
    }
    return;
  }

  // ── Normal dim navigation ──
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); kbdAdvance(1); return; }
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); kbdAdvance(-1); return; }
  if (e.key === 'Enter' || e.key === ' ') {
    // If focused dim is a multitest, Enter activates mt mode
    if (kbdFocusIdx >= 0) {
      const d = DIMS[kbdFocusIdx];
      if (d && d.type === 'multitest') {
        e.preventDefault();
        enterMtMode(kbdFocusIdx);
        return;
      }
    }
  }
  if (kbdFocusIdx < 0) return;
  const d = DIMS[kbdFocusIdx];
  if (!d) return;
  // If multitest, Enter activates mt mode (redundant safety)
  if (d.type === 'multitest') {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enterMtMode(kbdFocusIdx); }
    return;
  }
  if (d.type === 'two_axis') return;
  let map = KEY_MAP_BIPOLAR;
  if (d.type === 'conviction') map = KEY_MAP_CONV;
  else if (d.type === 'profile') map = KEY_MAP_PROFILE;
  if (e.key in map) {
    const val = map[e.key];
    if (!(val in d.scores) && val !== 'NE') return;
    e.preventDefault();
    if (d.id === 'F6.animo-meta') {
      if (val === '-2' || val === '-1') setLossChannel('depresivo', val, null);
      else setLossBaseScore(val, null);
      const nxt = findNextUnscored(kbdFocusIdx);
      if (nxt >= 0) setKbdFocus(nxt);
      return;
    }
    if (d.id === 'F4.contenido') {
      const defaults = { '1':'preocupacion', '2':'rumiacion', '3':'sobrevalorada', '4':'delusion' };
      if (defaults[val]) setContentChannel(defaults[val], null);
      else setContentBaseScore(val, null);
      const nxt = findNextUnscored(kbdFocusIdx);
      if (nxt >= 0) setKbdFocus(nxt);
      return;
    }
    if (d.id === 'G.sueno-ritmo') {
      if (val === '+1' || val === '+2') setSleepChannel('insomnio', val, null);
      else setSleepBaseScore(val, null);
      const nxt = findNextUnscored(kbdFocusIdx);
      if (nxt >= 0) setKbdFocus(nxt);
      return;
    }
    // Apply score
    if (!state[d.id]) state[d.id] = { score: null, specifiers: {} };
    state[d.id].score = val;
    if (d.id === 'NC.conciencia') syncConcienciaSpecifierForScore(val);
    clearPriorityIfNoFinding(d.id);
    clearTentative(d.id);
    saveState();
    // Re-render row in place (lightweight)
    const row = document.getElementById('row_' + d.id);
    if (row) {
      row.outerHTML = renderDimRow(d);
      document.getElementById('row_' + d.id).classList.add('kbd-focus');
    }
    updateProgress();
    // Auto-advance
    const nxt = findNextUnscored(kbdFocusIdx);
    if (nxt >= 0) setKbdFocus(nxt);
  }
});
function setTestScore(testId, val, btn) {
  if (testId === 'FUN.psp_autocuidado') {

}
function setAxisScore(axId, val, btn, ai) {

function updateProgress() {
  let scored = 0, tentCount = 0;
  const rows = scoreRows();
  const total = rows.length;
  // Tentatives DO count toward scored (Option α: clinician asserts normal by sweep).
  // But we surface them in a separate badge so the clinician knows what's auto-asserted.
  rows.forEach(row => {
    if (isScoreRowScored(row)) { scored++; if (row.kind === 'dim' && isTentative(row.id)) tentCount++; }
  });
  const allComplete = scored === total && tentCount === 0;
  const txt = tentCount > 0 ? `${scored} / ${total} · ${tentCount} tent.` : `${scored} / ${total}`;
  document.getElementById('progressText').textContent = txt;
  document.getElementById('progressFill').style.width = `${(scored/total)*100}%`;
  // Section counts in headers + complete state for collapse toggle
  document.querySelectorAll('.section-head').forEach(h => {
    const secName = h.querySelector('span:first-child').textContent;
    let items = 0, sc = 0;
    rows.forEach(row => {
      if (row.section === secName) { items++; if (isScoreRowScored(row)) sc++; }
    });
    const cEl = h.querySelector('.count');
    if (cEl) cEl.textContent = `${sc}/${items}`;
    const isComplete = sc === items && items > 0;
    h.classList.toggle('sec-complete', isComplete);
  });
  // Section-nav chips (C5)
  document.querySelectorAll('.section-nav .nav-chip').forEach(chip => {
    const secName = chip.getAttribute('data-sec');
    let items = 0, sc = 0;
    rows.forEach(row => {
      if (row.section === secName) { items++; if (isScoreRowScored(row)) sc++; }
    });
    const cntEl = chip.querySelector('.nav-count');
    if (cntEl) cntEl.textContent = `${sc}/${items}`;
    chip.classList.toggle('complete', sc === items && items > 0);
  });
  // Sweep button label updates
  const sweepBtn = document.getElementById('sweepBtn');
  if (sweepBtn) {
    let unscored = 0;
    DIMS.forEach(d => {
      if (d.type === 'multitest' || d.type === 'two_axis') return;
      if (!('0' in (d.scores || {}))) return;
      const cur = state[d.id]?.score;
      if (cur === null || cur === undefined) unscored++;
    });
    if (tentCount > 0) {
      sweepBtn.textContent = `Confirmar ${tentCount} tent.`;
      sweepBtn.title = 'Confirma todas las dimensiones marcadas como tentativas (cambia borde punteado a sólido). Cuenta como 1 click.';
      sweepBtn.onclick = confirmAllTentative;
      sweepBtn.disabled = false;
    } else if (unscored > 0) {
      sweepBtn.textContent = `Marcar ${unscored} normales`;
      sweepBtn.title = 'Marca todas las dimensiones bipolares no puntuadas como 0 (normal) en estado tentativo. Cambia a confirmadas con un click.';
      sweepBtn.onclick = sweepDefaults;
      sweepBtn.disabled = false;
    } else {
      sweepBtn.textContent = 'Todo puntuado';
      sweepBtn.disabled = true;
    }
  }
  // Update collapse-all button visibility
  updateCollapseAllBtn();
  // Sync mobile action bar (no-op en desktop por CSS)
  if (typeof syncMobileBar === 'function') syncMobileBar();
  // Completion CTA: show "Ver perfil" badge when all dims scored with no tentatives
  let ctaEl = document.getElementById('completionCta');
  if (allComplete) {
    if (!ctaEl) {
      ctaEl = document.createElement('button');
      ctaEl.id = 'completionCta';
      ctaEl.className = 'completion-cta';
      ctaEl.onclick = () => showView('profile');
      document.getElementById('progressText').insertAdjacentElement('afterend', ctaEl);
    }
    ctaEl.textContent = 'Ver perfil →';
    ctaEl.style.display = '';
  } else if (ctaEl) {
    ctaEl.style.display = 'none';
  }
}

// Confirm all tentative in one click (Option β — companion to sweep)

  Object.keys(tentative).forEach(id => clearTentative(id));

}

// New registro: limpia state y empieza fresh (confirmación obligatoria)
function backupState() {
  try { if (localStorage.getItem('bmse_state_v2')) localStorage.setItem('bmse_state_v2_backup', JSON.stringify({ ts: Date.now(), state: state })); } catch(e){}
}
function newRegistro() {
  if (!confirm('¿Limpiar la evaluación actual y empezar un nuevo registro?\n\nSe guardará un respaldo recuperable del registro actual.')) return;
  backupState();
  localStorage.removeItem('bmse_state_v2');

    Object.keys(tentative).forEach(k => delete tentative[k]);
  }

function restoreBackup() {
  let bk; try { bk = JSON.parse(localStorage.getItem('bmse_state_v2_backup')); } catch(e){}
  if (!bk || !bk.state) { alert('No hay registro anterior para recuperar.'); return; }

// Alerta de riesgo INLINE: surfacea suicidio/violencia mientras puntúas (no solo en Perfil)
function checkRiskInline() {
  const b = document.getElementById('riskBanner'); if (!b) return;
  const items = [];
  try { const s = outcomeSuicidio(); if (s && (s.status === 'red' || s.status === 'yellow')) items.push({ t:'Riesgo suicida', sum: s.summary || '' }); } catch(e){}
  try { const a = outcomeAgresividad(); if (a && (a.status === 'red' || a.status === 'yellow')) items.push({ t:'Riesgo de violencia', sum: a.summary || '' }); } catch(e){}
  if (!items.length) { b.style.display = 'none'; b.innerHTML = ''; return; }
  let worst = 'yellow';
  try { if ((outcomeSuicidio()||{}).status === 'red' || (outcomeAgresividad()||{}).status === 'red') worst = 'red'; } catch(e){}
  b.className = 'risk-banner ' + worst;
  b.innerHTML = '<span class="rb-ico">⚠</span><div class="rb-items">' +
    items.map(i => '<span class="rb-item"><b>'+i.t+':</b> '+i.sum+'</span>').join('') +
    '</div><button class="rb-link" onclick="showView(\'profile\')">Ver perfil →</button>';
  b.style.display = 'flex';
}

// ── VIEW TOGGLE ──
function showView(view) {
  document.body.classList.toggle('profile-mode', view === 'profile');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  const sv = document.getElementById('scoreView');
  const pv = document.getElementById('profileView');
  sv.style.display = 'none'; pv.style.display = 'none';
  let el;
  if (view === 'profile') { renderProfile(); el = pv; }
  else { el = sv; }
  el.style.display = '';
  el.style.opacity = '0';
  el.style.transform = 'translateY(5px)';
  requestAnimationFrame(() => {
    el.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
    el.style.opacity = '1';
    el.style.transform = 'translateY(0)';
  });
}

function renderOutcomeCard(o) {
  const statusLabel = o.statusLabel || (o.status === 'red' ? 'Activo' : o.status === 'yellow' ? 'Vigilar' : 'Sin señal');
