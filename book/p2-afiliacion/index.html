<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=../p1-p2-circumplejo-interpersonal/">
  <title>P2.afiliación integrado en P1/P2</title>
  <style>
    :root {
      --paper: #fbfbf8;
      --ink: #111827;
      --muted: #64748b;
      --line: #d8dee8;
      --panel: #ffffff;
      --soft: #eef4f2;
      --accent: #0f766e;
      --accent-ink: #0b4f4a;
      --discussion: #394150;
      --warn: #8a4b0f;
      --warn-bg: #fff7e6;
      --code-bg: #eef1f4;
      --radius: 8px;
      --shadow: 0 18px 42px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--paper); color: var(--ink); }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.66;
      background: var(--paper);
      color: var(--ink);
    }
    a { color: var(--accent-ink); text-underline-offset: 3px; }
    .layout { display: grid; grid-template-columns: minmax(230px, 300px) minmax(0, 1fr); min-height: 100vh; }
    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 28px 20px;
      border-right: 1px solid var(--line);
      background: #ffffff;
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; color: var(--accent-ink); font-weight: 850; }
    .mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--accent);
      border-radius: 7px;
      background: var(--soft);
      font-size: 12px;
      font-weight: 900;
    }
    nav { display: grid; gap: 4px; font-size: 14px; }
    nav a { display: block; padding: 8px 10px; border-radius: 7px; color: #334155; text-decoration: none; }
    nav a:hover { background: var(--soft); color: var(--accent-ink); }
    .meta-small { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.5; }
    main { padding: 54px min(7vw, 82px) 82px; }
    .article { max-width: 980px; margin: 0 auto; }
    header { margin-bottom: 34px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
    .kicker { color: var(--accent-ink); font-size: 13px; font-weight: 850; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; }
    h1 { margin: 0 0 14px; font-size: clamp(34px, 6vw, 68px); line-height: 1; letter-spacing: 0; max-width: 960px; }
    .subtitle { max-width: 860px; color: #334155; font-size: 19px; line-height: 1.55; margin: 0 0 22px; }
    .status-row { display: flex; flex-wrap: wrap; gap: 10px; color: var(--muted); font-size: 13px; }
    .pill { display: inline-flex; align-items: center; min-height: 30px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 7px; background: #ffffff; color: #334155; font-weight: 700; }
    section.hoja { padding: 34px 0; border-bottom: 1px solid var(--line); }
    section.hoja:last-of-type { border-bottom: 0; }
    h2 { margin: 0 0 16px; font-size: clamp(24px, 3vw, 36px); line-height: 1.14; letter-spacing: 0; }
    .panel-body h2 { margin-top: 24px; font-size: 24px; }
    .panel-body h2:first-child { margin-top: 0; }
    h3 { margin: 22px 0 10px; font-size: 19px; line-height: 1.22; letter-spacing: 0; }
    p { margin: 0 0 15px; font-size: 16.5px; }
    ul, ol { margin: 0 0 18px 22px; padding: 0; }
    li { margin: 7px 0; font-size: 16px; }
    blockquote {
      margin: 20px 0;
      padding: 17px 20px;
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      background: #ffffff;
      box-shadow: var(--shadow);
      color: #172033;
      font-weight: 720;
    }
    code {
      padding: 0.12em 0.34em;
      border-radius: 5px;
      background: var(--code-bg);
      color: #0f172a;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.92em;
    }
    .panel-stack { display: grid; gap: 18px; }
    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.05);
      overflow: hidden;
    }
    .panel-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); background: #f8fafc; }
    .panel-title { color: #172033; font-size: 13px; font-weight: 850; text-transform: uppercase; letter-spacing: 0.08em; }
    .panel-sub { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .panel-body { padding: 20px 20px 22px; overflow-x: auto; }
    .panel.discussion .panel-head { background: #f1f5f9; }
    .panel.discussion .panel-title { color: var(--discussion); }
    table { width: 100%; border-collapse: collapse; min-width: 620px; font-size: 14px; line-height: 1.45; }
    th, td { padding: 12px 13px; vertical-align: top; border-bottom: 1px solid var(--line); text-align: left; }
    th { background: #e6eeec; color: #172033; font-weight: 850; }
    tr:last-child td { border-bottom: 0; }
    .scroll-x { overflow-x: auto; margin: 16px 0 20px; }
    .empty { color: var(--muted); font-style: italic; }
    .contract-note,
    .source-warning {
      margin: 18px 0;
      padding: 15px 17px;
      border-left: 4px solid var(--warn);
      border-radius: var(--radius);
      background: var(--warn-bg);
      color: var(--warn);
      font-weight: 700;
    }
    footer { margin-top: 46px; padding-top: 24px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

    body.pmse-locked > *:not(#pmseAccessGate):not(script) { display: none !important; }
    #pmseAccessGate {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #pmseAccessGate[hidden] { display: none !important; }
    .pmse-gate-panel {
      width: min(420px, 100%);
      border: 1px solid rgba(255,255,255,0.18);
      background: #111827;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.42);
    }
    .pmse-gate-title { font-size: 30px; line-height: 1; margin-bottom: 8px; font-weight: 850; }
    .pmse-gate-sub { color: #cbd5e1; font-size: 13px; margin-bottom: 18px; }
    .pmse-gate-row { display: flex; gap: 10px; }
    .pmse-gate-row input {
      flex: 1;
      min-width: 0;
      border: 1px solid rgba(255,255,255,0.22);
      background: #020617;
      color: #f8fafc;
      border-radius: 6px;
      padding: 12px 13px;
      font: inherit;
    }
    .pmse-gate-row button,
    #pmseLockButton {
      border: 1px solid #5eead4;
      background: #2dd4bf;
      color: #042f2e;
      border-radius: 6px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .pmse-gate-error { min-height: 18px; color: #fca5a5; font-size: 12px; margin-top: 10px; }
    #pmseLockButton {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 90;
      padding: 8px 10px;
      font-size: 11px;
      opacity: 0.74;
    }
    body.pmse-locked #pmseLockButton { display: none; }
    @media (max-width: 980px) {
      .layout { display: block; }
      aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      main { padding: 36px 22px 60px; }
    }
    @media print {
      aside, #pmseAccessGate, #pmseLockButton { display: none !important; }
      body { background: #ffffff; }
      body.pmse-locked > *:not(#pmseAccessGate):not(script) { display: block !important; }
      .layout { display: block; }
      main { padding: 0; }
      .article { max-width: none; }
      .panel { box-shadow: none; break-inside: avoid; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body class="pmse-locked">

  <div id="pmseAccessGate" role="dialog" aria-modal="true" aria-labelledby="pmseGateTitle">
    <form class="pmse-gate-panel" id="pmseGateForm" autocomplete="off">
      <div class="pmse-gate-title" id="pmseGateTitle">pMSE Book</div>
      <div class="pmse-gate-sub">Acceso privado - P2.afiliación integrado en P1/P2</div>
      <div class="pmse-gate-row">
        <input id="pmseAccessCode" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="Clave" aria-label="Clave de acceso">
        <button type="submit">Entrar</button>
      </div>
      <div class="pmse-gate-error" id="pmseGateError" aria-live="polite"></div>
    </form>
  </div>
  <button id="pmseLockButton" type="button" aria-label="Bloquear acceso">Bloquear</button>
  <script>
  (() => {
    const ACCESS_HASH = "e267f4c4294d1224f07bd813f09fd98373448b58f8c5aa230fd7f4142c782970";
    const SESSION_KEY = "pmse_access_ok_v1";
    const body = document.body;
    const gate = document.getElementById("pmseAccessGate");
    const form = document.getElementById("pmseGateForm");
    const input = document.getElementById("pmseAccessCode");
    const error = document.getElementById("pmseGateError");
    const lockButton = document.getElementById("pmseLockButton");
    async function sha256(value) {
      const bytes = new TextEncoder().encode(value);
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, "0")).join("");
    }
    function unlock() {
      sessionStorage.setItem(SESSION_KEY, "1");
      body.classList.remove("pmse-locked");
      body.classList.add("pmse-unlocked");
      gate.setAttribute("hidden", "");
    }
    function lock() {
      sessionStorage.removeItem(SESSION_KEY);
      body.classList.add("pmse-locked");
      body.classList.remove("pmse-unlocked");
      gate.removeAttribute("hidden");
      input.value = "";
      input.focus();
    }
    if (sessionStorage.getItem(SESSION_KEY) === "1") unlock();
    else setTimeout(() => input.focus(), 0);
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.textContent = "";
      const ok = await sha256(input.value.trim()) === ACCESS_HASH;
      if (ok) unlock();
      else {
        error.textContent = "Clave incorrecta.";
        input.select();
      }
    });
    lockButton.addEventListener("click", lock);
  })();
  </script>
  <main class="article" style="padding:48px 22px">
    <h1>P2.afiliación integrado en P1/P2</h1>
    <p>Este ítem vive ahora dentro del subcapítulo integrado del circumplejo interpersonal.</p>
    <p><a href="../p1-p2-circumplejo-interpersonal/">Abrir subcapítulo integrado</a></p>
  </main>
</body>
</html>
