// New registro: limpia state y empieza fresh (confirmación obligatoria)
function backupState() {
  try { if (localStorage.getItem('bmse_state_v2')) localStorage.setItem('bmse_state_v2_backup', JSON.stringify({ ts: Date.now(), state: state })); } catch(e){}
}
function newRegistro() {
  if (!confirm('¿Limpiar la evaluación actual y empezar un nuevo registro?\n\nSe guardará un respaldo recuperable del registro actual.')) return;
  backupState();
  localStorage.removeItem('bmse_state_v2');
  state = defaultState();
  if (typeof tentative === 'object' && tentative) {
    Object.keys(tentative).forEach(k => delete tentative[k]);
  }
  renderScoreView();
  showView('score');
  if (typeof syncMobileBar === 'function') syncMobileBar();
  if (typeof checkRiskInline === 'function') checkRiskInline();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function restoreBackup() {
  let bk; try { bk = JSON.parse(localStorage.getItem('bmse_state_v2_backup')); } catch(e){}
  if (!bk || !bk.state) { alert('No hay registro anterior para recuperar.'); return; }
  if (!confirm('¿Recuperar el registro anterior? Reemplaza la evaluación actual.')) return;
  state = bk.state;
  saveState();
  localStorage.removeItem('bmse_state_v2_backup');
  renderScoreView();
  showView('score');
  if (typeof syncMobileBar === 'function') syncMobileBar();
}
// Alerta de riesgo INLINE: surfacea suicidio/violencia mientras puntúas (no solo en Perfil)
function checkRiskInline() {
  const b = document.getElementById('riskBanner'); if (!b) return;
  const items = [];
  try { const s = outcomeSuicidio(); if (s && (s.status === 'red' || s.status === 'yellow')) items.push({ t:'Riesgo suicida', sum: s.summary || '' }); } catch(e){}
  try { const a = outcomeAgresividad(); if (a && (a.status === 'red' || a.status === 'yellow')) items.push({ t:'Riesgo de violencia', sum: a.summary || '' }); } catch(e){}
  if (!items.length) { b.style.display = 'none'; b.innerHTML = ''; return; }
  let worst = 'yellow';
  try { if ((outcomeSuicidio()||{}).status === 'red' || (outcomeAgresividad()||{}).status === 'red') worst = 'red'; } catch(e){}
  b.className = 'risk-banner ' + worst;
  b.innerHTML = '<span class="rb-ico">⚠</span><div class="rb-items">' +
    items.map(i => '<span class="rb-item"><b>'+i.t+':</b> '+i.sum+'</span>').join('') +
    '</div><button class="rb-link" onclick="showView(\'profile\')">Ver perfil →</button>';
  b.style.display = 'flex';
}

// ── VIEW TOGGLE ──
function showView(view) {
  document.body.classList.toggle('profile-mode', view === 'profile');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  const sv = document.getElementById('scoreView');
  const pv = document.getElementById('profileView');
  const dv = document.getElementById('demoView');
  sv.style.display = 'none'; pv.style.display = 'none'; if (dv) dv.style.display = 'none';
  let el;
  if (view === 'profile') { renderProfile(); el = pv; }
  else if (view === 'demo') { renderDemo(); el = dv; }
  else { el = sv; }
  el.style.display = '';
  el.style.opacity = '0';
  el.style.transform = 'translateY(5px)';
  requestAnimationFrame(() => {

function dashboardFeederApplies(d) {
  if (!d.spec) return true;
  const specVal = state[d.id]?.specifiers?.[d.spec];
  if (!specVal) return !d.specRequired;
  return d.specIn ? d.specIn.includes(specVal) : !!specVal;
}

function dashboardRadarVisualValue(d, raw) {
  if (d.id === 'F4.contenido') return raw - 2;
  if (d.visual === 'activation') return Math.abs(raw);
  if (d.visual === 'deactivation') return -Math.abs(raw);
  if (d.id === 'G.sueno-insomnio') return -Math.abs(raw);
  if (d.id === 'G.sueno-necesidad-reducida') return Math.abs(raw);
  if (d.id === 'G.sueno-ritmo' && raw > 0) {
    const insomnia = typeof stateRawNumber === 'function' ? stateRawNumber('G.sueno-insomnio') : null;
    const reduced = typeof stateRawNumber === 'function' ? stateRawNumber('G.sueno-necesidad-reducida') : null;
    const vals = [];
    if (insomnia > 0) vals.push(-Math.abs(insomnia));
    if (reduced > 0) vals.push(Math.abs(reduced));
    if (vals.length && typeof strongestSignedScore === 'function') return strongestSignedScore(vals);
  }
  return raw;
}

function dashboardMapFeederMagnitude(d) {
  if (!dashboardFeederApplies(d)) return null;
  const raw = typeof resolveFeederRaw === 'function'
    ? resolveFeederRaw(d)
    : (() => {
        const s = state[d.id]?.score;
        if (s === null || s === undefined || s === 'NE') return null;
        const n = parseInt(s, 10);
        return Number.isNaN(n) ? null : n;
      })();
  if (raw === null || raw === undefined) return null;
  if (d.pole === 'neg' && raw >= 0) return null;
  if (d.pole === 'pos' && raw <= 0) return null;
  if (d.inv && raw >= 0) return null;
  if (d.minPath && Math.abs(raw) < d.minPath) return null;
  const priority = typeof isPrioritySource === 'function' ? isPrioritySource(d.id) : false;
  const pWeight = priority && typeof priorityWeightForSource === 'function' ? priorityWeightForSource(d.id) : 1;
  return {
    magnitude: Math.max(0, Math.min(2, Math.abs(dashboardRadarVisualValue(d, raw)))),
    weight: (d.w || 1) * pWeight
  };
}

function dashboardMapConstructScore(dims) {
  const vals = (dims || []).filter(d => !d.tooltipOnly).map(dashboardMapFeederMagnitude).filter(Boolean);
  if (!vals.length) return 0;
  const totalWeight = vals.reduce((sum, v) => sum + v.weight, 0);
  const weighted = vals.reduce((sum, v) => sum + v.magnitude * v.weight, 0);
  return Math.max(0, Math.min(2, totalWeight ? weighted / totalWeight : 0));
}

function dashboardHiTOPSubfactorActivation(label) {
  if (typeof getFeederSignal !== 'function') return dashboardMapConstructScore(HITOP_MAP[label]);
  const feeders = HITOP_MAP[label] || [];
  const feederData = feeders.map((d, i) => getFeederSignal(d, label, i));
  let numerator = 0;
  let denominator = 0;
  const counts = {central:0, bridge:0, complementary:0};
  const baseCounts = {central:0, bridge:0, complementary:0};
  feeders.forEach((d, i) => {
    if (typeof feederGateApplies === 'function' && !feederGateApplies(d)) return;
    if (d.spec) {
      const specVal = state[d.id]?.specifiers?.[d.spec];
      if (!specVal && d.specRequired) return;
      if (specVal && d.specIn && !d.specIn.includes(specVal)) return;
    }
    const raw = typeof resolveFeederRaw === 'function' ? resolveFeederRaw(d) : null;
    if (state[d.id]?.score === 'NE') return;
    const fd = feederData[i];
    const roleWeight = fd.roleWeight || (typeof hitopRoleWeight === 'function' ? hitopRoleWeight(fd.role) : 1);
    const priority = typeof isPrioritySource === 'function' ? isPrioritySource(d.id) : false;
    const priorityWeight = priority && typeof priorityWeightForSource === 'function' ? priorityWeightForSource(d.id) : 1;
    const weight = (d.w || 1) * roleWeight * priorityWeight;
    if (baseCounts[fd.role] !== undefined) baseCounts[fd.role] += 1;
    denominator += weight * 2;
    if (raw === null || raw === undefined) return;
    const magnitude = typeof hitopPathMagnitude === 'function'
      ? hitopPathMagnitude(fd)
      : (fd.evaluated && fd.signal ? Math.max(0, Math.min(2, fd.pathVal || 0)) : 0);
    numerator += weight * magnitude;
    if (magnitude > 0 && counts[fd.role] !== undefined) counts[fd.role] += 1;
  });
  const pct = denominator ? Math.round((numerator / denominator) * 100) : 0;
  const score = Math.max(0, Math.min(2, denominator ? (numerator / denominator) * 2 : 0));
  return {score, pct, ...counts, base:baseCounts};
}

function dashboardHiTOPSubfactorScore(label) {
  const activation = dashboardHiTOPSubfactorActivation(label);
  return typeof activation === 'number' ? activation : activation.score || 0;
}

function dashboardDimensionScores(map, groups, mode) {
  if (!map) return [];
  const labels = Object.keys(map);
  return labels.map((label, index) => {
    const activation = mode === 'hitop' ? dashboardHiTOPSubfactorActivation(label) : null;
    const score = mode === 'hitop' ? activation.score : dashboardMapConstructScore(map[label]);
    const group = groups?.find(g => index >= g.from && index <= g.to);
    const clean = label.replace(/\n/g, ' ').replace('Cognición Bedside', 'Cognición');
    return {
      label: clean,
      pct: mode === 'hitop' ? activation.pct : Math.round(Math.min(1, score / 2) * 100),
      score,
      color: group?.color || '#94a3b8',
      group: group?.name || '',
      index,
      activation
    };
  });
}

function dashboardTopDimensionScores(map, groups, mode) {
  return dashboardDimensionScores(map, groups, mode)
    .filter(x => x.pct > 0)
    .sort((a,b) => b.pct - a.pct || b.score - a.score || a.label.localeCompare(b.label));
}

function dashboardTopGroupScores(map, groups, mode) {
  if (!map || !groups) return [];
  const dims = dashboardDimensionScores(map, groups, mode);
  return groups.map(group => {
    const members = dims.filter(d => d.index >= group.from && d.index <= group.to);
    const active = members.filter(d => d.pct > 0);
    if (!active.length) return null;
    const total = active.reduce((sum, d) => sum + d.score, 0);
    const score = total / active.length;
    const pct = Math.round(active.reduce((sum, d) => sum + d.pct, 0) / active.length);
    const top = active.slice().sort((a,b) => b.pct - a.pct || b.score - a.score).slice(0, 2);
    return {
      label: group.name,
      pct,
      score,
      color: group.color || '#94a3b8',
      trace: top.map(d => `${d.label} ${d.pct}%`).join(' · ')
    };
  }).filter(Boolean).sort((a,b) => b.pct - a.pct || b.score - a.score || a.label.localeCompare(b.label));
}

function dashboardDomainPills(items, emptyText, limit=3) {
  if (!items.length) return `<div class="pheno-empty">${emptyText}</div>`;
  return items.slice(0, limit).map((a, i) => {
    const roleTrace = a.activation && typeof a.activation === 'object'
      ? ` · C${a.activation.central || 0}/${a.activation.base?.central || 0} P${a.activation.bridge || 0}/${a.activation.base?.bridge || 0} S${a.activation.complementary || 0}/${a.activation.base?.complementary || 0}`
      : '';
    const trace = a.trace ? ` · ${a.trace}` : '';
    return `<div class="pill rank-${i+1}" title="${escapeAttr(`${a.label}${a.group ? ` · ${a.group}` : ''} · score ${Math.round(a.score * 10) / 10}/2${roleTrace}${trace}`)}">
    <span class="pk">${i+1}</span>
    <span class="dt" style="background:${a.color || '#94a3b8'}"></span>
    <span class="lb">${a.label}</span>
    <span class="pc">${a.pct}%</span>
  </div>`;
  }).join('');
}

function bmseLatentValue(vec, id) {
  if (!vec || vec[id] === undefined || vec[id] === null || Number.isNaN(+vec[id])) return null;
  let v = +vec[id];
  if (id === 'F4.contenido') v = Math.max(0, Math.min(2, v / 2));
  return Math.max(-2, Math.min(2, v));
}

function scoreBmseLatentMicro(vec, micro) {
  let score = 0, denom = 0, hits = 0;
  const entries = Object.entries(micro.weights);
  entries.forEach(([id, weight]) => {
    const v = bmseLatentValue(vec, id);
    if (v === null) return;
    const aligned = Math.max(0, Math.sign(weight) * v);
    score += aligned * Math.abs(weight);
    denom += 2 * Math.abs(weight);
    if (aligned > 0.05) hits += 1;
  });
  const rawPct = denom ? Math.min(1, score / denom) : 0;
  const coverage = entries.length ? Math.min(1, hits / entries.length) : 0;
  const pct = Math.round(rawPct * (0.55 + 0.45 * coverage) * 100);
  return {
    id: micro.id,
    label: micro.meso,
    microLabel: micro.label,
    macro: micro.macro,
    meso: micro.meso,
    color: micro.color,
    pct,
    score,
    hits,
    trace: `${micro.id} · ${micro.label}`,
    replica: 'real PMC n=464'
  };
}

function bmseLatentTaxonomyProfile(vec) {
  const micros = BMSE_LATENT_MICROS
    .map(micro => scoreBmseLatentMicro(vec, micro))
    .filter(m => m.pct > 0 || m.hits > 0)
    .sort((a, b) => b.pct - a.pct || b.hits - a.hits || b.score - a.score || a.id.localeCompare(b.id));

  const topMicros = micros.slice(0, 3).map(m => ({...m, label: m.microLabel}));
  const groupBest = (field) => {
    const groups = {};
    micros.forEach(m => {
      const key = m[field];
      if (!groups[key] || m.pct > groups[key].pct || (m.pct === groups[key].pct && m.score > groups[key].score)) {
        groups[key] = {label: key, pct: m.pct, score: m.score, color: m.color, trace: `${m.id} · ${m.microLabel}`, replica: 'real PMC n=464'};
      }
    });
    return Object.values(groups).sort((a, b) => b.pct - a.pct || b.score - a.score || a.label.localeCompare(b.label));
  };

  const macros = groupBest('macro');
  const mesos = groupBest('meso').slice(0, 3);
  return { macro: macros[0] || null, mesosTop: mesos, microsTop: topMicros };
}

function renderDashboardPhenotypeBlock(_vec) {
  if (typeof PHENO === 'undefined' || typeof matchPhenotype !== 'function' || typeof buildPhenotypeVector !== 'function') return '';
  const vec = _vec || buildPhenotypeVector();
  const res = matchPhenotype(vec, PHENO, (typeof NORM !== 'undefined') ? { norm: NORM } : {});

  let body;
  if (res.confianza === 'insuficiente' || !res.meso || !res.macro) {
    body = `<div class="pheno-empty">Puntúa ≥4 dimensiones para sugerir fenotipo y dominios alterados (van ${res.dims_evaluadas || 0}).</div>`;
  } else {
    const isReal = s => /^SI/i.test(s || '');
    const pills = items => items.map((a, i) => {
      const real = isReal(a.replica);
      const scoreTrace = a.r !== undefined ? `r=${a.r}` : `match=${a.pct}%`;
      const validation = real ? 'validado real' : (a.replica || 'solo sim');
      return `<div class="pill rank-${i+1} ${real ? '' : 'sim-only'}" title="${escapeAttr(`${scoreTrace} · ${validation}${a.trace ? ` · ${a.trace}` : ''}`)}">
        <span class="pk">${i+1}</span>
        <span class="dt" style="background:${a.color || (real ? '#15803d' : '#cbd5e1')}"></span>
        <span class="lb">${a.label}</span>
        <span class="pc">${a.pct}%</span>
      </div>`;
    }).join('');
    const latentTax = bmseLatentTaxonomyProfile(vec);
    const macroDisplay = latentTax.macro || res.macro;
    const mesoDisplay = latentTax.mesosTop.length ? latentTax.mesosTop : (res.mesosTop || []);
    const microDisplay = latentTax.microsTop.length ? latentTax.microsTop : (res.alternativas || []).slice(0, 3);
    const conf = res.confianza.split(' ')[0];
    const confFull = res.confianza;
    const ambigEntre = (res.ambiguo && Array.isArray(res.ambiguoEntre) && res.ambiguoEntre.length) ? res.ambiguoEntre : null;
    const egoShort = res.egoFlag && res.egoFlag !== 'ego neutro' ? res.egoFlag.split(' (')[0] : '';
    const macroReal = latentTax.macro ? false : isReal(res.meso.replica_real);
    const hitopDomains = dashboardTopGroupScores(typeof HITOP_MAP !== 'undefined' ? HITOP_MAP : null, typeof HITOP_GROUPS !== 'undefined' ? HITOP_GROUPS : null, 'hitop');
    const rdocDomains = dashboardTopGroupScores(typeof RDOC_MAP !== 'undefined' ? RDOC_MAP : null, typeof RDOC_GROUPS !== 'undefined' ? RDOC_GROUPS : null, 'rdoc');
    const hitopSubfactors = dashboardTopDimensionScores(typeof HITOP_MAP !== 'undefined' ? HITOP_MAP : null, typeof HITOP_GROUPS !== 'undefined' ? HITOP_GROUPS : null, 'hitop');
    const rdocConstructs = dashboardTopDimensionScores(typeof RDOC_MAP !== 'undefined' ? RDOC_MAP : null, typeof RDOC_GROUPS !== 'undefined' ? RDOC_GROUPS : null, 'rdoc');

    body = `
      <div class="pheno-sev">
        <span class="pheno-sev-lbl">Severidad</span>
        <span class="pheno-sev-bar"><span class="pheno-sev-fill" style="width:${res.severidad.pct}%"></span></span>
        <span class="pheno-sev-val">${res.severidad.nota.split(' (')[0]}</span>
      </div>
      <div class="pheno-meta">
        <span class="pm-tag pm-conf-${conf}" title="${escapeAttr(confFull)}">conf. ${confFull}</span>
        ${ambigEntre ? `<span class="pm-tag pm-ambig" title="Perfil entre dos espectros — sugerencia poco discriminativa">entre: ${ambigEntre.join(' ↔ ')}</span>` : ''}
        ${egoShort ? `<span class="pm-tag pm-ego">${egoShort}</span>` : ''}
        <span class="pm-tag ${macroReal ? 'pm-real' : 'pm-sim'}">${macroReal ? 'validado real' : 'solo sim'}</span>
      </div>

      <div class="lvl-macro">
        <div class="lvl-label"><span class="lvl-tag">MACRO</span></div>
        <div class="pill-macro"><span class="lb">${macroDisplay.label}</span><span class="pc">${macroDisplay.pct}%</span></div>
      </div>

      <div class="lvl-meso">
        <div class="lvl-label"><span class="lvl-tag">MESO</span><span class="lvl-sub">espectro nuevo · top 3</span></div>
        <div class="pills">${pills(mesoDisplay)}</div>
      </div>

      <div class="lvl-micro">
        <div class="lvl-label"><span class="lvl-tag">MICRO</span><span class="lvl-sub">clase latente · top 3</span></div>
        <div class="pills">${pills(microDisplay)}</div>
      </div>

      <div class="lvl-forbes">
        <div class="lvl-label"><span class="lvl-tag">FORBES / HiTOP</span><span class="lvl-sub">dimensiones mayores · top 2</span></div>
        <div class="pills">${dashboardDomainPills(hitopDomains, 'Sin dimensiones Forbes/HiTOP activas.', 2)}</div>
      </div>

      <div class="lvl-rdoc">
        <div class="lvl-label"><span class="lvl-tag">RDoC</span><span class="lvl-sub">domains · top 2</span></div>
        <div class="pills">${dashboardDomainPills(rdocDomains, 'Sin dimensiones RDoC activas.', 2)}</div>
      </div>

      <div class="lvl-forbes">
        <div class="lvl-label"><span class="lvl-tag">HiTOP</span><span class="lvl-sub">subfactores · top 3</span></div>
        <div class="pills">${dashboardDomainPills(hitopSubfactors, 'Sin subfactores HiTOP activos.')}</div>
      </div>

      <div class="lvl-rdoc">
        <div class="lvl-label"><span class="lvl-tag">RDoC</span><span class="lvl-sub">constructos · top 3</span></div>
        <div class="pills">${dashboardDomainPills(rdocConstructs, 'Sin constructos RDoC activos.')}</div>
      </div>

      <div class="pheno-foot">Sugerencia dimensional — no es diagnóstico. ${res.dims_evaluadas} dims.</div>`;
  }

  return `
    <section class="dash-panel dash-pheno pheno-block">
      <div class="dash-panel-head"><h2>Fenotipo</h2><div class="dash-sub">macro · meso · micro · dominios</div></div>
      <div class="dash-body">${body}</div>
    </section>`;
}

function ensureHiTOPRuntimePatches() {
  if (typeof HITOP_MAP === 'undefined') return;
  const traumaSleep = HITOP_MAP['Sueño desreg.\n+ Trauma'];
  if (!Array.isArray(traumaSleep)) return;
  traumaSleep.forEach(f => { if (!f.gate) f.gate = 'traumaSleep'; });
  const hasAutobiographicCoherence = traumaSleep.some(f => f.id === 'F7.coherencia-autobiografica');
  if (!hasAutobiographicCoherence) {
    traumaSleep.push({id:'F7.coherencia-autobiografica', inv:true, pole:'neg', w:0.75, gate:'traumaSleep'});
  }
}

function renderHiTOPGrid() {
  if (typeof HITOP_MAP === 'undefined' || typeof HITOP_GROUPS === 'undefined') {
    return '<div style="color:var(--text-muted);font-size:12px">Forbes data no disponible.</div>';
  }
  ensureHiTOPRuntimePatches();
  const labels = Object.keys(HITOP_MAP);
  const shortHiTOPSub = {
    'LPFS Interpersonal':'LPFS Interpers.',
    'Sueño desreg. + Trauma':'Sueño + Trauma',
    'Aislamiento Social':'Aislamiento',
    'Patología Alimentaria':'Patol. Alimentaria',
    'Alimentación Desregulada':'Aliment. Desreg.',
    'Psicosis Positiva':'Psicosis Positiva',
    'Experiencias Disociativas':'Exp. Disociativas',
    'Pérdida control corporal':'Pérdida control corp.',
    'Sensación alt. + control atenc.':'Sensación + Atención',
    'Deterioro Neurocognitivo':'Deterioro NC',
    'Dificultades Organización':'Organización',
    'Comportamiento Ritualizado':'Ritualizado',
    'Dificultades Comunicación social':'Comunicación Social',
    'Afecto neg. externalizado':'Afecto neg.',
    'Comportamiento Antisocial':'Antisocial',
    'Sínt. físicos incontrolables':'Físicos incontrol.'
  };
  const ROW2_ORDER = ['Externalizante', 'Manía / Bajo desapego', 'Trastorno pensamiento'];
  const row1 = HITOP_GROUPS.filter(g => !ROW2_ORDER.includes(g.name));
  const row2 = ROW2_ORDER.map(name => HITOP_GROUPS.find(g => g.name === name)).filter(Boolean);
  const rowGroups = [row1, row2];
  let html = '';
  rowGroups.forEach((rowGs, ri) => {
    html += `<div class="hitop-row">`;
    rowGs.forEach(g => {
      const nSubs = g.to - g.from + 1;
      html += `<div class="hitop-group" style="flex:${nSubs}">`;
      html += `<div class="hitop-group-head" style="color:${g.color};background:linear-gradient(180deg, ${g.color}22, ${g.color}0d);border-bottom-color:${g.color};box-shadow:inset 0 2px 0 ${g.color}55">${g.name.toUpperCase()}</div>`;
      html += `<div class="hitop-subs">`;
      for (let i = g.from; i <= g.to; i++) {
        const fullSubName = labels[i].replace(/\n/g, ' ').replace('Cognición Bedside', 'Cognición');
        const subName = shortHiTOPSub[fullSubName] || fullSubName;
        const feeders = HITOP_MAP[labels[i]];
        const feederData = feeders.map((d, fi) => getFeederSignal(d, labels[i], fi));
        const activation = typeof calcHiTOPActivation === 'function'
          ? calcHiTOPActivation(feederData)
          : {status:'none', score:0};
        let subCls = activation.status === 'extreme' ? 'extreme' : activation.status === 'convergent' ? 'convergent' : activation.status === 'signal' ? 'signal' : activation.status === 'support' ? 'support' : '';
        const activationTip = typeof hitopActivationTooltip === 'function' ? hitopActivationTooltip(fullSubName, activation) : fullSubName;
        html += `<div class="hitop-sub ${subCls}">`;
        html += `<details class="hitop-sub-details">`;
        html += `<summary class="hitop-sub-head" title="${escapeAttr(activationTip)}"><span class="sub-dot"></span><span class="sub-name">${subName}</span><span class="hitop-sub-toggle" aria-hidden="true"></span></summary>`;
        html += `<div class="hitop-feeders">`;
        feederData.forEach((fd, fi) => {
          const d = feeders[fi];
          const dimObj = (typeof findScoreDefinition === 'function') ? findScoreDefinition(d.id) : DIMS.find(x => x.id === d.id);
          const shortName = d.id.split('.').pop();
          let valTxt = '—', feederCls = '';
          if (!fd.evaluated) {
            valTxt = fd.ne ? 'NE' : '—';
            feederCls = 'ne';
          } else {
            valTxt = d.id === 'F4.contenido' ? String(fd.raw) : (fd.raw > 0 ? '+' : '') + fd.raw;
            if (fd.extreme) feederCls = 'extreme';
            else if (fd.signal) feederCls = 'signal';
          }
          const construct = fd.evaluated && typeof getConstructEntry === 'function' ? getConstructEntry(d.id, fd.raw) : null;
          const nivel = fd.evaluated ? (construct?.label || dimObj?.details?.[valTxt]?.nivel || dimObj?.scores?.[valTxt] || '') : '';
          const role = fd.role || (typeof hitopFeederRole === 'function' ? hitopFeederRole(labels[i], d, fi) : 'complementary');
          const roleCls = `role-${role}`;
          const roleTxt = role === 'central' ? 'C' : role === 'bridge' ? 'P' : 'S';
          const roleLabel = typeof hitopRoleLabel === 'function' ? hitopRoleLabel(role) : role;
          const tip = fd.evaluated
            ? `${d.id} ${valTxt} — ${nivel} · ${roleLabel}`
            : fd.ne
              ? `${d.id}: no evaluable · ${roleLabel}`
              : fd.gateClosed
                ? `${d.id}: requiere ${fd.gateLabel} · ${roleLabel}`
                : fd.excluded
                  ? `${d.id}: no aplica para este polo · ${roleLabel}`
                  : `${d.id}: no puntuado · ${roleLabel}`;
          html += `<span class="hitop-feeder ${feederCls} ${roleCls}" title="${escapeAttr(tip)}"><span class="feeder-role">${roleTxt}</span>${valTxt}`;
          if (nivel && nivel !== '—') html += `<span class="feeder-nivel">${shortLabel(nivel, 14)}</span>`;
          html += `</span>`;
        });
        html += `</div></details></div>`;
      }
      html += `</div></div>`;
    });
    html += `</div>`;
  });
  return html;
}

function summaryCard(title, score) {
  const v = fmtScore(score);
  let cls = 'ne';
  if (score !== null && score !== undefined && score !== 'NE') {
    const n = parseInt(score, 10);
    if (!Number.isNaN(n)) cls = n < 0 ? 'neg' : n > 0 ? 'pos' : '';
  }
  return `<div class="summary-card"><span class="sc-title">${title}</span><span class="sc-val ${cls}">${v}</span></div>`;
}

renderScoreView();
if (typeof checkRiskInline === 'function') checkRiskInline();

// ── BRAIN INFERENCE HOOKS ──
// Wrap saveState para que brainUpdate() corra tras cada score
if (typeof brainUpdate === 'function') {
  const _origSaveState = saveState;
  saveState = function() {
    _origSaveState();
    try { brainUpdate(); } catch (e) { console.warn('brainUpdate:', e); }
  };
  // Wrap renderProfile para refresh del widget al entrar a Perfil
  const _origRenderProfile = renderProfile;
  renderProfile = function() {
    _origRenderProfile();
    setTimeout(() => { try { brainUpdate(); } catch (e) {} }, 30);
  };
  // Primer update al cargar (en caso de state previa)
  try { brainUpdate(); } catch (e) {}
}

// ── MOBILE ACTION BAR LOGIC ──
function mobileSweepAction() {
  const sweepBtn = document.getElementById('sweepBtn');
  if (sweepBtn && !sweepBtn.disabled) sweepBtn.click();
}

function mobileResetConfirm() {
  if (confirm('¿Limpiar toda la evaluación y comenzar de nuevo?\n\nSe guardará un respaldo recuperable.')) {
    backupState();
    localStorage.removeItem('bmse_state_v2');
    state = defaultState();
    Object.keys(tentative).forEach(k => delete tentative[k]);
    renderScoreView();
    showView('score');
    syncMobileBar();
    if (typeof checkRiskInline === 'function') checkRiskInline();
  }
}

// syncMobileBar: replica estado del sweepBtn nativo al bar mobile.
// Se llama desde updateProgress() después de cada cambio de score.
function syncMobileBar() {
  const sweepBtn = document.getElementById('sweepBtn');
  const mobSweep = document.getElementById('mobSweepBtn');
  const mobProfile = document.getElementById('mobProfileBtn');
  if (!mobSweep) return;
  if (sweepBtn) {
    mobSweep.textContent = sweepBtn.textContent || 'Marcar normales';
    mobSweep.disabled = sweepBtn.disabled;
    mobSweep.style.opacity = sweepBtn.disabled ? '0.5' : '1';
    const allDone = sweepBtn.disabled && sweepBtn.textContent === 'Todo puntuado';
    if (mobProfile) {
      mobProfile.style.background = allDone ? 'var(--teal)' : '';
      mobProfile.style.color = allDone ? '#fff' : '';
      mobProfile.style.border = allDone ? 'none' : '';
    }
  }
}

// syncMobileBar ya se llama desde updateProgress().
// Sync inicial en caso de que updateProgress haya corrido antes de que el bar exista.
setTimeout(syncMobileBar, 150);
</script>
