<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Functioning · Trayectoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
<style>
:root {
  /* ── Base surfaces ── */
  --bg: #ffffff;
  --bg-alt: #fafaf9;
  --surface: #f4f4f2;
  --surface-raised: #f8f8f6;

  /* ── Azul system (extended depth) ── */
  --azul: #1e3a8a;
  --azul-deep: #162d72;
  --azul-mid: #3b5fcc;
  --azul-light: #4f75d8;
  --azul-soft: rgba(30,58,138,0.055);
  --azul-soft-hover: rgba(30,58,138,0.09);
  --azul-border: rgba(30,58,138,0.16);
  --azul-border-strong: rgba(30,58,138,0.28);
  --azul-grad: linear-gradient(135deg, #1e3a8a 0%, #1e4da8 60%, #2563c4 100%);
  --azul-grad-subtle: linear-gradient(135deg, #1e3a8a 0%, #243d97 100%);

  /* ── Teal system ── */
  --teal: #0e8fa0;
  --teal-bright: #1098ad;
  --teal-soft: rgba(14,143,160,0.07);
  --teal-border: rgba(14,143,160,0.24);

  /* ── Semantic colors ── */
  --text: #18160f;
  --text-muted: #6b6760;
  --text-subtle: #9b9590;
  --border: #e8e6e3;
  --border-strong: #d2ceca;

  --red: #c1121f;
  --red-soft: rgba(193,18,31,0.10);
  --orange: #d76a03;
  --orange-soft: rgba(215,106,3,0.10);
  --gray: #57534e;
  --green: #188a3b;
  --green-soft: rgba(24,138,59,0.09);
  --purple: #6d28d9;
  --gold: #b8891e;

  /* ── Shadow system ── */
  --shadow-xs: 0 1px 2px rgba(24,22,15,0.04);
  --shadow:    0 1px 3px rgba(24,22,15,0.06), 0 1px 2px rgba(24,22,15,0.04);
  --shadow-md: 0 4px 8px rgba(24,22,15,0.07), 0 1px 3px rgba(24,22,15,0.05);
  --shadow-lg: 0 8px 24px rgba(24,22,15,0.10), 0 2px 6px rgba(24,22,15,0.06);
  --shadow-xl: 0 16px 40px rgba(24,22,15,0.12), 0 4px 12px rgba(24,22,15,0.07);

  /* ── Radius system ── */
  --r-sm: 5px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-pill: 999px;

  /* ── Easing ── */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* ── Typography ── */
  --font-display: 'Instrument Serif', Georgia, serif;
  --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;

  /* ── Score ramp 0 (mejor) → 6 (peor) ── */
  --sc0: #15803d; --sc1: #4d9e2a; --sc2: #8a9d12; --sc3: #b8891e; --sc4: #d76a03; --sc5: #c1411f; --sc6: #c1121f;
  /* superficies derivadas (cambian con el tema) */
  --card-1:#ffffff; --card-2:#fbfbfa; --surface-2:#ffffff; --header-bg:rgba(255,255,255,0.92); --tip-bg:rgba(255,255,255,0.97); --scored-tint:var(--scored-tint);
}

body.theme-sepia {
  --bg:#1f1a14; --bg-alt:#262019; --surface:#2b2419; --surface-raised:#322a1e;
  --azul:#c79a4e; --azul-deep:#b8893c; --azul-mid:#d4a960; --azul-light:#e0bb78;
  --azul-soft:rgba(199,154,78,0.10); --azul-soft-hover:rgba(199,154,78,0.18); --azul-border:rgba(199,154,78,0.30); --azul-border-strong:rgba(199,154,78,0.46);
  --azul-grad:linear-gradient(135deg,#b8893c 0%,#c79a4e 60%,#d4a960 100%); --azul-grad-subtle:linear-gradient(135deg,#a87d34 0%,#c79a4e 100%);
  --teal:#5fb0a3; --teal-bright:#6fc0b2; --teal-soft:rgba(95,176,163,0.12); --teal-border:rgba(95,176,163,0.30);
  --text:#ece0cd; --text-muted:#b3a489; --text-subtle:#857653; --border:#3a3124; --border-strong:#4d4130;
  --red:#e06a5e; --red-soft:rgba(224,106,94,0.16); --orange:#e0954a; --orange-soft:rgba(224,149,74,0.16);
  --gray:#b3a489; --green:#7fb069; --green-soft:rgba(127,176,105,0.16); --purple:#b794d6; --gold:#d4a960;
  --card-1:#2b2419; --card-2:#221c14; --surface-2:#322a1e; --header-bg:rgba(31,26,20,0.92); --tip-bg:rgba(43,36,25,0.97); --scored-tint:rgba(255,255,255,0.045);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
body { padding-bottom: 40px; }

/* ── Header ── */
header {
  padding: 12px 28px;
  background: var(--header-bg);
  backdrop-filter: blur(12px) saturate(1.4);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 0 rgba(24,22,15,0.04), 0 2px 8px rgba(24,22,15,0.04);
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 50;
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand .mark { font-family: var(--font-display); font-size: 27px; font-weight: 400; letter-spacing: -0.01em; color: var(--text); line-height: 1; }
.brand .sub { font-size: 9.5px; color: var(--text-subtle); letter-spacing: 0.09em; text-transform: uppercase; font-weight: 500; }
.progress { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--text-muted); font-weight: 500; }
.progress .bar { width: 140px; height: 3px; background: var(--surface); border-radius: var(--r-pill); overflow: hidden; }
.progress .fill { height: 100%; background: var(--azul-grad); transition: width 0.4s var(--ease-out); width: 0%; }
.completion-cta { margin-left: 4px; font-family: var(--font-body); font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 11px 4px; border-radius: var(--r-pill); background: var(--teal-soft); color: var(--teal-bright); border: 1px solid var(--teal-border); cursor: pointer; }
.completion-cta:hover { background: var(--teal-bright); color: #fff; }
.tabs { margin-left: auto; display: flex; gap: 2px; padding: 3px; background: var(--surface); border-radius: var(--r-pill); border: 1px solid var(--border); }
.tab-btn { padding: 6px 20px; border: none; background: transparent; border-radius: var(--r-pill); font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: 0.055em; text-transform: uppercase; color: var(--text-muted); cursor: pointer; transition: color 0.15s, background 0.15s, box-shadow 0.15s; }
.tab-btn:hover { color: var(--azul); }
.tab-btn.active { background: var(--azul-grad-subtle); color: #fff; box-shadow: var(--shadow-md), 0 0 0 1px rgba(30,58,138,0.18); }

.theme-btn { width: 34px; height: 34px; border-radius: var(--r-pill); border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer; font-size: 15px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; transition: all 0.15s; }
.theme-btn:hover { color: var(--azul); border-color: var(--azul-border); }
main { max-width: 1080px; margin: 0 auto; padding: 22px 28px 40px; }

/* ── Section-nav ── */
.section-nav {
  position: sticky; top: 57px; z-index: 40;
  background: var(--header-bg);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border); box-shadow: 0 1px 0 rgba(24,22,15,0.03);
  padding: 7px 28px 8px; margin: 0 -28px 14px;
  display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
}
.section-nav .nav-chip { font-family: var(--font-body); font-size: 10.5px; font-weight: 600; letter-spacing: 0.02em; padding: 3px 9px 4px; border-radius: var(--r-pill); background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); cursor: pointer; text-decoration: none; transition: all 0.15s var(--ease-out); white-space: nowrap; box-shadow: var(--shadow-xs); display: inline-flex; gap: 5px; align-items: center; }
.section-nav .nav-chip:hover { background: var(--azul-soft-hover); color: var(--azul); border-color: var(--azul-border); transform: translateY(-1px); box-shadow: var(--shadow); }
.section-nav .nav-chip.complete { background: var(--teal-soft); color: var(--teal-bright); border-color: var(--teal-border); }
.section-nav .nav-chip.active { background: var(--azul-grad-subtle); color: #fff; border-color: var(--azul); box-shadow: var(--shadow-md), 0 0 0 1px rgba(30,58,138,0.18); transform: none; }
.section-nav .nav-chip.active:hover { background: var(--azul-deep); color: #fff; }
.section-nav .nav-chip.active .nav-count { color: rgba(255,255,255,0.88); opacity: 1; }
.section-nav .nav-chip .nav-count { font-size: 9.5px; opacity: 0.8; font-weight: 700; }
.section-nav .nav-sweep { font-family: var(--font-body); font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 4px 12px 5px; border-radius: var(--r-pill); background: var(--azul-grad-subtle); color: #fff; border: none; cursor: pointer; transition: all 0.15s var(--ease-out); box-shadow: 0 1px 4px rgba(30,58,138,0.22); }
.section-nav .nav-sweep:hover { background: var(--azul-deep); box-shadow: 0 3px 8px rgba(30,58,138,0.28); transform: translateY(-1px); }
.section-nav .nav-sweep:disabled { background: var(--text-subtle); cursor: not-allowed; opacity: 0.55; box-shadow: none; transform: none; }
.section-nav .nav-demo { font-family: var(--font-body); font-size: 10px; font-weight: 700; letter-spacing: 0.03em; padding: 4px 10px 5px; border-radius: var(--r-pill); background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); cursor: pointer; box-shadow: var(--shadow-xs); max-width: 250px; }
.section-nav .nav-demo:hover { border-color: var(--azul-border); color: var(--azul); }
.section-nav .nav-help { font-size: 10px; color: var(--text-subtle); margin-left: auto; }

/* ── Section head ── */
.section-head { font-family: var(--font-display); font-size: 19px; font-weight: 400; letter-spacing: -0.008em; color: var(--text); margin: 26px 0 8px; padding-bottom: 7px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; scroll-margin-top: 110px; position: relative; }
.section-head .stage-age { font-size: 12px; color: var(--text-subtle); font-family: var(--font-body); font-weight: 500; margin-left: 8px; }
.section-head .count { font-family: var(--font-body); font-size: 11px; color: var(--text-muted); font-weight: 600; }
.section-head::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 0; height: 2px; background: var(--azul-grad); border-radius: 2px; transition: width 0.35s var(--ease-out); }
.section-head.sec-complete::after { width: 48px; background: var(--teal); }
.section-head.sec-complete { color: var(--teal); border-bottom-color: var(--teal-border); }
.stage-note { font-size: 11px; color: var(--text-subtle); margin: 0 0 6px; font-style: italic; }
.age-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 28px; margin: -22px -28px 14px; background: linear-gradient(135deg, var(--azul-soft), var(--bg)); border-bottom: 1px solid var(--border); }
.age-bar label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--azul); }
.age-bar input { width: 90px; font-family: var(--font-body); font-size: 15px; font-weight: 600; color: var(--text); border: 1px solid var(--border-strong); border-radius: var(--r-md); padding: 6px 10px; background: var(--surface-2); }
.age-bar input:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px var(--azul-soft); }
.age-bar .age-stage { font-size: 12.5px; color: var(--text-muted); }
.age-bar .age-stage b { color: var(--text); }
.empty-prompt { text-align: center; padding: 54px 20px; color: var(--text-muted); font-size: 14.5px; line-height: 1.6; }
.empty-prompt span { display: block; margin: 8px auto 0; font-size: 12px; color: var(--text-subtle); max-width: 540px; }
.actual-badge { font-family: var(--font-body); font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: var(--r-pill); background: var(--azul-grad-subtle); color: #fff; vertical-align: middle; }

/* ── Cell row (axis × stage) ── */
.cell-row { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: var(--r-md); transition: background 0.12s ease; }
.cell-row + .cell-row { border-top: 1px solid var(--border); }
.cell-row:hover { background: var(--bg-alt); }
.cell-row.scored { background: linear-gradient(to right, var(--scored-tint), var(--bg-alt)); }
.cell-head { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
.cell-head .code { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-subtle); }
.cell-head .title { font-size: 13.5px; font-weight: 700; color: var(--text); }
.cell-head .partial-tag { font-size: 9px; color: var(--orange); font-weight: 600; }
.cell-q { font-size: 11.5px; color: var(--text-muted); font-style: italic; line-height: 1.45; max-width: 820px; }
.cell-scores { display: flex; flex-wrap: wrap; gap: 5px; }
.cell-note { margin-top: 2px; max-width: 820px; }
.cell-note input { width: 100%; font-family: var(--font-body); font-size: 11px; color: var(--text); border: 1px dashed var(--border-strong); border-radius: var(--r-sm); padding: 4px 8px; background: transparent; transition: border-color 0.15s; }
.cell-note input:focus { outline: none; border-color: var(--azul-border-strong); border-style: solid; background: var(--surface-2); }
.cell-note input::placeholder { color: var(--text-subtle); }

/* ── Score buttons ── */
.s-btn { flex: 0 1 auto; padding: 3px 10px 4px; border: 1px solid var(--border); border-radius: var(--r-pill); background: var(--surface-2); cursor: pointer; font-family: var(--font-body); color: var(--text-muted); display: inline-flex; align-items: baseline; gap: 6px; transition: border-color 0.12s ease, color 0.12s ease, transform 0.12s var(--ease-out), box-shadow 0.12s ease, background 0.12s ease; line-height: 1.2; font-size: 11px; white-space: nowrap; box-shadow: var(--shadow-xs); }
.s-btn:hover { border-color: var(--azul-border-strong); color: var(--azul); background: var(--azul-soft); transform: translateY(-1px); box-shadow: var(--shadow); }
.s-btn:active { transform: translateY(0); box-shadow: var(--shadow-xs); }
.s-btn .num { font-size: 11px; font-weight: 700; color: var(--text); flex: 0 0 auto; }
.s-btn .lbl { font-size: 10.5px; font-weight: 600; color: var(--text); flex: 0 0 auto; }
.s-btn.selected { color: #fff; border-color: var(--azul); box-shadow: var(--shadow-md); transform: translateY(0); }
.s-btn.selected .num, .s-btn.selected .lbl { color: rgba(255,255,255,0.97); }
.s-btn.selected[data-val="0"] { background: linear-gradient(135deg, #136e34, var(--sc0)); border-color: var(--sc0); box-shadow: 0 2px 6px rgba(21,128,61,0.28); }
.s-btn.selected[data-val="1"] { background: linear-gradient(135deg, #3f8a22, var(--sc1)); border-color: var(--sc1); box-shadow: 0 2px 6px rgba(77,158,42,0.26); }
.s-btn.selected[data-val="2"] { background: linear-gradient(135deg, #76880f, var(--sc2)); border-color: var(--sc2); box-shadow: 0 2px 6px rgba(138,157,18,0.26); }
.s-btn.selected[data-val="3"] { background: linear-gradient(135deg, #a3781a, var(--sc3)); border-color: var(--sc3); box-shadow: 0 2px 6px rgba(184,137,30,0.26); }
.s-btn.selected[data-val="4"] { background: linear-gradient(135deg, #be5d03, var(--sc4)); border-color: var(--sc4); box-shadow: 0 2px 6px rgba(215,106,3,0.28); }
.s-btn.selected[data-val="5"] { background: linear-gradient(135deg, #a8381b, var(--sc5)); border-color: var(--sc5); box-shadow: 0 2px 6px rgba(193,65,31,0.28); }
.s-btn.selected[data-val="6"] { background: linear-gradient(135deg, #9b1018, var(--sc6)); border-color: var(--sc6); box-shadow: 0 2px 8px rgba(193,18,31,0.32); }
.s-btn.ne-btn { opacity: 0.5; padding: 3px 9px 4px; }
.s-btn.ne-btn:hover { opacity: 1; transform: translateY(0); }
.s-btn.ne-btn.selected { background: #a8a29e; border-color: #a8a29e; color: #fff; opacity: 1; box-shadow: none; }

/* ── Sub-puntos por edad (resolución intra-etapa) ── */
.cpoint-toggle { margin-top: 6px; align-self: flex-start; font-family: var(--font-body); font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em; padding: 3px 11px 4px; border-radius: var(--r-pill); background: var(--teal-soft); color: var(--teal-bright); border: 1px dashed var(--teal-border); cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
.cpoint-toggle:hover { background: var(--teal-bright); color: #fff; border-style: solid; }
.cpoint-toggle .cp-count { font-size: 9.5px; font-weight: 800; background: var(--teal-bright); color:#fff; border-radius: var(--r-pill); padding: 0 6px; line-height: 15px; }
.cpoints { margin-top: 8px; padding: 11px 12px; border: 1px solid var(--teal-border); border-radius: var(--r-md); background: var(--teal-soft); display: flex; flex-direction: column; gap: 8px; }
.cpoints .cp-hint { font-size: 10.5px; color: var(--text-muted); font-style: italic; line-height: 1.45; max-width: 760px; }
.cpoint { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; padding: 7px 9px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface-2); box-shadow: var(--shadow-xs); }
.cpoint .cp-age-lbl { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-subtle); }
.cpoint .cp-age { width: 60px; flex: 0 0 auto; font-family: var(--font-body); font-size: 12.5px; font-weight: 700; color: var(--text); border: 1px solid var(--border-strong); border-radius: var(--r-sm); padding: 4px 6px; background: var(--bg); text-align: center; }
.cpoint .cp-age:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 2px var(--azul-soft); }
.cpoint-scores { display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto; }
.cpoint-scores .s-btn { padding: 2px 8px 3px; font-size: 10px; }
.cpoint-scores .s-btn .num { font-size: 10px; }
.cpoint-scores .s-btn .lbl { font-size: 9.5px; }
.cpoint .cp-note { flex: 1 1 150px; min-width: 110px; font-family: var(--font-body); font-size: 11px; color: var(--text); border: 1px dashed var(--border-strong); border-radius: var(--r-sm); padding: 4px 8px; background: transparent; }
.cpoint .cp-note:focus { outline: none; border-color: var(--azul-border-strong); border-style: solid; background: var(--surface-2); }
.cpoint .cp-del { width: 24px; height: 24px; flex: 0 0 auto; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text-subtle); cursor: pointer; font-size: 15px; line-height: 1; }
.cpoint .cp-del:hover { background: var(--red-soft); color: var(--red); border-color: var(--red); }
.cpoint-add { align-self: flex-start; font-family: var(--font-body); font-size: 11px; font-weight: 700; padding: 5px 13px; border-radius: var(--r-md); border: 1px dashed var(--azul-border-strong); background: var(--azul-soft); color: var(--azul); cursor: pointer; }
.cpoint-add:hover { background: var(--azul-soft-hover); }
.cell-row.has-points { background: linear-gradient(to right, var(--teal-soft), var(--bg-alt)); }

/* ── Profile ── */
.profile-dashboard { display: flex; flex-direction: column; gap: 18px; }
.dash-panel { border: 1px solid var(--border); border-radius: var(--r-lg); background: linear-gradient(145deg, var(--card-1), var(--card-2)); box-shadow: var(--shadow); padding: 16px 18px; }
.dash-panel .panel-title { font-family: var(--font-display); font-size: 18px; color: var(--text); margin-bottom: 4px; }
.dash-panel .panel-sub { font-size: 11px; color: var(--text-subtle); margin-bottom: 12px; }
.chart-wrap { width: 100%; overflow-x: auto; text-align: center; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; justify-content: center; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--text-muted); cursor: pointer; padding: 3px 9px; border-radius: var(--r-pill); border: 1px solid var(--border); background: var(--surface); transition: all 0.15s; user-select: none; }
.legend-item:hover { border-color: var(--azul-border); }
.legend-item.off { opacity: 0.38; text-decoration: line-through; }
.legend-item .sw { width: 11px; height: 11px; border-radius: 3px; flex: 0 0 auto; }

.summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); gap: 9px; }
.summary-card { background: linear-gradient(to right, #ffffff, var(--bg-alt)); border: 1px solid var(--border); border-radius: var(--r-md); padding: 9px 12px; box-shadow: var(--shadow-xs); transition: box-shadow 0.15s ease; }
.summary-card:hover { box-shadow: var(--shadow); }

.dchecks { display: flex; flex-direction: column; gap: 4px; }

/* ── Tooltip ── */

<body>

<header>
  <div class="brand">
    <div class="mark">Functioning</div>
    <div class="sub">Trayectoria funcional · exposome</div>
  </div>
  <div class="progress">
    <span id="progressText">0 / 0</span>
    <div class="bar"><div class="fill" id="progressFill"></div></div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-view="score" onclick="showView('score')">Funcionamiento</button>
    <button class="tab-btn" data-view="narrative" onclick="showView('narrative')">Narrativa</button>
    <button class="tab-btn" data-view="profile" onclick="showView('profile')">Perfil</button>
  </div>

</header>

<main>
  <div id="scoreView"></div>
  <div id="profileView" style="display:none"></div>
  <div id="narrativeView" style="display:none"></div>
</main>

<div id="tip"></div>

<div id="mobileActionBar">
  <button class="mob-btn mob-sweep" onclick="sweepDefaults()">Marcar óptimos</button>
  <button class="mob-btn mob-profile" onclick="showView('profile')">Ver perfil</button>
  <button class="mob-btn mob-reset" onclick="resetAll()" title="Limpiar todo">↺</button>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   DATA MODEL — 7 ejes × 6 etapas. Escala 0 (mejor) – 6 (peor).
   ══════════════════════════════════════════════════════════════ */

const SEVERITY = ['Óptimo','Bueno','Adecuado','Limitado','Pobre','Muy pobre','Nulo'];

const STAGES = [
  { id:'s0_5',   label:'0–5',   age:'Primera infancia · neurodesarrollo', lo:0,  hi:5 },
  { id:'s6_11',  label:'6–11',  age:'Niñez escolar',          lo:6,  hi:11 },
  { id:'s12_15', label:'12–15', age:'Adol. temprana',         lo:12, hi:15 },
  { id:'s16_18', label:'16–18', age:'Adol. tardía',           lo:16, hi:18 },
  { id:'s19_25', label:'19–25', age:'Adultez emergente',      lo:19, hi:25 },
  { id:'s26_44', label:'26–44', age:'Adultez joven',          lo:26, hi:44 },
  { id:'s45_64', label:'45–64', age:'Adultez media',          lo:45, hi:64 },
  { id:'s65_74', label:'65–74', age:'Adulto mayor · young-old', lo:65, hi:74 },
  { id:'s75_84', label:'75–84', age:'Old-old',                lo:75, hi:84 },
  { id:'s85',    label:'85+',   age:'Oldest-old',             lo:85, hi:200 }
];
const STAGE_IDS = STAGES.map(s => s.id);
// "Actual" no es una columna: es la etapa de vida que contiene la edad del paciente.
function currentStageId(){
  const a = state.age;
  if (a===null || a===undefined || a==='') return null;
  const n = +a; if (Number.isNaN(n)) return null;
  for (const st of STAGES){ if (n>=st.lo && n<=st.hi) return st.id; }
  if (n > STAGES[STAGES.length-1].hi) return STAGES[STAGES.length-1].id;
  return null;
}
function activeStages(){
  const cur = currentStageId(); if (!cur) return [];
  return STAGES.slice(0, STAGE_IDS.indexOf(cur)+1);
}
function activeStageIds(){ return activeStages().map(s => s.id); }
function isStageActive(id){ return activeStageIds().indexOf(id) !== -1; }

// applic: 'ok' | 'partial' | 'na' por etapa (orden de STAGES)
const AXES = [
  { id:'social', code:'1', title:'Social', color:'#1e3a8a',
    applic:['ok','ok','ok','ok','ok','ok','ok','ok','ok','ok'],
    q:'¿Tenía amigos y los buscaba? ¿Pertenecía a grupos? ¿Prefería estar solo/a?',
    short:['Red amplia','Varios vínculos','Algunos amigos','Pocos / periférico','Aislam. moderado','Casi sin vínculos','Aislam. total'],
    anchors:[
      'Red amplia y recíproca, vínculos íntimos, pertenencia activa.',
      'Varios vínculos sólidos; apoyo disponible y buscado.',
      'Algunos amigos; reciprocidad y pertenencia conservadas.',
      'Pocos vínculos; contacto algo pasivo o periférico.',
      'Aislamiento moderado; red mínima, poca iniciativa social.',
      'Casi sin vínculos; retraimiento marcado.',
      'Aislamiento total; sin red ni contacto significativo.'
    ] },
  { id:'acadlab', code:'2', title:'Académico / Laboral', color:'#0e8fa0',
    applic:['na','ok','ok','ok','ok','ok','ok','ok','ok','ok'],
    q:'¿Cómo le iba en estudios/trabajo vs sus pares? ¿Sostenía el rol? ¿Hubo interrupciones, repitencia o abandono?',
    short:['Pleno / superior','Sólido','Esperado','Variable / bajo','Interrupciones','Abandono parcial','Sin rol'],
    anchors:[
      'Rendimiento/rol pleno y sostenido, por encima de lo esperado.',
      'Desempeño sólido y continuo en su contexto.',
      'Cumple lo esperado para su edad/contexto.',
      'Rendimiento variable o algo por debajo de lo esperado.',
      'Bajo rendimiento, interrupciones, repitencia/cambios.',
      'Fracaso o abandono parcial sostenido del rol.',
      'Sin rol productivo / fracaso global.'
    ] },
  { id:'vincular', code:'3', title:'Vincular / íntimo', color:'#be185d',
    applic:['na','na','partial','ok','ok','ok','ok','ok','ok','ok'],
    q:'¿Tuvo pareja o vínculos íntimos? ¿Estables o breves? ¿Podía intimar y confiar?',
    short:['Íntimo estable','Intimidad clara','Afectos, sin pareja','Breves / conflicto','Superficiales','Evitación','Aislam. afectivo'],
    anchors:[
      'Vínculo íntimo estable, recíproco y satisfactorio.',
      'Capacidad de intimidad clara; relación significativa.',
      'Vínculos afectivos presentes; sin pareja estable o altibajos normales.',
      'Relaciones breves o conflicto crónico; continuidad pobre.',
      'Dificultad marcada para intimar; vínculos superficiales.',
      'Relaciones íntimas raras; evitación afectiva.',
      'Aislamiento afectivo; sin capacidad de vínculo íntimo.'
    ] },
  { id:'autonomia', code:'4', title:'Autonomía / independencia', color:'#b45309',
    applic:['partial','partial','partial','ok','ok','ok','ok','ok','ok','ok'],
    q:'¿Vivía y se sostenía por sí mismo/a? ¿Decidía su vida? ¿Dependía de otros?',
    short:['Autonomía plena','Indep. c/ apoyos','Funcional','Parcial','Dep. importante','Dep. casi total','Sin autonomía'],
    anchors:[
      'Vida autónoma plena: vivienda, economía y decisiones propias.',
      'Independiente con apoyos normales para su etapa.',
      'Autonomía funcional; dependencia parcial esperable.',
      'Autonomía parcial; dependencia en áreas clave.',
      'Dependencia importante; autodirección reducida.',
      'Dependencia casi total para la vida cotidiana.',
      'Sin autonomía; dependencia completa.'
    ] },
  { id:'autocuidado', code:'5', title:'Autocuidado / salud', color:'#15803d',
    applic:['ok','ok','ok','ok','ok','ok','ok','ok','ok','ok'],
    q:'¿Se cuidaba (higiene, salud, hábitos)? ¿Hacía sus actividades cotidianas sin apoyo?',
    short:['Pleno / sano','Adecuado','AVD ok, hábitos irreg.','Descuido leve','Requiere apoyo','AVD asistida','Dependencia total'],
    anchors:[
      'Autocuidado pleno; hábitos saludables; AVD sin apoyo.',
      'Autocuidado adecuado; hábitos mayormente sanos.',
      'AVD conservadas; hábitos irregulares.',
      'Descuido leve; hábitos deficientes.',
      'Autocuidado comprometido; requiere recordatorios/apoyo.',
      'Descuido marcado; AVD con asistencia.',
      'Incapaz de autocuidado; dependencia total.'
    ] },
  { id:'drive', code:'6', title:'Drive / energía / interés', color:'#7c3aed',
    applic:['ok','ok','ok','ok','ok','ok','ok','ok','ok','ok'],
    q:'¿Tenía energía, iniciativa e intereses? ¿Afrontaba o evitaba los problemas?',
    short:['Activo / iniciativa','Sostenido','Conservado','Pasivo','Apatía moderada','Anergia','Abulia / anhedonia'],
    anchors:[
      'Motivado, activo, con iniciativa; afronta los problemas.',
      'Energía e interés sostenidos.',
      'Motivación conservada; altibajos normales.',
      'Iniciativa baja; tendencia pasiva.',
      'Apatía moderada; evitación frecuente.',
      'Anergia marcada; casi sin iniciativa.',
      'Abulia/anhedonia profunda; indiferencia.'
    ] },
  { id:'cognicion', code:'7', title:'Cognición', color:'#475569',
    applic:['ok','ok','ok','ok','ok','ok','ok','ok','ok','ok'],
    q:'¿Atención, memoria, aprender, resolver, comunicarse? ¿Fallos que afectaban su función?',
    short:['Pleno','Sólido','Fallos ocasionales','Compensable','Déficit ≥1 dominio','Déficit amplio','Deterioro severo'],
    anchors:[
      'Atención, memoria y resolución de problemas plenas.',
      'Funcionamiento cognitivo sólido.',
      'Cognición conservada; fallos ocasionales.',
      'Quejas/fallos cognitivos notorios pero compensables.',
      'Déficit claro en ≥1 dominio; afecta la función.',
      'Déficit amplio; requiere apoyo.',
      'Deterioro cognitivo severo; dependencia.'
    ] }
];

const AXIS_BYSTAGE = {"social": {"s6_11": {"q": "¿Con quiénes jugaba en el recreo o fuera del colegio en esa época? ¿Tenía un amigo o grupo con quien se juntara seguido, o prefería estar solo? ¿Le costaba entrar a los juegos o lo incluían con facilidad?", "short": ["Grupo activo", "Varios amigos", "Amigos estables", "Juego periférico", "Poco juego grupal", "Casi sin pares", "Sin compañeros"], "anchors": ["Juego grupal frecuente, amigos recíprocos en colegio y vecindario; buscado activamente por pares.", "Varios amigos estables; participación regular en juegos grupales y actividades del colegio.", "Uno o dos amigos consistentes; reciprocidad conservada aunque el grupo sea pequeño.", "Participación periférica o pasiva en grupos; vínculos ocasionales, pocas invitaciones mutuas.", "Juego casi siempre solitario; rara inclusión en grupos; contacto con pares escaso o superficial.", "Prácticamente sin amigos; evita o es evitado sistemáticamente; presencia social mínima.", "Aislamiento completo; sin contacto significativo con pares dentro ni fuera del colegio."]}, "s12_15": {"q": "¿Tenía un grupo de amigos o pandilla con quien saliera o hablara seguido en ese momento? ¿Se sentía parte de algún grupo en el colegio o más bien al margen? ¿Cómo eran sus relaciones con sus compañeros —había alguien con quien contara de verdad?", "short": ["Grupo propio", "Red de pares", "Amigos cercanos", "Vínculos frágiles", "Al margen", "Casi sin grupo", "Aislado total"], "anchors": ["Pertenencia consolidada a grupo de pares; amistades íntimas recíprocas; buscado para actividades sociales.", "Red de amigos activa; apoyo emocional disponible; participación sostenida en dinámicas del grupo.", "Uno o dos amigos cercanos; sentido de pertenencia conservado aunque el círculo sea acotado.", "Vínculos superficiales o inestables; presencia en grupos pero sin ser incluido en el núcleo.", "Mayormente al margen; contacto esporádico; no identificado con ningún grupo; escasa reciprocidad.", "Prácticamente excluido del mundo de pares; interacciones muy raras y poco significativas.", "Aislamiento completo; sin amistad ni pertenencia grupal percibida; sin red de apoyo en pares."]}, "s16_18": {"q": "¿Tenía amigos cercanos o un grupo con quien salir, hablar de cosas personales o simplemente pasar el tiempo? ¿Hubo relaciones románticas o interés en tenerlas? ¿Se sentía conectado con personas fuera de su familia?", "short": ["Red sólida", "Amigos y vínculos", "Círculo estable", "Vínculos limitados", "Contacto escaso", "Casi aislado", "Sin red"], "anchors": ["Red de amigos cercanos y recíprocos; vínculos de confianza; relaciones románticas o interés social activo.", "Varios amigos significativos; apoyo emocional bidireccional; vida social fuera del entorno familiar.", "Uno o dos vínculos estables de confianza; reciprocidad presente; pertenencia mínima pero real.", "Pocos vínculos; relaciones más superficiales o unilaterales; vida social reducida pero existente.", "Contacto social esporádico; tendencia al retraimiento; sin pertenencia grupal clara.", "Prácticamente sin amigos ni contacto significativo fuera del hogar; evitación social marcada.", "Aislamiento completo; sin red de pares ni vínculo emocional fuera del núcleo familiar."]}, "s19_25": {"q": "¿Con quién pasas más tiempo libre y cómo describes esas amistades? ¿Sientes que tienes personas a quienes llamar si estás en crisis? ¿Ha cambiado tu círculo social desde que saliste del colegio o de casa de tus padres?", "short": ["Red activa", "Varios amigos", "Algunos cercanos", "Pocos/distantes", "Solo superficial", "Casi nadie", "Aislado total"], "anchors": ["Red amplia de pares activos (compañeros, nuevas amistades universitarias/laborales, pareja potencial); pertenece a grupos y siente reciprocidad plena", "Varios vínculos significativos estables; comparte experiencias de exploración identitaria con al menos 2–3 personas de confianza", "Algunos amigos cercanos pero red fragmentada por transiciones (mudanza, cambio de carrera); contacto sostenido aunque irregular", "Pocos vínculos, mayoritariamente superficiales o del pasado; dificultad para integrarse en nuevos grupos tras cambios de rol", "Aislamiento moderado: interacciones reducidas a contexto obligatorio (clase, trabajo); sensación de no encajar en ningún grupo", "Casi sin vínculos recíprocos; relaciones mediadas por pantalla sin profundidad; evita contextos sociales nuevos de forma sistemática", "Aislamiento total; sin contacto iniciado ni recibido fuera del núcleo familiar inmediato; soledad crónica reconocida o negada"]}, "s26_44": {"q": "¿Tiene amistades fuera de la pareja o de la familia con quienes se vea o hable con regularidad? ¿Siente que puede contar con alguien más allá del hogar si necesita apoyo emocional o práctico?", "short": ["Red diversa", "Amigos + pareja", "Pocos activos", "Solo familia", "Red muy débil", "Casi sin pares", "Aislado"], "anchors": ["Mantiene red diversa (amigos previos, nuevos colegas, grupos de interés); intercambio recíproco de apoyo instrumental y afectivo fuera del hogar", "Varios vínculos activos más allá de la pareja/hijos; puede haber contracción natural por responsabilidades, pero hay reciprocidad genuina", "Algunos amigos con contacto esporádico; la vida familiar o laboral consume la red, pero quedan 1–2 vínculos de confianza externos", "Red prácticamente restringida a pareja e hijos; amistades previas inactivas; aislamiento enmascarado por rol familiar aparentemente funcional", "Aislamiento moderado: interacciones sociales casi exclusivamente instrumentales (vecinos, colegas de paso); sin apoyo afectivo extrafamiliar", "Casi sin vínculos fuera del núcleo doméstico; pareja o hijos como único sostén social; vulnerabilidad alta ante rupturas familiares", "Aislamiento total incluso dentro del hogar; ausencia de red de apoyo funcional; soledad severa con o sin pareja presente"]}, "s45_64": {"q": "¿Cómo han cambiado sus amistades en los últimos años, con los hijos creciendo o cambiando de etapa? ¿Tiene personas fuera del trabajo y la familia con quienes comparta tiempo o se apoye?", "short": ["Red sólida", "Vínculos estables", "Red reducida", "Pocos/formales", "Red muy escasa", "Casi sin pares", "Aislado"], "anchors": ["Red social consolidada y diversa; amistades de larga data más nuevas conexiones de rol (comunidad, grupos de interés); reciprocidad sostenida", "Varios vínculos estables y significativos; algunos roles cambian (hijos independientes, colegas que rotan) pero el núcleo social se mantiene activo", "Red reducida pero con 2–3 vínculos genuinos; ajuste normal del nido vacío o cambios laborales sin aislamiento clínico", "Vínculos mayoritariamente formales o de rol (colegas, vecinos); amistades íntimas escasas; la red no proporciona apoyo afectivo real", "Red muy escasa; relaciones superficiales o simbólicas; posible inicio de retirada social asociada a cambios de salud, humor o duelos", "Casi sin vínculos pares activos; dependencia exclusiva de pareja o figura de apego; inicio de aislamiento progresivo", "Aislamiento total; sin contacto social significativo extrafamiliar; soledad severa con impacto funcional reconocible"]}, "s65_74": {"q": "¿Cómo organizó sus actividades sociales desde que se jubiló? ¿Mantiene contacto regular con amigos, grupos o actividades comunitarias? ¿Tiene personas fuera de la familia con quienes cuente de verdad?", "short": ["Red activa", "Varios vínculos", "Red ajustada", "Pocos/pasivos", "Red muy tenue", "Casi sin pares", "Aislado"], "anchors": ["Reorganización exitosa post-jubilación: mantiene red activa vía grupos, voluntariado, amistades; contacto recíproco frecuente y satisfactorio", "Varios vínculos significativos aunque la red se ha reorganizado; pérdidas compensadas con nuevas conexiones en contextos de ocio o comunidad", "Red reducida y ajustada; algunos vínculos de calidad pero menor amplitud; inicio de contracción sin aislamiento clínico", "Pocos vínculos mayormente pasivos (visitas esporádicas, llamadas que no inicia); la red no genera apoyo activo ni reciprocidad", "Red muy tenue; contacto social dependiente de iniciativa ajena; sensación de marginalidad o invisibilidad social creciente", "Casi sin pares activos; relaciones limitadas a cuidadores o familia; pérdidas no elaboradas que aceleran el retraimiento", "Aislamiento total; sin contacto social significativo; soledad severa con riesgo psicosocial elevado en contexto de jubilación reciente"]}, "s75_84": {"q": "¿Con quiénes tiene contacto regular en estos días, más allá de sus familiares que lo cuidan? ¿Ha perdido amigos o conocidos cercanos en los últimos años? ¿Tiene personas con quienes hablar de sus cosas?", "short": ["Red activa", "Algunos pares", "Pocos activos", "Solo familia", "Red muy frágil", "Casi nadie", "Aislado"], "anchors": ["Mantiene red de pares activa pese al declive funcional; iniciativa propia de contacto; vínculos recíprocos y fuente real de sostén afectivo", "Algunos vínculos de pares sostenidos; pérdidas parciales de red compensadas con vínculos familiares o de vecindad de calidad", "Pocos vínculos activos; red contraída por fallecimientos, movilidad reducida o enfermedad; contacto esporádico pero significativo", "Red reducida a familia o cuidadores; sin amistades externas activas; ausencia de reciprocidad horizontal con pares", "Red muy frágil; contacto social dependiente de visitas organizadas por terceros; escasa iniciativa y sensación de carga o invisibilidad", "Casi sin vínculos fuera del contexto de cuidado; interacciones sociales mínimas y unidireccionales; soledad profunda", "Aislamiento total; sin contacto social voluntario ni espontáneo; confinamiento relacional con alto riesgo de deterioro funcional acelerado"]}, "s85": {"q": "¿Tiene personas con quienes hablar o compartir tiempo, además de quienes lo cuidan? ¿Puede ver o contactar a alguien cuando lo desea?", "short": ["Conectado", "Algunos vínculos", "Vínculos tenues", "Solo cuidadores", "Muy aislado", "Casi sin contacto", "Aislado total"], "anchors": ["Pese a la fragilidad, mantiene vínculos afectivos activos; recibe y genera contacto con pares o familia; la relación social sigue siendo fuente de significado", "Algunos vínculos afectivos sostenidos (familiar, amigo de larga data, vecino); red pequeña pero presente y recíproca en lo posible", "Vínculos tenues: contacto esporádico y mayoritariamente pasivo (recibe visitas); la red no genera apoyo emocional constante", "Red limitada a cuidadores formales o informales; ausencia de pares; las interacciones son instrumentales, no afectivas", "Muy aislado: contacto social mínimo y dependiente de rutinas de cuidado; sin conversaciones significativas fuera de necesidades básicas", "Casi sin contacto social; interacciones reducidas a actos de cuidado físico; sensación de invisibilidad o abandono expresada o inferida", "Aislamiento total; sin ningún vínculo social activo; dependencia completa de cuidado sin componente relacional; riesgo de deterioro acelerado"]}}, "acadlab": {"s6_11": {"q": "¿Cómo va en el colegio: asiste regularmente, cumple las tareas y sigue las instrucciones del aula? ¿Ha repetido algún grado o lo han derivado por dificultades académicas? ¿Puede participar en juego grupal y actividades escolares sin ser retirado del aula?", "short": ["Destaca en todo", "Buen desempeño", "Nivel del grado", "Por debajo del grado", "Repite / excluido", "Abandono escolar parcial", "Fuera del sistema"], "anchors": ["Rendimiento escolar superior al grado; participa, lidera y socializa en el aula sin dificultades.", "Cumple las exigencias del grado con buen desempeño sostenido; raramente necesita apoyo adicional.", "Asiste regularmente y alcanza los objetivos mínimos del grado; funciona en el aula de forma esperada para su edad.", "Rendimiento variable o por debajo del grado; necesita refuerzo frecuente o presenta conductas disruptivas que interfieren.", "Ha repetido un grado, suspensiones reiteradas o exclusiones del aula que interrumpen el aprendizaje.", "Abandono escolar parcial sostenido (asistencia mínima o escolarización alternativa de emergencia).", "Fuera del sistema escolar; sin acceso a ninguna forma de educación formal o estructurada."]}, "s12_15": {"q": "¿Está asistiendo al colegio y aprobando las materias? ¿Ha habido cambios bruscos en sus notas, ausentismo o conflictos con docentes desde que empezó secundaria? ¿Participa en alguna actividad extracurricular o tiene proyectos vocacionales incipientes?", "short": ["Destaca / lidera", "Buen rendimiento", "Aprueba todo", "Notas bajas / irregular", "Repite o suspende", "Abandono parcial", "Sin escolaridad"], "anchors": ["Rendimiento escolar sobresaliente; destaca entre pares, con participación activa y proyección vocacional clara.", "Aprueba con buen rendimiento sostenido; asistencia regular y cumplimiento de demandas académicas propias de la secundaria.", "Aprueba las materias del grado con desempeño acorde a lo esperado; asiste sin irregularidades significativas.", "Notas bajas o variables, ausentismo esporádico, o dificultades conductuales que empiezan a afectar el rendimiento.", "Ha repetido año, acumula varias materias suspensas o ha recibido suspensiones disciplinarias reiteradas.", "Asistencia mínima o abandono de hecho de varias materias; continúa matriculado pero sin participación real.", "Fuera del sistema escolar; sin matrícula ni formación alternativa activa."]}, "s16_18": {"q": "¿Está terminando el colegio o ha iniciado formación técnica / preuniversitaria? ¿Tiene planes concretos para después del egreso (universidad, trabajo, carrera técnica)? ¿Ha necesitado dejar estudios o cambiar de institución por dificultades emocionales, conductuales o económicas?", "short": ["Egresa con distinción", "En curso, estable", "Egresa / estudia normal", "Riesgo de no egreso", "Interrupciones mayores", "Abandono escolar", "Sin rol formativo"], "anchors": ["Termina secundaria con excelencia o ingresa a formación superior / técnica con logro destacado; proyecto vocacional sólido.", "Egresa o avanza en estudios sin dificultades significativas; tiene plan de continuidad formativa o laboral definido.", "Cumple los requisitos de egreso o formación acorde a lo esperado para su edad; proyecto futuro presente aunque no consolidado.", "En riesgo de no egresar: materias reprobadas acumuladas, ausentismo alto o conflictos institucionales que amenazan la continuidad.", "Interrupciones mayores en el ciclo formativo (cambio forzado de institución, año perdido, suspensión prolongada).", "Ha abandonado el sistema escolar o formativo de forma sostenida sin alternativa estructurada activa.", "Sin rol formativo ni laboral; completamente fuera de cualquier trayectoria productiva o educativa."]}, "s19_25": {"q": "¿Estás estudiando o trabajando actualmente? ¿Has podido mantener ese rol o ha habido interrupciones en el último año? ¿Cómo estás avanzando en tu carrera o en tus planes después del colegio?", "short": ["Pleno / destacado", "Avanzando bien", "Progreso normal", "Irregular / bajo", "Pausas repetidas", "Abandono parcial", "Sin rol activo"], "anchors": ["Estudia o trabaja con desempeño superior al esperado para su edad; avanza hacia metas académicas o laborales de forma consistente y autónoma.", "Estudia o trabaja regularmente con buen rendimiento; puede tener dudas vocacionales pero mantiene continuidad y progreso.", "Cumple con el rol productivo esperado (cursa estudios, trabaja a tiempo parcial o completo) con desempeño dentro del promedio; inestabilidad ocasional propia de la etapa.", "Rendimiento por debajo del promedio, cambios frecuentes de carrera o empleo, o asistencia/producción intermitente sin causa clara.", "Pausas repetidas en estudios o trabajo (baja, abandono temporal, despidos recurrentes); períodos sin rol productivo en los últimos 6 meses.", "Ha abandonado la mayor parte de sus estudios o empleo; mantiene algún vínculo mínimo pero sin participación funcional real.", "Sin ningún rol productivo activo (no estudia, no trabaja, no está en formación); inactividad total no explicada por transición voluntaria."]}, "s26_44": {"q": "¿Cómo va su trabajo o carrera en este momento? ¿Ha tenido que reducir su jornada, pedir licencias o dejar algún empleo por cómo se ha sentido? ¿Siente que su desempeño está a la altura de lo que se espera de usted en su trabajo o actividad principal?", "short": ["Carrera consolidada", "Estable / sólido", "Funcional", "Rendimiento bajo", "Licencias / pausas", "Abandono parcial", "Sin empleo activo"], "anchors": ["Desempeño laboral destacado; avanza en jerarquía, asume responsabilidades crecientes o logra metas de carrera sostenidamente.", "Empleo estable y productivo; cumple expectativas del rol con autonomía; gestiona familia y trabajo sin deterioro significativo.", "Mantiene empleo o actividad productiva con desempeño promedio; puede haber tensión por múltiples demandas (crianza, pareja, trabajo) pero sin deterioro funcional.", "Rendimiento notoriamente por debajo de lo esperado para su cargo o antigüedad; conflictos laborales recurrentes o ausentismo sin causa médica.", "Licencias médicas prolongadas, períodos de baja o despidos por causas relacionadas con salud mental o emocional en el último año.", "Ha reducido drásticamente su jornada o responsabilidades; mantiene un vínculo laboral mínimo que no corresponde a su capacidad previa.", "Sin empleo ni actividad productiva remunerada; inactividad laboral prolongada no atribuible a maternidad/paternidad voluntaria ni transición planificada."]}, "s45_64": {"q": "¿Sigue trabajando en lo mismo que venía haciendo o ha habido cambios importantes en su rol laboral en los últimos años? ¿Siente que puede rendir igual que antes o nota que le cuesta más sostener las responsabilidades de su trabajo? ¿Ha pensado en jubilarse o reducir su actividad?", "short": ["Pico / liderazgo", "Sólido y estable", "Funcional", "Rendimiento disminuido", "Retiro / bajas", "Rol muy reducido", "Sin rol productivo"], "anchors": ["En el pico de su carrera; ejerce liderazgo, mentoría o producción de alto nivel; generatividad plena en el ámbito profesional.", "Mantiene rol laboral consolidado con buen rendimiento; adapta sus responsabilidades a cambios de salud o contexto sin pérdida funcional significativa.", "Cumple con las demandas de su rol habitual; puede haber ajustes menores de ritmo o carga, pero sin deterioro productivo claro.", "Rendimiento notoriamente disminuido respecto a años anteriores; dificultad para sostener carga laboral habitual; puede estar en proceso de downsizing de rol.", "Retiro anticipado por salud, bajas frecuentes o licencias prolongadas; el deterioro funcional condiciona la continuidad laboral.", "Mantiene vínculo laboral nominal pero con participación muy reducida; delegó la mayor parte de sus funciones sin planificación de retiro.", "Sin actividad laboral ni productiva; retiro total anticipado o incapacidad laboral permanente antes del tiempo esperado de jubilación."]}, "s65_74": {"q": "¿Cómo ha sido la transición a la jubilación? ¿Tiene alguna actividad que le dé estructura o propósito en su semana —voluntariado, cuidado de nietos, trabajo part-time, algún proyecto personal? ¿Echa de menos su trabajo anterior o siente que encontró un nuevo ritmo?", "short": ["Rol nuevo activo", "Bien adaptado", "Adaptación parcial", "Rol difuso", "Sin rol claro", "Retirado / aislado", "Sin actividad"], "anchors": ["Ha construido un rol post-laboral significativo y activo (voluntariado, cuidado, emprendimiento, liderazgo comunitario); estructura semanal sólida y propósito definido.", "Bien adaptado a la jubilación; combina ocio, actividades con sentido y vínculos sociales productivos; transición elaborada sin pérdida de identidad.", "Adaptación parcialmente lograda; tiene algunas actividades con propósito pero la estructura es inconsistente o el rol post-laboral aún no está consolidado.", "Rol post-laboral difuso o ausente; pasa la mayor parte del tiempo sin actividades estructuradas; dificultad para encontrar sentido tras el retiro.", "Sin ningún rol social o productivo reconocible; evita compromisos, declina participación; el vacío de rol es una fuente de malestar activo.", "Retirado de casi toda actividad social y productiva; aislamiento significativo con pérdida de rutina y propósito.", "Sin ninguna actividad estructurada ni rol social; dependencia pasiva sin participación en ninguna esfera productiva o comunitaria."]}, "s75_84": {"q": "¿Qué actividades hace durante la semana que le den estructura o un sentido de hacer algo útil? ¿Ha tenido que dejar de hacer cosas que antes hacía —por salud, cansancio o porque la familia ya no lo permite? ¿Siente que todavía tiene un papel importante en su familia o comunidad?", "short": ["Rol activo adaptado", "Activo con ajustes", "Participa limitado", "Rol muy reducido", "Casi sin actividad", "Retirado / pasivo", "Sin rol funcional"], "anchors": ["Mantiene rol productivo adaptado a su capacidad funcional actual (cuidado de nietos, voluntariado liviano, transmisión de saberes); estructura semanal significativa.", "Participa activamente en actividades con propósito dentro de sus limitaciones físicas; rol familiar o comunitario reconocido, con ajustes razonables.", "Participa de forma limitada y variable; el declive funcional o la comorbilidad reducen la consistencia, pero persiste algún rol con sentido.", "Rol muy disminuido; la familia o la salud han restringido su participación; poca actividad estructurada, aunque desea hacer más de lo que puede.", "Casi sin actividad productiva o rol reconocible; depende de otros para la mayor parte de sus actividades; escasa iniciativa por limitación o desmotivación.", "Retirado de toda actividad social productiva; postura pasiva; el entorno no espera ni facilita participación activa.", "Sin ningún rol funcional reconocible; dependencia total en AVD básicas e instrumentales; sin participación en ninguna esfera productiva o social."]}, "s85": {"q": "¿Qué hace en un día típico? ¿Hay algo que todavía haga usted mismo/a que le importe poder seguir haciendo? ¿Siente que puede aportar algo —a su familia, a alguien que cuida, a lo que sea— aunque sea desde casa?", "short": ["Rol preservado", "Aporta activamente", "Participa con apoyo", "Rol simbólico", "Pasivo / dependiente", "Sin rol reconocido", "Dependencia total"], "anchors": ["A pesar de la fragilidad, mantiene un rol productivo o de significado activo (narrativa familiar, consejo, cuidado emocional) que el entorno valora y facilita.", "Aporta activamente dentro de sus posibilidades; puede tener actividad cognitiva o social estructurada; rol familiar o espiritual reconocido.", "Participa con apoyo externo en actividades mínimas con propósito; la familia o el equipo de salud facilitan algún grado de agencia.", "Rol principalmente simbólico o ceremonial; el entorno lo respeta pero no espera ni facilita participación activa; pasividad creciente.", "Posición pasiva en el entorno familiar y social; recibe cuidado sin ejercer rol propio; escasa iniciativa o capacidad para contribuir.", "Sin rol reconocible por el entorno ni por el propio paciente; presencia sin función en la dinámica familiar o institucional.", "Dependencia total en todos los dominios; sin actividad autónoma ni participación en ninguna esfera; foco exclusivo en cuidados básicos de preservación."]}}, "vincular": {"s12_15": {"q": "¿Tiene amigos cercanos con quienes comparte cosas personales o secretos? ¿Ha tenido algún crush o interés romántico, y cómo lo manejó? ¿Se siente cómodo/a siendo él/ella mismo/a con las personas que más quiere?", "short": ["Amigo íntimo estable", "Confianza con pares", "Vínculos, cambiantes", "Amistades inestables", "Dificultad confiar", "Evita cercanía", "Sin vínculo afectivo"], "anchors": ["Tiene al menos un amigo cercano recíproco con quien comparte secretos y emociones; primeros vínculos íntimos emergentes y apropiados a la edad.", "Capacidad de confianza con pares clara; comparte aspectos personales aunque los vínculos íntimos aún son inconstantes o cambiantes.", "Vínculos afectivos presentes con pares; interés romántico incipiente y normativo, sin amistad íntima estable o exclusiva.", "Amistades frecuentemente cambiantes o conflictivas; dificultad para mantener continuidad en la cercanía con pares.", "Dificultad marcada para confiar o abrirse; relaciones con pares superficiales o instrumentales, sin componente emocional real.", "Evita activamente la cercanía emocional; prefiere aislarse o interactuar solo en superficies seguras (p.ej. solo online o grupos grandes).", "Aislamiento afectivo; sin vínculo de confianza real con ningún par; incapacidad de iniciar o sostener cualquier forma de intimidad apropiada a la edad."]}, "s16_18": {"q": "¿Tiene o ha tenido una relación romántica? ¿Cómo describiría su capacidad de abrirse emocionalmente con esa persona o con su mejor amigo/a? ¿Las relaciones cercanas tienden a durar o se rompen con frecuencia?", "short": ["Romance/amistad íntima", "Intimidad consolidándose", "Afecto, altibajos", "Romance breve/conflicto", "Dificultad intimar", "Evitación afectiva", "Aislamiento relacional"], "anchors": ["Relación romántica o amistad íntima sostenida y recíproca; capaz de compartir vulnerabilidad y manejar conflictos de forma básica.", "Capacidad de intimidad emocional en proceso de consolidación; relaciones significativas aunque con fluctuaciones normativas propias de la etapa.", "Vínculos afectivos presentes con pares o pareja; intimidad emocional aparece pero es irregular, con altibajos esperados en la adolescencia tardía.", "Relaciones románticas o de amistad íntima de corta duración o marcadas por conflicto recurrente; continuidad afectiva pobre.", "Dificultad significativa para compartir aspectos emocionales; relaciones se mantienen en nivel superficial pese al deseo de cercanía.", "Evitación activa de la intimidad emocional o romántica; relaciones limitadas a lo funcional o grupal, sin componente afectivo real.", "Aislamiento relacional completo; sin vínculo íntimo de ningún tipo; incapacidad o rechazo marcado a cualquier forma de cercanía emocional."]}, "s19_25": {"q": "¿Tienes pareja actualmente o has tenido relaciones románticas importantes en los últimos años? ¿Cómo describes tu capacidad de abrirte emocionalmente con alguien cercano?", "short": ["Vínculo íntimo estable", "Intimidad exploratoria", "Afecto sin pareja", "Relaciones breves/conflicto", "Vínculos superficiales", "Evita la intimidad", "Aislamiento afectivo"], "anchors": ["Mantiene relación de pareja con intimidad emocional real o red afectiva cercana sólida; puede explorar compromisos progresivos desde una base segura.", "Tiene o ha tenido vínculos íntimos con capacidad de apertura emocional, aunque la inestabilidad propia de la exploración (Arnett) genera oscilaciones normativas.", "Afecto y conexión emocional presentes con amigos o familia cercana, pero sin pareja estable; la exploración romántica está activa sin consolidarse.", "Relaciones románticas frecuentemente breves, caóticas o con conflicto repetido; dificultad para mantener intimidad más allá de las primeras etapas.", "Vínculos mayoritariamente superficiales; evita la profundidad emocional aunque desea conexión; posible ansiedad de apego activada en la salida del hogar.", "Evita activamente la intimidad romántica o emocional; relaciones instrumentales o ausentes; puede enmascararse como independencia en la etapa emergente.", "Aislamiento afectivo claro; ausencia de vínculos cercanos significativos; la exploración identitaria ocurre en desconexión interpersonal marcada."]}, "s26_44": {"q": "¿Tiene pareja estable o ha construido una vida en común con alguien? ¿Cómo es la intimidad emocional en esa relación o en sus vínculos más cercanos?", "short": ["Pareja/vínculo estable", "Intimidad consolidada", "Afecto sin pareja", "Pareja con conflicto", "Vínculos superficiales", "Evita intimidad", "Aislamiento afectivo"], "anchors": ["Pareja estable con intimidad emocional sostenida; o red de vínculos cercanos con capacidad de reciprocidad y apoyo mutuo en fase de establecimiento vital.", "Vínculo íntimo presente y funcional, con alguna dificultad puntual (crianza, carrera) que no compromete la base afectiva de la relación.", "Capacidad de intimidad emocional clara, pero sin pareja estable; vínculos afectivos profundos con pares o familia compensan parcialmente.", "Pareja presente pero con conflicto recurrente, distancia emocional creciente o historia de rupturas que interfiere con la generatividad esperada en esta etapa.", "Relaciones mayoritariamente superficiales o funcionales; evita la profundidad; puede coincidir con sobreinversión en carrera a costo de la intimidad.", "Evitación sistemática de la intimidad emocional; posibles relaciones paralelas o instrumentales; el establecimiento de pareja/familia está bloqueado por elección defensiva.", "Aislamiento afectivo consolidado; ausencia de vínculos íntimos en una etapa normativa de alta demanda interpersonal; riesgo elevado de soledad estructural."]}, "s45_64": {"q": "¿Cómo está su relación de pareja en este momento, o sus vínculos afectivos más cercanos? ¿Los cambios de esta etapa —hijos que se van, menopausia/andropausia, presiones laborales— han afectado su vida íntima?", "short": ["Pareja íntima estable", "Intimidad renegociada", "Afecto sin pareja", "Pareja distante/crisis", "Vínculos superficiales", "Evita intimidad", "Aislamiento afectivo"], "anchors": ["Relación de pareja con intimidad emocional sostenida y capacidad de renegociación ante cambios del nido vacío o cambios físicos; o red afectiva cercana equivalente.", "Vínculo íntimo presente con ajustes activos a los cambios de la adultez media; alguna fricción normativa pero sin ruptura de la intimidad emocional.", "Capacidad afectiva e intimidad emocional preservadas, pero sin pareja estable; puede reflejar divorcio previo o soltería consolidada con red cercana funcional.", "Pareja presente pero con distancia emocional significativa, crisis de pareja en contexto de nido vacío o desencuentros ligados a cambios de rol y salud.", "Vínculos mayoritariamente instrumentales o formales; la generatividad hacia hijos/trabajo sustituye pero no reemplaza la intimidad emocional real.", "Evitación activa de la intimidad; relación de pareja coexistente pero emocionalmente vacía, o aislamiento electivo que se consolida en la adultez media.", "Aislamiento afectivo marcado; ausencia de vínculos íntimos significativos; coincide frecuentemente con crisis de identidad de mediana edad no resuelta."]}, "s65_74": {"q": "¿Cómo está su relación con su pareja o sus personas más cercanas ahora que ha cambiado su rutina con la jubilación? ¿Se siente emocionalmente conectado con quienes le importan?", "short": ["Pareja/vínculo íntimo", "Intimidad activa", "Afecto sin pareja", "Pareja distante", "Vínculos escasos", "Evita contacto", "Aislamiento afectivo"], "anchors": ["Vínculo de pareja con intimidad emocional activa y reorganización positiva post-jubilación; o red afectiva cercana con reciprocidad sostenida.", "Intimidad presente y funcional con ajustes a la nueva cotidianidad compartida; jubilación como oportunidad de reconexión emocional.", "Capacidad afectiva preservada sin pareja (por viudez, divorcio o soltería); vínculos con hijos, amigos o comunidad compensan la intimidad diádica.", "Pareja presente pero con dificultad de reconexión emocional post-jubilación; convivencia aumentada puede revelar distancia afectiva preexistente.", "Red íntima notablemente reducida; vínculos superficiales o escasos; inicio de contracción de red social sin reemplazo emocional funcional.", "Evitación del contacto íntimo; prefiere aislamiento; puede enmascararse como autonomía o desinterés en una etapa donde la red aún es accesible.", "Aislamiento afectivo claro; pérdidas no elaboradas (viudez, rupturas) o retracción temprana de vínculos que anticipa vulnerabilidad en etapas posteriores."]}, "s75_84": {"q": "¿Con quién se siente más cercano emocionalmente en su vida cotidiana? ¿Las pérdidas de personas queridas han afectado mucho su vida afectiva en estos años?", "short": ["Vínculo íntimo activo", "Intimidad sostenida", "Afecto adaptado", "Vínculos disminuidos", "Red muy reducida", "Retiro afectivo", "Aislamiento afectivo"], "anchors": ["Vínculo íntimo activo con pareja, hijo/a u otra figura cercana; intimidad emocional sostenida a pesar del declive funcional y las pérdidas acumuladas.", "Intimidad emocional presente y funcional con figuras clave; adaptación activa ante la contracción de red propia de esta etapa.", "Afecto y apertura emocional preservados; red íntima reducida por viudez o mortalidad de pares, pero los vínculos restantes son cualitativamente significativos.", "Red afectiva disminuida con vínculos de baja reciprocidad; dependencia funcional puede distorsionar la intimidad hacia relaciones de cuidado asimétricas.", "Red íntima muy reducida; escasas personas cercanas; la comorbilidad y las pérdidas han erosionado los vínculos sin que se hayan formado nuevos.", "Retiro afectivo progresivo; disengagement no elaborado; evitación de nuevos vínculos ante el duelo anticipatorio o las pérdidas acumuladas.", "Aislamiento afectivo severo; ausencia de vínculos íntimos en contexto de alta vulnerabilidad funcional; riesgo elevado de soledad patológica y depresión."]}, "s85": {"q": "¿Hay alguien con quien pueda hablar de lo que siente o de lo que le preocupa? ¿Se siente acompañado emocionalmente en su vida diaria?", "short": ["Vínculo íntimo presente", "Conexión afectiva", "Afecto con apoyo", "Vínculo asimétrico", "Contacto escaso", "Retiro afectivo", "Aislamiento afectivo"], "anchors": ["Vínculo íntimo presente y recíproco (pareja, hijo/a, cuidador de confianza); intimidad emocional activa pese a la fragilidad y la dependencia creciente.", "Conexión afectiva real con al menos una figura cercana; la relación preserva reciprocidad emocional aunque la autonomía física esté comprometida.", "Afecto y apertura emocional presentes dentro de una red de apoyo formal o familiar; los vínculos están mediados por el cuidado pero conservan calidez.", "Vínculo principalmente asimétrico (cuidador/cuidado) con escasa reciprocidad emocional real; la dependencia difumina la intimidad.", "Contacto social escaso y mayoritariamente instrumental; ausencia de figuras de intimidad emocional; la fragilidad y la mortalidad de pares reducen drásticamente la red.", "Retiro afectivo activo o pasivo; desconexión emocional en un contexto de dependencia; puede reflejar elaboración tardía de duelos o resignación ante la pérdida de vínculos.", "Aislamiento afectivo severo; ausencia total de vínculos íntimos; soledad extrema en contexto de fragilidad y dependencia; máximo riesgo psicosocial."]}}, "autonomia": {"s6_11": {"q": "¿El niño hace solo las actividades básicas del colegio y la casa que se esperan para su edad (preparar su mochila, organizarse para el recreo, vestirse)? ¿Necesita más ayuda que sus compañeros para tareas cotidianas? ¿Puede tomar decisiones simples por sí mismo (qué jugar, con quién sentarse)?", "short": ["Autónomo p/su edad", "Apoyos mínimos", "Funcional básico", "Dep. parcial", "Dep. marcada", "Dep. casi total", "Sin autonomía"], "anchors": ["Cuida su higiene, organiza útiles y toma decisiones simples sin guía adulta, acorde a lo esperado para 6–11 años.", "Realiza rutinas básicas con recordatorios ocasionales; necesita apoyo normal para la edad en tareas complejas.", "Completa la mayoría de tareas escolares y domésticas básicas con supervisión; dependencia puntual esperable.", "Requiere asistencia adulta constante en varias rutinas básicas (vestirse, organizar materiales, higiene); iniciativa limitada.", "Depende de adultos para la mayoría de actividades cotidianas; autonomía reducida incluso en tareas simples para su edad.", "Dependencia casi total para actividades básicas de autocuidado y organización escolar; requiere dirección continua.", "Sin capacidad de iniciar o completar ninguna actividad cotidiana sin guía directa; dependencia completa para su edad."]}, "s12_15": {"q": "¿El adolescente puede manejar sus responsabilidades escolares y personales sin que los padres tengan que recordárselo todo? ¿Toma decisiones sobre su tiempo libre, amistades o actividades de forma autónoma? ¿Pide ayuda cuando la necesita o depende de que el adulto lo dirija en todo?", "short": ["Autónomo p/su edad", "Iniciativa propia", "Funcional c/guía", "Dep. parcial", "Dep. marcada", "Dep. casi total", "Sin autonomía"], "anchors": ["Gestiona tareas escolares, rutinas personales y decisiones sociales básicas sin supervisión adulta constante, acorde a 12–15 años.", "Autónomo en lo cotidiano con apoyo ocasional; negocia límites y toma decisiones en áreas normativas para su edad.", "Maneja responsabilidades básicas pero requiere estructura adulta para tareas más complejas o nuevas situaciones.", "Dificultad para organizar su vida cotidiana sin dirección frecuente; autonomía limitada en decisiones personales o escolares.", "Depende de guía adulta para la mayoría de actividades; iniciativa propia muy reducida, incluso en áreas esperables para su edad.", "Dependencia casi total para organización diaria, higiene y decisiones básicas; requiere supervisión constante.", "Sin capacidad de gestión autónoma alguna; dependencia completa incluso para decisiones elementales."]}, "s16_18": {"q": "¿El joven maneja sus asuntos cotidianos (horarios, economía personal, gestiones escolares) con autonomía real o necesita que un adulto lo haga por él? ¿Está desarrollando planes propios para su futuro inmediato (trabajo, estudios, independencia)? ¿Puede resolver problemas prácticos del día a día sin recurrir siempre a sus padres?", "short": ["Autónomo emergente", "Autogestionado", "Funcional c/apoyos", "Dep. parcial", "Dep. marcada", "Dep. casi total", "Sin autonomía"], "anchors": ["Gestiona economía personal, trámites escolares y decisiones vitales con plena iniciativa; proyecta independencia futura de forma realista.", "Autónomo en lo cotidiano; recurre ocasionalmente a adultos para decisiones de alto impacto, lo cual es esperable a esta edad.", "Maneja aspectos básicos de su vida con supervisión adulta parcial; iniciativa propia presente pero inconsistente.", "Requiere apoyo adulto frecuente para organización, economía o planificación; autonomía funcional solo en áreas muy acotadas.", "Depende de adultos para la mayoría de decisiones cotidianas y gestiones prácticas; escasa proyección de independencia futura.", "Dependencia casi total; no inicia gestiones propias ni toma decisiones sin dirección externa explícita.", "Sin ninguna forma de autodirección; dependencia completa para todas las áreas de la vida cotidiana."]}, "s19_25": {"q": "¿Vives con tu familia o de forma independiente? ¿Tomas tus propias decisiones sobre estudios, trabajo y dinero, o dependes de que otros decidan por ti?", "short": ["Independiente", "Semiautónomo", "En transición", "Dep. parental mod.", "Dep. parental imp.", "Dep. casi total", "Sin autonomía"], "anchors": ["Vive de forma independiente, gestiona su economía y toma decisiones propias sobre estudios, trabajo y vida cotidiana sin apoyo parental.", "Gestiona lo cotidiano de forma autónoma pero recurre ocasionalmente a apoyo parental económico o decisional sin que esto limite su funcionamiento.", "Ha iniciado la transición hacia la independencia (salida parcial del hogar, empleo esporádico) pero sigue dependiendo de la familia en áreas clave.", "Vive con la familia o depende de ella económicamente de forma consistente; autonomía restringida a decisiones menores sin consecuencias reales.", "No ha iniciado la transición hacia la independencia; los padres u otros adultos toman la mayoría de las decisiones importantes de su vida.", "Totalmente dependiente del núcleo familiar para vivienda, economía y decisiones cotidianas; no ejerce iniciativa propia.", "Dependencia absoluta sin ningún intento de autodirección; requiere supervisión o gestión externa para cualquier aspecto de su vida diaria."]}, "s26_44": {"q": "¿Eres capaz de manejar tu hogar, economía y responsabilidades laborales/familiares de forma autónoma? ¿Hay áreas de tu vida donde sientas que otros tienen que hacerse cargo por ti?", "short": ["Plena autonomía", "Autónomo c/ apoyo", "Funcional", "Limitado", "Dep. importante", "Dep. casi total", "Sin autonomía"], "anchors": ["Gestiona de forma completamente autónoma hogar, economía, trabajo y responsabilidades familiares; toma decisiones complejas con seguridad.", "Autónomo en la mayoría de los dominios; recurre puntualmente a red de apoyo (pareja, familia) sin que esto comprometa su funcionamiento global.", "Funciona de forma independiente en lo cotidiano pero presenta dificultades en al menos un dominio relevante (finanzas, parentalidad, decisiones laborales).", "Autonomía parcial: requiere apoyo significativo de pareja, familia u otros para sostener responsabilidades laborales, económicas o del hogar.", "Dependencia importante en múltiples dominios; no puede sostener responsabilidades de adulto establecido sin ayuda externa sistemática.", "Dependencia casi total de otros para el manejo del hogar, economía y decisiones; rol adulto ejercido mínimamente.", "Incapaz de gestionar ningún aspecto de la vida adulta de forma autónoma; requiere supervisión o tutela para lo cotidiano."]}, "s45_64": {"q": "¿Sigue siendo usted quien toma las decisiones importantes en su vida (trabajo, economía, salud)? ¿Ha notado cambios en su capacidad de manejar sus responsabilidades cotidianas?", "short": ["Plena autonomía", "Autónomo c/ ajustes", "Funcional", "Autonomía reducida", "Dep. moderada", "Dep. importante", "Sin autonomía"], "anchors": ["Plena autodirección en trabajo, economía, salud y hogar; gestiona cambios de la mediana edad (salud, reestructuraciones) con adaptación efectiva.", "Autónomo con ajustes adaptativos menores ante cambios de salud o laborales; mantiene el control de las decisiones centrales de su vida.", "Funciona de forma independiente en lo cotidiano pero necesita apoyos puntuales para decisiones complejas o ante cambios de salud incipientes.", "Autonomía reducida en al menos dos dominios (laboral, económico, salud); delega decisiones o responsabilidades que antes manejaba solo.", "Depende de otros de forma moderada para el manejo de su vida; limitaciones de salud u otros factores requieren apoyo sostenido.", "Dependencia importante en la mayoría de los dominios de la vida adulta; autonomía reservada a decisiones menores o preferencias personales.", "Sin capacidad de autodirección en ningún dominio relevante; requiere supervisión o tutela completa."]}, "s65_74": {"q": "¿Puede manejar su día a día, sus finanzas y sus decisiones de salud por sí mismo? Desde que se jubiló, ¿ha cambiado su sensación de ser dueño de su propia vida?", "short": ["Ind. plena post-jub.", "Autónomo c/ red", "Funcional adaptado", "Ind. parcial", "Dep. incipiente", "Dep. establecida", "Sin autonomía"], "anchors": ["Gestiona vida cotidiana, finanzas y salud de forma completamente autónoma tras la jubilación; reorganizó roles y mantiene autodirección plena.", "Independiente con apoyo espontáneo de red social/familiar en algunas decisiones; conserva el control de su vida sin necesidad de ayuda formal.", "Funciona de forma independiente en lo cotidiano con adaptaciones menores (p.ej. delega conducción, apoyos tecnológicos); autonomía preservada en lo sustancial.", "Independencia parcial: requiere ayuda regular en algunas áreas (gestiones complejas, transporte, salud) pero mantiene control en lo cotidiano básico.", "Dependencia incipiente de red familiar o servicios para actividades instrumentales relevantes; autonomía en riesgo pero no perdida.", "Dependencia establecida para múltiples actividades; la autodirección se limita a preferencias personales dentro de un marco de cuidado externo.", "Sin capacidad de gestionar ningún aspecto de la vida cotidiana de forma autónoma; requiere cuidado continuo."]}, "s75_84": {"q": "¿Puede arreglárselas solo en casa y en sus gestiones del día a día? ¿En qué cosas ha tenido que pedir más ayuda en los últimos años?", "short": ["Autónomo", "Autónomo c/ asist.", "Dep. leve", "Dep. moderada", "Dep. importante", "Dep. severa", "Dep. total"], "anchors": ["Conserva autonomía plena en actividades básicas e instrumentales pese al envejecimiento; gestiona su salud y vida cotidiana sin ayuda formal.", "Autónomo con asistencia puntual para tareas específicas (transporte, gestiones complejas); independencia preservada en lo cotidiano básico.", "Dependencia leve: requiere ayuda regular en actividades instrumentales (compras, medicación, finanzas) pero mantiene autonomía en ABVD.", "Dependencia moderada: necesita ayuda en actividades básicas (higiene, alimentación) y en la mayoría de las instrumentales; supervisión frecuente.", "Dependencia importante: autonomía reservada a decisiones de preferencia; requiere apoyo formal o familiar para la mayor parte de las actividades diarias.", "Dependencia severa en casi todas las actividades; puede expresar preferencias pero necesita cuidado activo para sobrevivir en el domicilio.", "Dependencia total: no puede realizar ninguna actividad de forma autónoma; requiere cuidado institucional o cuidador dedicado 24 h."]}, "s85": {"q": "¿Puede valerse por sí mismo para las cosas básicas del día a día, como vestirse, comer o moverse por casa? ¿Quién le ayuda y en qué cosas?", "short": ["Autónomo funcional", "Autónomo c/ soportes", "Dep. leve", "Dep. moderada", "Dep. importante", "Dep. severa", "Dep. total"], "anchors": ["Conserva autonomía funcional en actividades básicas e instrumentales a pesar de la fragilidad avanzada; excepción en la norma estadística.", "Independiente con soportes formales o tecnológicos (adaptaciones del hogar, ayuda domiciliaria leve); preserva decisiones cotidianas propias.", "Dependencia leve en ABVD (necesita asistencia en algunas) pero conserva participación activa en decisiones que le conciernen.", "Dependencia moderada en ABVD; el cuidado externo es constante pero el paciente mantiene cierta expresión de voluntad y preferencias.", "Dependencia importante: requiere cuidado activo para la mayoría de las ABVD; autonomía expresada solo en preferencias puntuales.", "Dependencia severa: el cuidado es prácticamente completo; la autonomía se limita a respuestas afectivas básicas o comunicación mínima.", "Dependencia total: requiere cuidado institucional intensivo o atención paliativa; no hay capacidad funcional autónoma en ningún dominio."]}}, "autocuidado": {"s6_11": {"q": "¿El niño puede vestirse, bañarse y cepillarse los dientes solo, o necesita que un adulto lo guíe o lo haga por él? ¿Come con regularidad y duerme a la hora esperada para su edad?", "short": ["Independiente/sano", "Autónomo adecuado", "Hábitos irregulares", "Descuido leve", "Necesita guía adulta", "Supervisión constante", "Dependiente total"], "anchors": ["Se viste, higieniza y alimenta solo; sueño regular; sin quejas somáticas recurrentes.", "Realiza AVD básicas con mínimos recordatorios; hábitos de sueño y alimentación generalmente adecuados.", "AVD ejecutadas pero con inconsistencia frecuente (baño irregular, saltarse comidas, bedtime resistido).", "Descuido visible: ropa sucia tolerada, higiene dental omitida, sueño acortado sin protesta del niño.", "Requiere que el adulto inicie y supervise cada AVD; sin guía no las completa.", "La mayoría de AVD requieren asistencia directa; resistencia o indiferencia marcada ante el autocuidado.", "Incapaz de participar en ninguna AVD básica; dependencia completa del cuidador."]}, "s12_15": {"q": "¿Cuida su higiene personal sin que los padres tengan que recordárselo constantemente? ¿Come y duerme con regularidad, o el grupo de pares y la pantalla han desorganizado esos hábitos?", "short": ["Autónomo/saludable", "Hábitos sólidos", "Hábitos irregulares", "Descuido leve", "Recordatorios frecuentes", "Descuido notorio", "Dependencia/abandono"], "anchors": ["Gestiona higiene, alimentación y sueño de forma autónoma; hábitos saludables sostenidos sin supervisión.", "Autocuidado adecuado; alguna irregularidad de sueño o alimentación ocasional sin impacto funcional.", "Higiene y sueño variables; saltarse comidas o dormir tarde frecuentemente ligado a redes sociales o grupo de pares.", "Descuido visible: higiene inconsistente, alimentación desordenada, privación de sueño habitual aceptada sin conflicto.", "Requiere recordatorios diarios de padres para higiene básica; no regula sueño ni alimentación por sí mismo.", "Descuido marcado reconocido por pares o docentes; AVD mayormente asistidas; resistencia activa al autocuidado.", "Abandono casi total del autocuidado; dependencia del adulto para AVD elementales."]}, "s16_18": {"q": "¿Mantiene rutinas de higiene, alimentación y sueño de forma autónoma ahora que tiene más libertad? ¿Ha habido cambios en su peso, sueño o cuidado corporal desde que inició esta etapa?", "short": ["Autónomo/saludable", "Hábitos sostenidos", "Irregularidad leve", "Descuido incipiente", "Desorganización notable", "AVD comprometidas", "Abandono total"], "anchors": ["Autocuidado pleno y autónomo; sueño, alimentación e higiene sostenidos sin supervisión familiar.", "Hábitos mayormente saludables; irregularidades puntuales sin repercusión en funcionamiento general.", "Hábitos inconsistentes (sueño retrasado crónico, saltar comidas, higiene variable) sin afección significativa aún.", "Descuido incipiente reconocible: baja de peso, higiene deteriorada o privación de sueño que empieza a afectar rendimiento.", "Desorganización notable del autocuidado; requiere intervención familiar o del entorno para mantener mínimos.", "AVD básicas comprometidas; higiene, alimentación o sueño claramente deteriorados; necesita apoyo para funcionar.", "Abandono total del autocuidado; dependencia de adultos para AVD elementales."]}, "s19_25": {"q": "¿Cómo
