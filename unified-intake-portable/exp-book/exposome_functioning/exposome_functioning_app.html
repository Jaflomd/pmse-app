 estás durmiendo y comiendo desde que vives solo o con menos supervisión? ¿Estás yendo al médico cuando lo necesitas o lo postergás? ¿Hay consumo de alcohol u otras sustancias que esté afectando tu rutina de autocuidado?", "short": ["Sano y activo", "Hábitos bastante buenos", "Hábitos caóticos", "Hábitos irregulares claros", "Autocuidado muy deteriorado", "Asistencia puntual necesaria", "Dependencia total"], "anchors": ["Higiene, sueño, alimentación y ejercicio consistentes; gestiona su salud de forma autónoma y proactiva en el contexto de la vida universitaria o laboral incipiente.", "Cuida su salud en general, con algún descuido menor típico de la transición (sueño irregular en épocas de exámenes, dieta imperfecta) sin consecuencias funcionales.", "AVD preservadas pero con patrón de vida caótico: sueño fragmentado por ocio nocturno, alimentación ultraprocesada, ejercicio esporádico; no consulta salud preventivamente.", "Descuido visible: higiene inconsistente, saltea comidas frecuentemente, duerme menos de 5 h de forma sostenida; pospone atención médica de forma sistemática.", "Autocuidado muy deteriorado: no mantiene higiene básica regular, come mal o muy poco, sueño profundamente alterado; requiere que otros le recuerden o faciliten actividades básicas.", "Depende de otro para completar AVD básicas (baño, alimentación), aunque la causa es principalmente psicopatológica/conductual más que déficit físico en esta etapa.", "Incapacidad total para el autocuidado; requiere asistencia continua para todas las AVD básicas; nivel incompatible con vida independiente sin supervisión activa."]}, "s26_44": {"q": "¿Estás pudiendo sostener tus hábitos de salud (sueño, alimentación, ejercicio) con la carga de trabajo y familia? ¿Cuándo fue la última vez que fuiste al médico por algo que no fuera urgente? ¿Sentís que el autocuidado quedó postergado frente a las responsabilidades de pareja, hijos o trabajo?", "short": ["Salud sostenida", "Hábitos funcionales", "Descuido por sobrecarga", "Hábitos claramente pobres", "Autocuidado muy precario", "Asistencia necesaria", "Dependencia total"], "anchors": ["Mantiene higiene, sueño reparador, alimentación equilibrada y ejercicio regular pese a la carga de roles; gestiona proactivamente su salud en el contexto de vida adulta establecida.", "Autocuidado adecuado con fluctuaciones relacionadas con demandas laborales o parentales; salud general buena; controles médicos realizados sin ser urgentes.", "AVD preservadas pero hábitos sistemáticamente sacrificados por la sobrecarga de roles (sueño reducido, comida rápida, sin ejercicio); no consulta salud preventivamente.", "Descuido claro y sostenido: higiene inconsistente, alimentación muy deficiente, sueño cronicamente insuficiente; posterga atención médica incluso ante síntomas.", "Autocuidado muy precario: no puede sostener higiene ni alimentación adecuadas sin apoyo externo; funcionamiento físico y AVD comprometidos de forma significativa.", "Requiere asistencia concreta de pareja, familiar o servicio para realizar AVD básicas; el deterioro supera lo esperable por carga de rol.", "Dependencia total para todas las AVD; requiere cuidado continuo; nivel incompatible con el funcionamiento adulto independiente esperado en esta etapa."]}, "s45_64": {"q": "¿Estás controlando sus condiciones de salud crónicas (presión, glucosa, colesterol)? ¿Cómo impacta en su cuidado personal el pico de responsabilidades laborales y familiares? ¿Ha habido cambios en su sueño, peso o energía en los últimos años que no haya consultado?", "short": ["Salud activamente gestionada", "Autocuidado adecuado", "Hábitos descuidados", "Descuido crónico visible", "AVD comprometidas", "Asistencia necesaria", "Dependencia total"], "anchors": ["Gestiona activamente enfermedades crónicas incipientes (si las hay), mantiene controles preventivos, hábitos de sueño, dieta y ejercicio adaptados a los cambios de la mediana edad (menopausia, cambios metabólicos).", "Buen autocuidado general con seguimiento médico razonable; algunos descuidos menores sin consecuencias funcionales significativas; manejo adecuado de condiciones crónicas si existen.", "AVD preservadas pero hábitos sistemáticamente pobres: sedentarismo instaurado, dieta deficiente, sueño alterado; tratamientos crónicos mal adheridos; no realiza controles preventivos.", "Descuido marcado y sostenido: higiene personal inconsistente, muy mala alimentación, sueño muy alterado, abandono de tratamientos; signos físicos del descuido evidentes.", "Autocuidado muy comprometido: dificultad para sostener AVD básicas sin apoyo; comorbilidades descontroladas por falta de adherencia; requiere asistencia para algunas actividades cotidianas.", "Depende de cuidador para AVD básicas; el deterioro combina desregulación psicopatológica con comienzo de limitación funcional física en el contexto de morbilidad acumulada.", "Dependencia total para todas las AVD básicas; requiere cuidado continuo; nivel que anticipa necesidades de vejez avanzada tempranamente."]}, "s65_74": {"q": "¿Cómo está organizando su rutina de salud desde la jubilación? ¿Está manteniendo sus controles médicos y tomando su medicación de manera regular? ¿Ha notado cambios en su energía, movilidad o sueño que hayan afectado lo que puede hacer por sí mismo?", "short": ["Activo y autónomo", "Autónomo con apoyos", "Hábitos irregulares", "Descuido sostenido", "AVD parcialmente asistidas", "Asistencia cotidiana", "Dependencia total"], "anchors": ["Completamente autónomo en todas las AVD; mantiene actividad física, dieta equilibrada, sueño suficiente y adherencia a controles preventivos; gestiona su salud proactivamente post-jubilación.", "Autónomo en AVD instrumentales y básicas; adherencia razonable a medicación y controles; alguna limitación menor (p.ej. movilidad reducida) sin impacto funcional significativo.", "AVD básicas preservadas pero hábitos irregulares: actividad física escasa, dieta deficiente, sueño fragmentado, adherencia médica inconsistente; no busca atención preventiva.", "Descuido visible y sostenido: higiene personal inconsistente, sedentarismo marcado, medicación frecuentemente omitida; limitación funcional incipiente que no es compensada.", "Necesita apoyo para algunas AVD básicas o instrumentales; higiene, alimentación o movilidad comprometidas; gestión de salud requiere supervisión de familiar o red de apoyo.", "Requiere asistencia cotidiana para la mayoría de las AVD; autonomía muy reducida; riesgo de institucionalización si red de apoyo es insuficiente.", "Dependencia total en todas las AVD; requiere cuidado continuo; nivel incompatible con vida independiente."]}, "s75_84": {"q": "¿Puede bañarse, vestirse y moverse por su hogar sin ayuda o necesita que alguien le asista? ¿Está tomando todos sus medicamentos correctamente? ¿Tiene alguna caída reciente o miedo a caerse que haya cambiado lo que hace en el día?", "short": ["Funcional y autónomo", "Autónomo con adaptaciones", "Apoyo instrumental leve", "Asistencia parcial AVD", "Asistencia cotidiana", "Cuidado casi total", "Dependencia total"], "anchors": ["Preserva autonomía en todas las AVD básicas e instrumentales; actividad física adaptada a la edad; adherencia a medicación y controles; sin caídas recientes; red de apoyo presente pero no necesaria para AVD.", "Autónomo en AVD básicas con adaptaciones menores (barandas, utensilios adaptados); puede requerir ayuda puntual en AVD instrumentales complejas (transporte, finanzas); hábitos de salud razonables.", "Autonomía en AVD básicas preservada pero requiere apoyo instrumental regular (compras, medicación supervisada, transporte); hábitos de salud deficientes o sueño muy alterado.", "Necesita asistencia para algunas AVD básicas (baño, preparación de alimentos); movilidad reducida con riesgo de caídas; medicación frecuentemente omitida o confundida; higiene comprometida.", "Requiere asistencia cotidiana para la mayoría de las AVD básicas; higiene dependiente de cuidador; movilidad muy limitada; gestión de salud completamente dependiente de terceros.", "Cuidado casi continuo para AVD básicas; solo conserva autonomía muy parcial en algunas actividades simples; alto riesgo de institucionalización.", "Dependencia total; postrado o con movilidad mínima; requiere cuidado continuo para todas las AVD básicas; nivel consistente con cuidado institucional o domiciliario intensivo."]}, "s85": {"q": "¿Puede levantarse, moverse y cuidarse en el día a día, o necesita que alguien esté presente para ayudarle? ¿Quién se encarga de su medicación y de sus controles médicos? ¿Ha habido alguna caída, hospitalización o pérdida de peso importante en el último año?", "short": ["Frágil pero autónomo", "Autonomía con supervisión", "Asistencia parcial diaria", "Alta dependencia AVD", "Dependencia casi total", "Dependencia total activa", "Dependencia total postrada"], "anchors": ["Frágil pero funcionalmente autónomo en AVD básicas; activo dentro de sus límites; adherente a medicación con apoyos simples; sin hospitalizaciones recientes; preserva autocuidado básico.", "Autónomo en AVD básicas con supervisión o asistencia puntual; movilidad limitada pero funcional; medicación supervisada por familiar o cuidador; alguna limitación sensorial o cognitiva leve compensada.", "Requiere asistencia para algunas AVD básicas (baño, vestimenta); higiene parcialmente dependiente; nutrición y medicación requieren supervisión activa; movilidad con riesgo de caídas frecuentes.", "Alta dependencia en la mayoría de las AVD básicas; higiene y alimentación requieren asistencia directa regular; escasa movilidad autónoma; múltiples comorbilidades activas sin buen control.", "Dependencia casi total; solo conserva participación mínima en alguna AVD simple; requiere cuidado continuo presente; alto riesgo de desnutrición, úlceras y otras complicaciones por inmovilidad.", "Dependencia total con movilidad mínima; completamente dependiente de cuidador para higiene, alimentación, medicación y movilización; cuidado domiciliario intensivo o institucionalización.", "Postrado o con movilidad nula; requiere cuidado paliativo o de enfermería continuo para todas las necesidades básicas; sin capacidad residual de autocuidado."]}}, "drive": {"s6_11": {"q": "¿El niño muestra ganas de jugar, explorar o aprender cosas nuevas en la escuela y en casa? ¿Inicia juegos con otros niños o prefiere quedarse solo sin hacer nada? ¿Sus maestros reportan que participa en clase o que se ve 'apagado' o sin energía?", "short": ["Curioso / juega", "Activo sostenido", "Interés conservado", "Juego pasivo", "Apatía lúdica", "Sin iniciativa lúdica", "Indiferencia total"], "anchors": ["Exploración activa, inicia juegos con pares, participa en clase y muestra curiosidad genuina por aprender.", "Energía e interés lúdico-escolar sostenidos; participa sin necesitar empuje constante del adulto.", "Motivación escolar y de juego conservada; altibajos normales según contexto o cansancio del día.", "Prefiere actividades pasivas; hay que empujarlo para que juegue o haga tareas; evita el esfuerzo.", "Apatía lúdica moderada; abandona juegos rápidamente; escasa curiosidad; participa solo si se le obliga.", "Casi sin iniciativa; permanece inactivo la mayor parte del tiempo; el juego ha desaparecido casi por completo.", "Indiferencia profunda; no juega, no explora, no responde a estímulos lúdicos ni escolares; abulia evidente."]}, "s12_15": {"q": "¿El adolescente tiene hobbies, intereses propios o proyectos en los que se involucre con ganas? ¿Muestra motivación en el colegio o en actividades con su grupo de pares? ¿Ha dejado de hacer cosas que antes le gustaban, como deporte, música o salir con amigos?", "short": ["Activo / proyectos", "Interés sostenido", "Motivación básica", "Pasivo / apático", "Anhedonia parcial", "Sin proyectos", "Avolición / anhedonia"], "anchors": ["Inicia proyectos propios, mantiene hobbies, busca activamente a sus pares y experimenta con su identidad.", "Energía e interés sostenidos en actividades escolares y sociales con pares; motivación autónoma.", "Motivación conservada aunque variable; altibajos dentro del rango esperable para la etapa.", "Iniciativa baja; se involucra solo si otros lo invitan; abandona actividades antes de terminarlas.", "Anhedonia parcial; ha dejado hobbies previos; escaso interés en pares; evita esfuerzo sostenido.", "Casi sin proyectos o intereses activos; aislamiento progresivo; no inicia ni mantiene actividades.", "Avolición y anhedonia marcadas; indiferencia ante pares, logros y actividades; retirada casi total."]}, "s16_18": {"q": "¿El joven muestra iniciativa para planear su futuro (carrera, trabajo, proyecto de vida) o hay que empujarlo constantemente? ¿Tiene metas propias que persiga con energía, incluso cuando aparecen obstáculos? ¿Ha perdido el interés en relaciones, actividades o planes que antes lo motivaban?", "short": ["Con metas / activo", "Energía sostenida", "Motivación presente", "Pasivo / reactivo", "Apatía ante futuro", "Sin metas propias", "Avolición / anhedonia"], "anchors": ["Planea su futuro con iniciativa propia, persigue metas académicas o vocacionales y afronta obstáculos.", "Energía e interés sostenidos; avanza en proyectos personales sin necesitar motivación externa constante.", "Motivación presente aunque irregular; puede necesitar apoyo puntual; altibajos dentro del rango normal.", "Reactivo más que proactivo; evita decisiones sobre el futuro; baja tolerancia al esfuerzo sostenido.", "Apatía ante el futuro; abandona planes; evita compromisos; interés reducido en relaciones y logros.", "Sin metas propias; inactividad predominante; no muestra interés en estudios, trabajo ni vínculos.", "Avolición profunda; indiferencia global ante el futuro, las relaciones y cualquier fuente de sentido."]}, "s19_25": {"q": "¿Cómo está tu energía para estudiar, trabajar o explorar lo que te interesa? ¿Tienes ganas de salir, conocer personas nuevas o probar cosas distintas?", "short": ["Explora activo", "Sostenido", "Conservado", "Retraído", "Apatía emergente", "Sin iniciativa", "Abulia / cierre"], "anchors": ["Explora activamente opciones de identidad, estudios, trabajo y relaciones; inicia proyectos y los sostiene con energía genuina", "Mantiene esfuerzo en metas propias aunque con fluctuaciones normales de la inestabilidad emergente; recupera impulso sin ayuda", "Funciona en sus roles (estudio, trabajo parcial) pero la exploración espontánea se reduce; sigue compromisos sin buscar nuevos", "Evita tomar iniciativas o explorar; prefiere rutinas conocidas; socialmente más pasivo pero todavía responde a estímulos externos", "Apatía moderada: no planifica, descuida estudio o trabajo, pierde interés en actividades que antes disfrutaba; no experimenta malestar claro por ello", "Anergia marcada: pasa largos períodos sin hacer nada productivo ni social; requiere presión externa para cumplir mínimos académicos o laborales", "Abulia completa y anhedonia: no estudia, no trabaja, no busca contacto; indiferente a su propio futuro y a oportunidades de la etapa"]}, "s26_44": {"q": "¿Cómo está su energía para cumplir con el trabajo, la familia y sus propias metas? ¿Siente motivación para seguir adelante con sus proyectos?", "short": ["Generativo activo", "Sostenido", "Conservado", "Limitado", "Apatía moderada", "Anergia", "Abulia / anhedonia"], "anchors": ["Sostiene con energía los roles de pareja, familia y carrera; genera proyectos nuevos, muestra iniciativa laboral y vitalidad en su vida cotidiana", "Cumple con sus roles centrales (trabajo, crianza, pareja) y mantiene algunos intereses propios; recupera energía con descanso normal", "Cumple obligaciones laborales y familiares pero sin iniciativa extra; abandona hobbies o metas personales; funciona en piloto automático", "Dificultad para sostener más de un rol a la vez; posterga tareas no urgentes; socialmente más retraído, menor afecto positivo", "Apatía evidente: cumple lo mínimo laboral o familiar solo por presión externa; pierde interés en pareja, crianza o proyectos que antes lo motivaban", "Anergia significativa: no puede mantener rendimiento laboral ni participación familiar; requiere apoyo continuo para funciones básicas del rol", "Abulia y anhedonia: indiferente a trabajo, familia y relaciones; no experimenta placer ni anticipa ninguna actividad; abandono funcional completo"]}, "s45_64": {"q": "¿Cómo está su energía para el trabajo y sus responsabilidades actuales? ¿Sigue encontrando sentido o motivación en lo que hace día a día?", "short": ["Generativo pleno", "Sostenido", "Conservado", "Limitado", "Apatía moderada", "Anergia", "Abulia / anhedonia"], "anchors": ["En el pico de su generatividad: lidera, mentoriza o crea con energía sostenida; gestiona responsabilidades laborales, familiares y comunitarias con iniciativa", "Mantiene rendimiento en su rol principal (laboral, familiar) aunque con mayor conciencia del cansancio; recupera con descanso; intereses activos", "Cumple sus responsabilidades centrales pero reduce actividades opcionales; menor curiosidad o expansión; funciona sin entusiasmo evidente", "Dificultad para sostener el ritmo habitual; postergación frecuente; empieza a retirarse de compromisos secundarios; menor afecto positivo en el trabajo", "Apatía moderada: pérdida de sentido en el trabajo o la familia; no planifica la etapa post-laboral; no disfruta logros; distanciamiento afectivo", "Anergia marcada: no puede sostener jornada laboral ni tareas domésticas; deja de lado obligaciones antes prioritarias; requiere apoyo externo para funcionar", "Abulia y anhedonia severas: abandono de rol laboral y familiar; indiferencia total ante el futuro; no anticipa ni disfruta ninguna actividad"]}, "s65_74": {"q": "¿Cómo está su energía desde que se jubiló? ¿Tiene actividades, proyectos o intereses que le den sentido a su semana?", "short": ["Activo / propósito", "Sostenido", "Conservado", "Retraído", "Apatía moderada", "Anergia", "Abulia / anhedonia"], "anchors": ["Reorganiza su vida post-laboral con propósito: voluntariado, nuevos proyectos, red social activa, viajes o aprendizaje; alta autonomía y vitalidad", "Mantiene rutinas significativas y relaciones; adapta bien su energía a la jubilación; activo aunque con ritmo algo menor que antes", "Mantiene sus rutinas sociales conocidas (visitas familiares, grupos habituales) pero no las amplía ni genera actividades nuevas; disfruta de lo cotidiano aunque sin entusiasmo; no busca cambios pero sostiene lo existente sin apoyo externo", "Progresivamente retraído: reduce salidas, visitas y actividades; días sin propósito claro; pasivo frente a oportunidades de participación", "Apatía moderada: pasa la mayor parte del día inactivo; no genera planes; pierde interés en actividades que antes disfrutaba tras la jubilación", "Anergia significativa: apenas sale de casa; necesita que familiares lo activen para lo básico; sin interés en nada, incluidas actividades de bienestar", "Abulia y anhedonia: rechaza cualquier actividad o contacto social; indiferente a familiares, entorno y al propio deterioro; el abandono del rol post-jubilatorio es total, sin angustia ni conciencia de pérdida"]}, "s75_84": {"q": "¿Qué actividades hace durante el día? ¿Tiene ganas de hacer cosas o siente que ya no le interesa como antes?", "short": ["Activo / adaptado", "Sostenido", "Conservado", "Limitado", "Apatía moderada", "Anergia", "Abulia / anhedonia"], "anchors": ["Mantiene actividad física y mental adaptada a su capacidad; conserva intereses, lazos afectivos y participación aunque con menor intensidad que antes", "Sostiene rutinas significativas y contacto social; acepta limitaciones físicas sin perder motivación; energía suficiente para actividades valoradas", "Participa en actividades estructuradas por el entorno (rutinas domésticas, visitas programadas) pero no toma iniciativas propias; el placer es reactivo y depende del estímulo del cuidador o familiar; acepta lo que se le ofrece sin buscar nada", "Retraído: reduce actividades y contactos; pasa más tiempo en reposo; responde a estímulos externos pero no los busca; menor afecto positivo", "Apatía moderada: días sin levantarse de la silla o cama; no muestra interés por visitas, noticias ni actividades antes valoradas; cuidadores reportan cambio", "Anergia marcada: necesita motivación continua para ABVD (alimentarse, asearse); no participa en nada voluntariamente; retiro social casi completo", "Abulia y anhedonia severas: no responde a cuidados, alimentación ni estimulación; indiferente al dolor, al malestar físico y a familiares cercanos; requiere cuidado total sin ninguna participación activa propia"]}, "s85": {"q": "¿Qué cosas le interesan o disfruta todavía? ¿Tiene ganas de estar con familiares o hacer alguna actividad, aunque sea pequeña?", "short": ["Activo / vital", "Sostenido", "Conservado", "Limitado", "Apatía leve-mod", "Anergia", "Abulia / anhedonia"], "anchors": ["A pesar de la fragilidad conserva interés genuino en relaciones, conversación o actividades adaptadas; expresa deseos y toma pequeñas iniciativas", "Mantiene interés en actividades accesibles (lectura, familia, radio, pequeñas tareas); acepta ayuda sin pérdida de iniciativa en lo que puede hacer", "Participa en actividades cuando se le proponen; disfruta parcialmente; no inicia por sí mismo pero responde bien al estímulo del cuidador o la familia", "Pasivo: requiere invitación constante; responde con indiferencia o brevemente; pasa largas horas sin interacción ni actividad de ningún tipo", "Apatía moderada: no responde a estímulos sociales habituales; cuidadores reportan que 'ya no quiere nada'; no expresa preferencias ni deseos", "Anergia severa: indiferente a todo contacto; no colabora en el cuidado básico; sin respuesta emocional observable ante familiares o eventos significativos", "Abulia y anhedonia completas: ausencia total de iniciativa, interés o respuesta afectiva; indiferente a entorno, cuidado y personas; retiro vital extremo"]}}, "cognicion": {"s6_11": {"q": "¿Puede el niño seguir instrucciones de varios pasos en casa o en el colegio sin perderse? ¿Cómo le va para recordar lo que aprende de un día para otro? ¿Le cuesta mantenerse en una actividad o juego sin distraerse antes de terminar?", "short": ["Pleno", "Sólido", "Fallos leves", "Compensable", "Déficit funcional", "Apoyado", "Severo"], "anchors": ["Atención sostenida, memoria de trabajo y aprendizaje escolar plenos para la edad; sigue instrucciones multi-paso sin dificultad.", "Funcionamiento cognitivo sólido; puede haber fallas mínimas sin impacto en rendimiento escolar ni en el juego.", "Distracciones ocasionales o olvidos que el niño autorregula con mínimos recordatorios del adulto; el rendimiento en el aula se mantiene dentro del rango esperado.", "Fallos notorios de atención o memoria de trabajo que requieren repetición sistemática de instrucciones y ajustes activos del docente para sostener el aprendizaje.", "Déficit claro en atención, memoria o aprendizaje que impacta el progreso escolar y el juego simbólico/reglado; necesita apoyo estructurado.", "Déficit amplio en múltiples dominios cognitivos; depende de adaptaciones curriculares intensivas o acompañante escolar.", "Deterioro cognitivo severo para la etapa; no puede sostener aprendizaje formal ni participar en actividades lúdicas sin supervisión constante."]}, "s12_15": {"q": "¿Puede el adolescente organizar sus tareas y tiempos de estudio por cuenta propia, o necesita que alguien lo dirija? ¿Tiene dificultad para concentrarse cuando estudia o conversa con sus pares? ¿Ha notado cambios en su memoria o en cómo razona para resolver problemas?", "short": ["Pleno", "Sólido", "Fallos leves", "Compensable", "Déficit funcional", "Apoyado", "Severo"], "anchors": ["Funciones ejecutivas, memoria y razonamiento abstracto plenamente operativos; planifica y autorregula el estudio sin apoyo externo.", "Funcionamiento cognitivo sólido; los fallos son esporádicos y no afectan el desempeño académico ni la interacción con pares.", "Dificultades leves de concentración o de organización, manejadas por el propio adolescente con mínima orientación del adulto.", "Fallos notorios en planificación, memoria de trabajo o flexibilidad cognitiva; requiere recordatorios frecuentes y estructura externa para rendir.", "Déficit claro en ≥1 dominio (atención, memoria, razonamiento) que afecta el rendimiento escolar y la calidad de la comunicación con pares.", "Déficit amplio en funciones ejecutivas y/o memoria; necesita apoyo regular del adulto para tareas cognitivas básicas del contexto escolar y social.", "Deterioro cognitivo severo; incapaz de seguir el ritmo escolar o sostener conversaciones coherentes sin supervisión intensiva."]}, "s16_18": {"q": "¿Puede el joven planificar y ejecutar proyectos propios (académicos, laborales o personales) sin que alguien los supervise? ¿Cómo resuelve problemas nuevos o toma decisiones bajo presión? ¿Ha tenido quejas de memoria, concentración o dificultad para expresarse con claridad?", "short": ["Pleno", "Sólido", "Fallos leves", "Compensable", "Déficit funcional", "Apoyado", "Severo"], "anchors": ["Razonamiento abstracto, planificación ejecutiva, memoria prospectiva y comunicación plenos; gestiona demandas académicas y personales de forma autónoma.", "Funcionamiento cognitivo sólido con fallas mínimas; los errores no comprometen metas académicas ni las relaciones significativas.", "Fallos ocasionales de concentración o memoria que el joven corrige con estrategias propias; rendimiento global preservado.", "Dificultades cognitivas notorias (atención, planificación, memoria) que exigen ajustes externos o compensaciones activas para mantener el funcionamiento.", "Déficit claro en ≥1 dominio ejecutivo o mnésico que limita la autonomía académica, laboral incipiente o la toma de decisiones personales.", "Déficit amplio; requiere apoyo sistemático de adultos para organizar el estudio, sostener un trabajo simple o comunicarse con eficacia.", "Deterioro cognitivo severo; dependencia casi total para tareas cognitivas cotidianas; comunicación funcional comprometida."]}, "s19_25": {"q": "¿Puedes seguir una clase larga, leer un texto difícil o concentrarte en una tarea cuando hay distracciones? ¿Cuánto te cuesta recordar cosas que estudiaste o que alguien te explicó? ¿Cómo te va resolviendo problemas nuevos, como trámites, decisiones de trabajo o conflictos que no habías enfrentado antes?", "short": ["Ágil y fluido", "Sólido y eficaz", "Fallas por sobrecarga", "Compensa con esfuerzo", "Déficit focal", "Déficit amplio", "Deterioro severo"], "anchors": ["Atención sostenida, memoria de trabajo y razonamiento fluido funcionan a pleno; aprende rápido en contextos nuevos como universidad, trabajo inicial o vida independiente", "Rinde bien en la mayoría de contextos cognitivos aunque con variaciones; capaz de aprender y adaptarse a roles nuevos sin dificultad significativa", "Fallas de concentración o memoria episódica visibles en períodos de alta demanda (exámenes, varios trabajos, estrés de transición); recupera con descanso", "Rinde por debajo de su potencial en varios contextos; requiere recordatorios, listas o apoyos para mantenerse funcional en tareas cotidianas y académico-laborales", "Déficit claro en un dominio —atención, memoria o resolución de problemas— que afecta el desempeño en al menos un área de vida central (estudio, trabajo, relaciones)", "Déficit en múltiples dominios cognitivos que limita gravemente la capacidad de sostener estudio, empleo o vida independiente incipiente", "Deterioro cognitivo severo incompatible con autonomía básica; requiere supervisión para funcionamiento cotidiano"]}, "s26_44": {"q": "¿Puedes manejar simultáneamente las demandas de trabajo, familia y vida cotidiana sin perder el hilo de tareas importantes? ¿Has notado que olvidas compromisos, pierdes concentración en reuniones o te cuesta más que antes aprender cosas nuevas en tu trabajo? ¿Cómo resuelves problemas complejos que aparecen en tu vida laboral o familiar?", "short": ["Pleno y sostenido", "Sólido con ritmo", "Fallas por multitarea", "Compensable", "Déficit funcional", "Déficit amplio", "Deterioro severo"], "anchors": ["Gestiona eficientemente múltiples demandas cognitivas (trabajo, familia, decisiones financieras) sin deterioro; planifica, recuerda y resuelve problemas de forma fluida", "Desempeño cognitivo sólido en la mayoría de dominios; puede sostener responsabilidades laborales y familiares aunque con necesidad de organización activa", "Errores de memoria o atención en períodos de alta carga (crianza intensa, proyecto laboral exigente, cambio de rol); no afecta funcionamiento global de forma sostenida", "Necesita estrategias compensatorias frecuentes —agendas, alarmas, delegación— para sostener sus roles; rinde por debajo de su capacidad previa", "Déficit observable en un dominio cognitivo que compromete el desempeño en trabajo o vida familiar; notado por el entorno o por él mismo de forma consistente", "Déficit en varios dominios que impide sostener simultáneamente el rol laboral y la crianza activa; delega decisiones cotidianas importantes en pareja o familia de origen", "Deterioro cognitivo severo que interrumpe la trayectoria laboral y parental en sus años de mayor demanda productiva; requiere supervisión para tareas domésticas y laborales básicas"]}, "s45_64": {"q": "¿Ha notado cambios en su memoria, concentración o agilidad mental comparando con cómo era hace 10 años? ¿Le cuesta más aprender tecnologías o procedimientos nuevos en su trabajo, o recordar cosas que antes le salían automáticas? ¿Cómo maneja las decisiones complejas que vienen con su etapa (hijos adultos, padres mayores, planificación de retiro)?", "short": ["Pleno y experto", "Sólido y experimentado", "Declive leve subjetivo", "Compensado por experiencia", "Déficit en dominio", "Déficit amplio", "Deterioro severo"], "anchors": ["Velocidad de procesamiento y memoria integradas con experiencia acumulada; resolución de problemas experta, especialmente en dominios consolidados; sin queja cognitiva", "Rendimiento cognitivo sólido con posible enlentecimiento leve; la inteligencia cristalizada compensa eficientemente cualquier declive en fluida", "Queja subjetiva de memoria o atención sin impacto funcional objetivo; enlentecimiento en tareas nuevas o muy demandantes que él mismo nota pero el entorno no reporta", "Declive en velocidad o memoria episódica que requiere compensación activa (notas, rutinas, apoyo digital); mantiene rol laboral y familiar con esfuerzo adicional", "Déficit en un dominio (memoria, atención o función ejecutiva) con impacto funcional claro en trabajo, gestión del hogar o decisiones familiares complejas", "Déficit en varios dominios que compromete el desempeño como referente familiar (generación sándwich) y la planificación de la transición al retiro; requiere apoyo externo para decisiones económicas y médicas", "Deterioro cognitivo severo que impide la función de adulto mayor productivo antes de la jubilación; requiere supervisión para gestión financiera, laboral y del hogar"]}, "s65_74": {"q": "¿Cómo está su memoria para cosas recientes, como conversaciones, nombres o lo que tenía que hacer? ¿Le cuesta aprender a usar aparatos nuevos, navegar en internet o seguir instrucciones que antes le habrían resultado fáciles? ¿Puede planificar y organizar actividades como viajes, compromisos familiares o actividades de voluntariado sin ayuda?", "short": ["Pleno y activo", "Sólido y funcional", "Declive leve compensado", "Compensa con estrategia", "Déficit en dominio", "Déficit amplio", "Deterioro severo"], "anchors": ["Función cognitiva preservada; participa activamente en actividades intelectuales, sociales y organizativas sin dificultad; aprendizaje de nuevos roles post-jubilación fluido", "Rendimiento cognitivo adecuado para actividades cotidianas y roles de la jubilación; enlentecimiento leve sin impacto funcional real", "Declive notado en memoria episódica reciente o aprendizaje de tecnología nueva; compensado espontáneamente sin ayuda de terceros; sin impacto en autonomía", "Requiere estrategias activas (listas, rutinas fijas, apoyo familiar puntual) para mantener el funcionamiento en actividades cotidianas y sociales", "Déficit claro en memoria, atención u orientación que limita la participación en actividades importantes para el rol post-jubilatorio (voluntariado, gestión, cuidado)", "Déficit cognitivo amplio que compromete la autonomía en actividades instrumentales de la vida diaria; depende de supervisión parcial", "Deterioro cognitivo severo con pérdida de autonomía básica; requiere cuidado continuo para actividades esenciales"]}, "s75_84": {"q": "¿Puede recordar con quién habló ayer, qué comió o qué tenía planeado hacer hoy? ¿Tiene dificultades para seguir conversaciones largas, encontrar la palabra que quiere decir o entender instrucciones de médicos u otros? ¿Alguien de su familia o cercano ha notado cambios en su memoria o en cómo toma decisiones?", "short": ["Preservado", "Leve declive", "Queja con impacto", "Compensa con ayuda", "Déficit moderado", "Déficit severo", "Deterioro severo"], "anchors": ["Función cognitiva preservada para la edad; memoria, lenguaje y orientación intactos; participa en decisiones propias y mantiene roles significativos con plena autonomía", "Declive leve en velocidad o memoria episódica consistente con envejecimiento normal; no afecta la autonomía ni la participación en actividades cotidianas", "Olvidos frecuentes o dificultades de palabra con impacto funcional leve pero real; requiere apoyos ambientales (rutinas, recordatorios) para compensar", "Déficit en memoria o función ejecutiva que requiere ayuda regular de familiares o cuidadores para actividades instrumentales (medicación, citas, finanzas básicas)", "Déficit cognitivo moderado en memoria reciente, orientación o lenguaje que limita claramente la autonomía; dependencia parcial en varias áreas de la vida diaria", "Déficit cognitivo severo en múltiples dominios; comprensión, memoria y orientación gravemente comprometidas; dependencia en casi todas las actividades", "Deterioro cognitivo muy severo con pérdida de reconocimiento de personas cercanas, desorientación completa y dependencia total en cuidado"]}, "s85": {"q": "¿Reconoce a las personas que lo cuidan o que vienen a visitarlo? ¿Puede hacer saber lo que necesita o cómo se siente, aunque sea con pocas palabras? ¿Sabe en qué lugar está y qué día o época del año es, aunque sea de forma aproximada?", "short": ["Preservado", "Funcional básico", "Leve-moderado", "Moderado con ayuda", "Severo", "Muy severo", "Ausente"], "anchors": ["Función cognitiva sorprendentemente preservada; reconoce personas, se orienta y comunica con claridad; participa activamente en decisiones sobre su propio cuidado", "Cognición funcional para lo cotidiano; memoria e identidad personal intactas aunque con enlentecimiento; puede expresar preferencias y necesidades sin dificultad", "Déficit leve a moderado en memoria reciente u orientación temporal; reconoce personas cercanas; comunica necesidades básicas con apoyo y ambiente estructurado", "Déficit moderado que requiere supervisión constante para seguridad y cuidado; comunicación preservada para necesidades básicas aunque con dificultades de expresión", "Déficit severo en orientación, reconocimiento y comunicación; dificultad para identificar personas conocidas; dependencia total en cuidado supervisado", "Cognición muy gravemente deteriorada; respuesta mínima al entorno; comunicación no verbal residual; requiere cuidado integral en todas las funciones", "Sin respuesta cognitiva funcional observable; estado de mínima conciencia o ausencia de interacción con el entorno; cuidado paliativo total"]}}};

function applicOf(axis, stageId){ return axis.applic[STAGE_IDS.indexOf(stageId)]; }
// Contenido por etapa: usa override developmental si existe (axis.byStage), si no cae al genérico del eje.
function cellContent(axis, stageId){
  const bs = axis.byStage && axis.byStage[stageId];
  return { q:(bs&&bs.q)||axis.q, short:(bs&&bs.short)||axis.short, anchors:(bs&&bs.anchors)||axis.anchors };
}

/* ── STATE (localStorage 'expfx_state_v5') ──
   v5: cada celda eje×etapa puede llevar points[] = sub-scorings con edad fina.
   Resuelve la baja resolución intra-etapa de las franjas anchas (p.ej. 26–44:
   peak ~27 / colapso ~34 / recuperación ~43 dejan de colapsar en una sola celda).
   cell.score sigue siendo el resumen/baseline (retrocompatible con v4). */
const STORAGE_KEY = 'expfx_state_v5';
const STORAGE_KEY_LEGACY = 'expfx_state_v4';
function cellKey(stageId, axisId){ return stageId + '::' + axisId; }
function defaultNarrative(){ return { chapters:[], coherence:null, pattern:null, synthesis:'' }; }
function narr(){ if(!state.narrative) state.narrative = defaultNarrative(); return state.narrative; }
function defaultState(){
  const s = { cells:{}, exposure:null, age:null, narrative: defaultNarrative(), _ts: Date.now() };
  STAGES.forEach(st => AXES.forEach(ax => {
    if (applicOf(ax, st.id) !== 'na') s.cells[cellKey(st.id, ax.id)] = { score:null, note:'', points:[] };
  }));
  return s;
}
function migrate(p){
  if (!p || !p.cells) return p;
  Object.keys(p.cells).forEach(k => { const c = p.cells[k]; if (c && !Array.isArray(c.points)) c.points = []; });
  return p;
}
function loadState(){
  try { const saved = localStorage.getItem(STORAGE_KEY); if (saved) { const p = JSON.parse(saved); if (p && p.cells) return migrate(p); } }
  catch(e){}
  try { const old = localStorage.getItem(STORAGE_KEY_LEGACY); if (old) { const p = JSON.parse(old); if (p && p.cells) return migrate(p); } }
  catch(e){}
  return defaultState();
}
function saveState(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){} }
let state = loadState();
let activeView = 'score';
let activeStageTab = null; // etapa-pestaña activa en el Score view (cada etapa es su propia pestaña)
const openCells = new Set(); // celdas con el desglose por edad abierto (transitorio, sobrevive re-render)
function cell(stageId, axisId){
  const k = cellKey(stageId, axisId);
  if (!state.cells[k]) state.cells[k] = { score:null, note:'', points:[] };
  if (!Array.isArray(state.cells[k].points)) state.cells[k].points = [];
  return state.cells[k];
}

/* ══════════════════════════════════════════════════════════════
   SUB-PUNTOS POR EDAD (resolución intra-etapa) + SERIE FUNCIONAL POR EDAD
   ══════════════════════════════════════════════════════════════ */
function cellPoints(stageId, axisId){ return cell(stageId, axisId).points || []; }
function toggleCellPoints(k){ if (openCells.has(k)) openCells.delete(k); else openCells.add(k); renderScoreView(); }
function addCellPoint(stageId, axisId){
  const c = cell(stageId, axisId);
  const st = STAGES.find(s => s.id===stageId);
  let suggest = '';
  if (st){ const hi = st.hi>120 ? (st.lo+10) : st.hi; suggest = Math.round((st.lo+hi)/2); if (stageId===currentStageId() && state.age!=null) suggest = +state.age; }
  c.points.push({ age: suggest, score: (c.score!=null && c.score!=='NE' ? c.score : null), note:'' });
  openCells.add(cellKey(stageId, axisId));
  saveState(); renderScoreView();
}
function delCellPoint(stageId, axisId, i){ const c = cell(stageId, axisId); c.points.splice(i,1); saveState(); renderScoreView(); }
function setCellPointAge(stageId, axisId, i, v){ const c = cell(stageId, axisId); if (c.points[i]) c.points[i].age = (v===''?'':parseInt(v,10)); saveState(); }
function setCellPointNote(stageId, axisId, i, v){ const c = cell(stageId, axisId); if (c.points[i]) c.points[i].note = v; saveState(); }
function setCellPointScore(stageId, axisId, i, val, btn){
  const c = cell(stageId, axisId); if (!c.points[i]) return; c.points[i].score = val;
  const wrap = btn.closest('.cpoint-scores'); if (wrap){ wrap.querySelectorAll('.s-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); }
  saveState();
}
function cellPointCount(stageId, axisId){ return (cell(stageId, axisId).points||[]).filter(p=>p && p.score!=null && p.score!=='NE' && p.age!=null && p.age!=='').length; }
// Edad representativa de una etapa cuando no hay sub-puntos (1 punto por etapa).
function stageRepAge(st){
  if (!st) return null;
  if (st.id===currentStageId() && state.age!=null) return +state.age;
  if (st.hi>120) return st.lo;
  return Math.round((st.lo+st.hi)/2);
}
// Serie funcional de un eje ordenada por EDAD: usa sub-puntos si existen, si no el baseline de la etapa.
function axisPoints(axisId){
  const ax = AXIS_BY_ID[axisId];
  const out = [];
  activeStages().forEach(st => {
    if (applicOf(ax, st.id)==='na') return;
    const c = cell(st.id, ax.id);
    const pts = (c.points||[]).filter(p => p && p.score!=null && p.score!=='NE' && p.age!=null && p.age!=='' && !isNaN(+p.age) && !isNaN(parseInt(p.score,10)));
    if (pts.length){
      pts.forEach(p => out.push({ age:+p.age, score:parseInt(p.score,10), stageId:st.id, label:st.label, note:p.note||'', source:'point' }));
    } else if (c.score!=null && c.score!=='NE'){
      const n = parseInt(c.score,10);
      if (!isNaN(n)) out.push({ age:stageRepAge(st), score:n, stageId:st.id, label:st.label, note:c.note||'', source:'stage' });
    }
  });
  return out.filter(p => p.age!=null && !isNaN(p.age)).sort((a,b)=> a.age-b.age);
}
// Dominio de edad compartido (alinea small-multiples + timeline integrada).
function ageDomain(){
  // El dominio arranca donde EMPIEZAN los datos (sub-puntos, baselines o capítulos),
  // no en la primera etapa activa: así un caso 0–5 arranca en la infancia y uno que
  // empieza a los 9 no deja margen vacío. Siempre incluye la edad actual ("hoy").
  let lo=null, hi=null;
  AXES.forEach(ax => axisPoints(ax.id).forEach(p => { if(lo==null||p.age<lo) lo=p.age; if(hi==null||p.age>hi) hi=p.age; }));
  narr().chapters.forEach(ch => { const a=chapAge(ch); if(a!=null){ if(lo==null||a<lo) lo=a; if(hi==null||a>hi) hi=a; } });
  const active = activeStages();
  if (lo==null) lo = active.length ? active[0].lo : 6;
  if (hi==null) hi = state.age!=null ? +state.age : (active.length ? Math.min(active[active.length-1].hi,95) : 80);
  if (state.age!=null && +state.age>hi) hi = +state.age;
  if (hi<=lo) hi = lo+1;
  return [lo, hi];
}

/* ══════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════ */
function escapeAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function scoreNum(stageId, axisId){ const v = cell(stageId, axisId).score; if (v===null||v===undefined||v==='NE') return null; const n = parseInt(v,10); return Number.isNaN(n)?null:n; }
function isCellScored(stageId, axisId){ const v = cell(stageId, axisId).score; return v!==null && v!==undefined; }
function applicableCells(){ const out=[]; activeStages().forEach(st => AXES.forEach(ax => { if (applicOf(ax, st.id)!=='na') out.push({stageId:st.id, axisId:ax.id}); })); return out; }

/* ══════════════════════════════════════════════════════════════
   SCORE VIEW — secciones = etapas de vida (flujo cronológico)
   ══════════════════════════════════════════════════════════════ */
function renderButtonGroup(axis, stageId){
  const cur = cell(stageId, axis.id).score;
  const content = cellContent(axis, stageId);
  let html = '';
  for (let k=0; k<=6; k++){
    const sel = (cur!==null && String(cur)===String(k)) ? 'selected' : '';
    const tip = k + ' · ' + SEVERITY[k] + ' — ' + (content.anchors[k] || '');
    html += `<button class="s-btn ${sel}" data-val="${k}" title="${escapeAttr(tip)}" onclick="setScore('${stageId}','${axis.id}','${k}',this)"><span class="num">${k}</span><span class="lbl">${content.short[k]}</span></button>`;
  }
  const neSel = cur==='NE' ? 'selected' : '';
  html += `<button class="s-btn ne-btn ${neSel}" data-val="NE" onclick="setScore('${stageId}','${axis.id}','NE',this)" title="No evaluable / sin datos"><span class="num">NE</span></button>`;
  return html;
}
function renderCellPointButtons(stageId, axisId, i){
  const p = (cell(stageId, axisId).points||[])[i] || {};
  const content = cellContent(AXIS_BY_ID[axisId], stageId);
  let html = '';
  for (let k=0; k<=6; k++){
    const sel = (p.score!=null && String(p.score)===String(k)) ? 'selected' : '';
    const tip = k + ' · ' + SEVERITY[k] + ' — ' + (content.anchors[k] || '');
    html += `<button class="s-btn ${sel}" data-val="${k}" title="${escapeAttr(tip)}" onclick="setCellPointScore('${stageId}','${axisId}',${i},'${k}',this)"><span class="num">${k}</span><span class="lbl">${content.short[k]}</span></button>`;
  }
  return html;
}
function renderCellPoints(stageId, axisId){
  const pts = cell(stageId, axisId).points || [];
  let h = `<div class="cpoints"><div class="cp-hint">Desglose intra-etapa: un punto por edad con su propio score. Útil cuando dentro de la misma franja hubo pico, colapso y recuperación — la trayectoria los grafica por edad real. Si el desglose queda vacío, se usa el score-resumen de arriba.</div>`;
  pts.forEach((p,i)=>{
    h += `<div class="cpoint">
      <span class="cp-age-lbl">edad</span>
      <input type="number" class="cp-age" min="0" max="120" placeholder="años" value="${p.age!=null?p.age:''}" onchange="setCellPointAge('${stageId}','${axisId}',${i},this.value)">
      <div class="cpoint-scores">${renderCellPointButtons(stageId, axisId, i)}</div>
      <input type="text" class="cp-note" placeholder="momento / evidencia…" value="${escapeAttr(p.note||'')}" oninput="setCellPointNote('${stageId}','${axisId}',${i},this.value)">
      <button class="cp-del" onclick="delCellPoint('${stageId}','${axisId}',${i})" title="Eliminar punto">×</button>
    </div>`;
  });
  h += `<button class="cpoint-add" onclick="addCellPoint('${stageId}','${axisId}')">+ punto por edad</button>`;
  h += `</div>`;
  return h;
}
function renderCellRow(stageId, axis){
  const ap = applicOf(axis, stageId);
  const c = cell(stageId, axis.id);
  const cpc = cellPointCount(stageId, axis.id);
  const scoredCls = ((c.score!==null && c.score!==undefined) || cpc>0) ? 'scored' : '';
  const hasPtsCls = cpc>0 ? 'has-points' : '';
  const partial = ap==='partial' ? ` <span class="partial-tag">~ anclas adaptadas</span>` : '';
  const k = cellKey(stageId, axis.id);
  const open = openCells.has(k);
  return `<div class="cell-row ${scoredCls} ${hasPtsCls}" id="row_${stageId}__${axis.id}">
    <div class="cell-head"><span class="code">Eje ${axis.code}</span><span class="title">${axis.title}</span>${partial}</div>
    <div class="cell-q">${cellContent(axis, stageId).q}</div>
    <div class="cell-scores">${renderButtonGroup(axis, stageId)}</div>
    <div class="cell-note"><input type="text" placeholder="evidencia / nota textual…" value="${escapeAttr(c.note||'')}" oninput="setNote('${stageId}','${axis.id}',this.value)"></div>
    <button class="cpoint-toggle ${cpc>0?'has':''}" onclick="toggleCellPoints('${k}')">${open?'▾':'▸'} desglosar por edad${cpc>0?` <span class="cp-count">${cpc}</span>`:''}</button>
    ${open ? renderCellPoints(stageId, axis.id) : ''}
  </div>`;
}
function stageCounts(stageId){
  let items=0, sc=0;
  AXES.forEach(ax => { if (applicOf(ax, stageId)!=='na'){ items++; if (isCellScored(stageId, ax.id)) sc++; } });
  return { items, sc };
}
function renderScoreView(){
  const c = document.getElementById('scoreView');
  const curId = currentStageId();
  const active = activeStages();
  const curStage = STAGES.find(s => s.id===curId);
  const ageMsg = curStage ? `Etapa actual: <b>${curStage.label} · ${curStage.age}</b>` : 'Ingresa la edad para activar las etapas vividas';
  let html = `<div class="age-bar">
    <label for="ageInput">Edad del paciente</label>
    <input type="number" id="ageInput" min="0" max="120" placeholder="años" value="${state.age!=null?state.age:''}" onchange="setAge(this.value)">
    <span class="age-stage">${ageMsg}</span>
  </div>`;

  if (!active.length){
    html += `<div class="empty-prompt">Ingresa la edad del paciente arriba.<br><span>Se activan solo las etapas de vida ya vividas; la última (la que contiene su edad) es el funcionamiento <b>actual</b>, las previas son la trayectoria retrospectiva.</span></div>`;
    c.innerHTML = html;
    updateProgress();
    return;
  }

  // Cada etapa es su PROPIA pestaña: las chips conmutan la etapa visible (no scroll).
  let tabId = activeStageTab;
  if (!tabId || !active.find(s => s.id===tabId)) tabId = curId || active[active.length-1].id;
  const tabStage = active.find(s => s.id===tabId) || active[active.length-1];

  let nav = '<nav class="section-nav" id="sectionNav">';
  active.forEach(st => {
    const { items, sc } = stageCounts(st.id);
    const complete = (sc===items && items>0) ? 'complete' : '';
    const activeCls = st.id===tabStage.id ? 'active' : '';
    const cur = st.id===curId ? ' · actual' : '';
    nav += `<button class="nav-chip ${complete} ${activeCls}" data-stage="${st.id}" onclick="setStageTab('${st.id}')">${st.label}${cur}<span class="nav-count">${sc}/${items}</span></button>`;
  });
  nav += `<button class="nav-sweep" id="sweepBtn" onclick="sweepDefaults()" title="Marca todas las celdas aplicables no puntuadas como 0 (óptimo).">Marcar óptimos</button>`;
  nav += `<button class="nav-sweep" onclick="exportClinical()" style="background:var(--teal)" title="Descargar un resumen clínico legible (HTML imprimible)">Resumen clínico</button>`;
  nav += `<button class="nav-sweep" onclick="exportJSON()" style="background:var(--surface);color:var(--text-muted);border:1px solid var(--border)" title="Descargar el estado completo como JSON">JSON</button>`;
  nav += `<button class="nav-sweep" onclick="resetAll()" title="Limpiar toda la evaluación" style="background:var(--red-soft);color:var(--red);border:1px solid rgba(193,18,31,0.2)">↺ Limpiar</button>`;
  nav += demoPickerHTML();
  nav += `<span class="nav-help">0 = mejor · 6 = peor</span>`;
  nav += '</nav>';
  html += nav;
  html += `<p class="stage-note">El periodo <b>0–5</b> es la primera infancia: sus <b>hitos del neurodesarrollo</b> se puntúan en los mismos 7 ejes (cognición = lenguaje/hitos, social = apego/juego, autonomía = hitos motores, autocuidado = regulación/sueño, drive = exploración) y se enganchan con toda la trayectoria. Cada etapa es una <b>pestaña</b>; la <b>última</b> (la que contiene la edad) es el funcionamiento <b>actual</b>.</p>`;
  // Solo la etapa de la pestaña activa
  const st = tabStage;
  const { items, sc } = stageCounts(st.id);
  const complete = (sc===items && items>0) ? 'sec-complete' : '';
  const curBadge = st.id===curId ? ` <span class="actual-badge">actual</span>` : '';
  html += `<div class="section-head ${complete}" id="sec_${st.id}"><span><span>${st.label}</span><span class="stage-age">· ${st.age}</span>${curBadge}</span><span class="count">${sc}/${items}</span></div>`;
  let any = false;
  AXES.forEach(ax => { if (applicOf(ax, st.id)!=='na'){ html += renderCellRow(st.id, ax); any = true; } });
  if (!any) html += `<div class="stage-note">En esta etapa no aplican ejes evaluables.</div>`;
  c.innerHTML = html;
  updateProgress();
}
function setStageTab(id){ activeStageTab = id; renderScoreView(); window.scrollTo(0,0); }
function setScore(stageId, axisId, val, btn){
  cell(stageId, axisId).score = val;
  const row = btn.closest('.cell-row');
  row.querySelectorAll('.cell-scores .s-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  row.classList.add('scored');
  saveState();
  updateProgress();
}
function setNote(stageId, axisId, val){ cell(stageId, axisId).note = val; saveState(); }
function setAge(v){ state.age = (v==='' || v===null) ? null : (parseInt(v,10) || null); saveState(); renderScoreView(); }

function sweepDefaults(){
  let touched = 0;
  applicableCells().forEach(({stageId, axisId}) => {
    const c = cell(stageId, axisId);
    if (c.score===null || c.score===undefined){ c.score = '0'; touched++; }
  });
  if (touched>0){ saveState(); renderScoreView(); }
}
function resetAll(){
  if (!confirm('¿Limpiar toda la evaluación y empezar de nuevo?')) return;
  state = defaultState(); saveState(); renderScoreView();
  if (document.body.classList.contains('profile-mode')) showView('score');
}

function loadDemoByKey(key){

  const s = defaultState();
  s.age = d.age!=null ? d.age : null;
  s.exposure = d.exposure!==undefined ? d.exposure : null;
  s.narrative = d.narrative ? JSON.parse(JSON.stringify(d.narrative)) : defaultNarrative();
  if (d.cells) Object.keys(d.cells).forEach(k => { s.cells[k] = JSON.parse(JSON.stringify(d.cells[k])); });
  migrate(s); state = s; saveState(); openCells.clear(); activeStageTab = null; renderScoreView(); window.scrollTo(0,0);
}

// Lectura del cruce exposómico (output funcional × input de exposición Note 1) — compartida por quadrant y export.
function exposomeReading(){
  const mean = currentMean();
  const funcLevel = mean===null ? null : (mean>=3 ? 'impaired' : 'preserved');
  const exp = state.exposure; const expHigh = exp==='alta' || exp==='media';
  let verdict='—', explain='Selecciona la carga de exposición (Note 1) y puntúa la etapa actual para ubicar al paciente.';
  if (exp && funcLevel){
    if (expHigh && funcLevel==='preserved'){ verdict='Resiliencia'; explain='Alta exposición con funcionamiento preservado: marcadores de resiliencia. Indagar factores protectores.'; }
    else if (expHigh && funcLevel==='impaired'){ verdict='Vulnerabilidad esperable'; explain='Alta exposición con funcionamiento pobre: deterioro coherente con la carga ambiental (dosis-respuesta).'; }
    else if (!expHigh && funcLevel==='impaired'){ verdict='Carga intrínseca / neurodesarrollo'; explain='Baja exposición pero funcionamiento pobre: sugiere peso intrínseco/neurodesarrollo más que ambiental.'; }
    else { verdict='Desarrollo típico'; explain='Baja exposición con funcionamiento preservado: trayectoria típica.'; }
  }
  return { mean, funcLevel, exp, verdict, explain };
}

    if (!cta){ cta = document.createElement('button'); cta.id='completionCta'; cta.className='completion-cta'; cta.onclick=()=>showView('profile'); document.getElementById('progressText').insertAdjacentElement('afterend', cta); }
    cta.textContent = 'Ver perfil →'; cta.style.display='';
  } else if (cta){ cta.style.display='none'; }
}

   PROFILE — trayectoria + delta/forma + cuadrante exposómico

const hiddenAxes = {}; // legend toggle state

function axisTrajectory(axisId){
  const ax = AXIS_BY_ID[axisId];
  const pts = axisPoints(axisId);                                   // ordenados por EDAD (sub-puntos o baseline)
  const current = pts.length ? pts[pts.length-1].score : null;      // punto más reciente (mayor edad)
  const earlier = pts.slice(0,-1).map(p => p.score);
  const peak = earlier.length ? Math.min(...earlier) : null;        // mejor (0) antes del actual
  const delta = (peak!==null && current!==null) ? (current - peak) : null;
  return { ax, points: pts, peak, current, delta, shape: classifyShape(pts) };
}
function classifyShape(points){
  const seq = points.filter(p => p.score!==null).map(p => p.score);
  if (seq.length<2) return 'NS';
  const allGood = seq.every(v => v<=2);
  const allPoor = seq.every(v => v>=3);
  if (allGood) return 'estable bueno';
  if (allPoor) return 'estable pobre';
  const early = seq.slice(0,-1), last = seq[seq.length-1];
  // declive tardío PRIMERO: estable-bueno que colapsa al final
  if (early.length && Math.max(...early)<=2 && last>=3) return 'declive tardío';
  let nonDecreasing = true;
  for (let i=1;i<seq.length;i++){ if (seq[i] < seq[i-1]) { nonDecreasing=false; break; } }
  if (nonDecreasing && (last-seq[0])>=2) return 'deterioro progresivo';
  let nonIncreasing = true;
  for (let i=1;i<seq.length;i++){ if (seq[i] > seq[i-1]) { nonIncreasing=false; break; } }
  if (nonIncreasing && (seq[0]-last)>=2) return 'mejora progresiva';
  return 'fluctuante';
}

function drawMiniTrajectory(axis){
  const [amin, amax] = ageDomain();
  const curAge = state.age!=null ? +state.age : null;
  const W=300, H=140, L=22, R=10, MT=10, B=28;
  const px0=L, px1=W-R, py0=MT, py1=H-B;
  const xFor = a => px0 + ((a-amin)/((amax-amin)||1))*(px1-px0); // x = EDAD real
  const yFor = s => py0 + (s/6)*(py1-py0);                       // 0 arriba (mejor), 6 abajo (peor)
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;overflow:visible">`;
  const T = ink(); const col = axColor(axis);
  // Bandas de alarma: verde (preservado 0–2) · ámbar (límite 2–4) · rojo (alarma 4–6)
  svg += `<rect x="${px0}" y="${yFor(0)}" width="${px1-px0}" height="${yFor(2)-yFor(0)}" fill="${T.bandG}"/>`;
  svg += `<rect x="${px0}" y="${yFor(2)}" width="${px1-px0}" height="${yFor(4)-yFor(2)}" fill="${T.bandA}"/>`;
  svg += `<rect x="${px0}" y="${yFor(4)}" width="${px1-px0}" height="${yFor(6)-yFor(4)}" fill="${T.bandR}"/>`;
  for (let s=0;s<=6;s++){
    const y=yFor(s); const major=(s===0||s===3||s===6);
    svg += `<line x1="${px0}" y1="${y}" x2="${px1}" y2="${y}" stroke="${s===0?T.gridZero:T.grid}" stroke-width="${s===0?1:0.6}" ${s===0?'':'stroke-dasharray="2,3"'}/>`;
    if (major) svg += `<text x="${px0-4}" y="${y+3}" font-size="7.5" text-anchor="end" fill="${T.tick}">${s}</text>`;
  }
  // límites de etapa = guías verticales tenues (contexto)
  activeStages().forEach(st => { if (st.lo>amin && st.lo<amax){ const x=xFor(st.lo); svg += `<line x1="${x}" y1="${py0}" x2="${x}" y2="${py1}" stroke="${T.grid}" stroke-width="0.6" stroke-dasharray="1,3"/>`; } });
  // marcas de edad en x
  [...new Set([amin, Math.round((amin+amax)/2), amax])].forEach(a => { svg += `<text x="${xFor(a).toFixed(1)}" y="${py1+12}" font-size="7" text-anchor="middle" fill="${T.tick}">${a}</text>`; });
  svg += `<text x="${(px0+px1)/2}" y="${py1+23}" font-size="7" text-anchor="middle" fill="${T.subtle}">edad →</text>`;
  // edad actual (línea guía)
  if (curAge!=null && curAge>=amin && curAge<=amax){ const x=xFor(curAge); svg += `<line x1="${x}" y1="${py0}" x2="${x}" y2="${py1}" stroke="${T.curGuide}" stroke-width="0.9" stroke-dasharray="2,3"/>`; }
  const tj = axisTrajectory(axis.id);
  const pts = tj.points.map(p => ({x:xFor(p.age), y:yFor(p.score), p}));
  if (!pts.length){ svg += `<text x="${(px0+px1)/2}" y="${(py0+py1)/2}" font-size="9.5" text-anchor="middle" fill="${T.nodata}">sin datos</text>`; }
  else {
    if (pts.length>1){ const path = pts.map((q,i)=>(i===0?'M':'L')+q.x.toFixed(1)+' '+q.y.toFixed(1)).join(' '); svg += `<path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`; }
    pts.forEach(q=>{
      const tipId = 'mini_'+axis.id+'_'+q.p.stageId+'_'+Math.round(q.p.age);
      const extra = q.p.note || (cellContent(axis, q.p.stageId).anchors[q.p.score]||'');
      window['_tip_'+tipId] = `<b style="color:${col}">${axis.title}</b> · ${q.p.age} años<br>${q.p.score} — ${SEVERITY[q.p.score]}${q.p.source==='point'?' <span style="opacity:.6">(intra-etapa)</span>':''}<br><span style="opacity:.7">${escapeAttr(extra)}</span>`;
      const r = q.p.source==='point' ? 4.2 : 3.6;
      svg += `<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${r}" fill="${T.dot}" stroke="${col}" stroke-width="1.8" style="cursor:pointer" onmouseenter="showTip(event,'${tipId}')" onclick="event.stopPropagation();showTip(event,'${tipId}')" onmouseleave="hideTip()"/>`;
    });
  }
  svg += `</svg>`;
  return svg;
}
function renderTrajectoryGrid(){
  let html = '';
  AXES.forEach(axis=>{
    const tj = axisTrajectory(axis.id);
    const stc = (tj.delta===null) ? 'st-muted' : 'st-'+deltaStatus(tj.delta);
    html += `<div class="tjbox ${stc}">
      <div class="tjb-head"><span class="tjb-title"><span class="tjb-dot" style="background:${axColor(axis)}"></span>${axis.title}</span><span class="tjb-delta">Δ${fmtDelta(tj.delta)}</span></div>
      <div class="tjb-shape">${tj.shape} · pico ${tj.peak===null?'—':tj.peak} → actual ${tj.current===null?'—':tj.current}</div>
      ${drawMiniTrajectory(axis)}
    </div>`;
  });
  return html;
}

function deltaStatus(delta){ if (delta===null) return 'muted'; if (delta<=1) return 'green'; if (delta<=3) return 'yellow'; return 'red'; }
function fmtDelta(d){ if (d===null) return '—'; return (d>0?'+':'')+d; }

function renderSummaryCards(){
  let cards='';
  AXES.forEach(ax=>{
    const tj = axisTrajectory(ax.id);
    const st = deltaStatus(tj.delta);
    const muted = (tj.peak===null && tj.current===null) ? 'st-muted' : '';
    cards += `<div class="summary-card st-${st} ${muted}">
      <div class="sc-top"><span class="sc-title">${ax.title}</span><span class="sc-delta">Δ${fmtDelta(tj.delta)}</span></div>
      <div class="sc-meta"><span>pico ${tj.peak===null?'—':tj.peak} → actual ${tj.current===null?'—':tj.current}</span><span class="sc-shape">${tj.shape}</span></div>
    </div>`;
  });
  return `<div class="summary-grid">${cards}</div>`;
}

function currentMean(){
  const cur = currentStageId(); if (!cur) return null;
  const vals = AXES.map(ax => applicOf(ax, cur)==='na' ? null : scoreNum(cur, ax.id)).filter(v=>v!==null);
  if (!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function renderQuadrant(){
  const mean = currentMean();
  const funcLevel = mean===null ? null : (mean>=3 ? 'impaired' : 'preserved');
  const exp = state.exposure; // 'baja'|'media'|'alta'|null
  const expHigh = exp==='alta' || exp==='media';
  const T = ink();
  let verdict='—', vKey='subtle', explain='Selecciona la carga de exposición (de Note 1) y puntúa la etapa actual para ubicar al paciente.';
  if (exp && funcLevel){
    if (expHigh && funcLevel==='preserved'){ verdict='Resiliencia'; vKey='green'; explain='Alta exposición con funcionamiento preservado: marcadores de resiliencia. Indagar factores protectores.'; }
    else if (expHigh && funcLevel==='impaired'){ verdict='Vulnerabilidad esperable'; vKey='orange'; explain='Alta exposición con funcionamiento pobre: deterioro coherente con la carga ambiental (dosis-respuesta).'; }
    else if (!expHigh && funcLevel==='impaired'){ verdict='Carga intrínseca / neurodesarrollo'; vKey='red'; explain='Baja exposición pero funcionamiento pobre: sugiere peso intrínseco/neurodesarrollo más que ambiental.'; }
    else { verdict='Desarrollo típico'; vKey='teal'; explain='Baja exposición con funcionamiento preservado: trayectoria típica.'; }
  }
  // 2x2 svg
  const sz=240, m=34, cellW=(sz-m)/2, cellH=(sz-m)/2;
  const vColor = T[vKey];
  const cellFill=(hi,imp)=> (exp&&funcLevel && expHigh===hi && (funcLevel==='impaired')===imp) ? T.cellHi : T.cellBg;
  let q = `<svg viewBox="0 0 ${sz+10} ${sz+24}" style="width:100%;max-width:280px;height:auto">`;
  // y: top = impaired(peor), bottom = preserved(mejor) ; x: left = baja, right = alta
  const labels=[
    {x:m, y:0, hi:false, imp:true, t:'Carga intrínseca'},
    {x:m+cellW, y:0, hi:true, imp:true, t:'Vulnerab. esperable'},
    {x:m, y:cellH, hi:false, imp:false, t:'Desarrollo típico'},
    {x:m+cellW, y:cellH, hi:true, imp:false, t:'Resiliencia'}
  ];
  labels.forEach(c=>{
    q += `<rect x="${c.x}" y="${c.y}" width="${cellW}" height="${cellH}" fill="${cellFill(c.hi,c.imp)}" stroke="${T.cellStroke}" stroke-width="1"/>`;
    q += `<text x="${c.x+cellW/2}" y="${c.y+cellH/2}" font-size="9.5" text-anchor="middle" fill="${T.tick}" font-weight="600">${c.t}</text>`;
  });
  // axis labels
  q += `<text x="${m+cellW}" y="${sz+6}" font-size="10" text-anchor="middle" fill="${T.tick}">Exposición →</text>`;
  q += `<text x="${m-6}" y="${cellH}" font-size="10" text-anchor="middle" fill="${T.tick}" transform="rotate(-90 ${m-6} ${cellH})">Funcionamiento ↓ peor</text>`;
  q += `<text x="${m+cellW*0.5}" y="${sz+20}" font-size="9" text-anchor="middle" fill="${T.subtle}">baja</text>`;
  q += `<text x="${m+cellW*1.5}" y="${sz+20}" font-size="9" text-anchor="middle" fill="${T.subtle}">media/alta</text>`;
  // patient dot
  if (exp && funcLevel){
    const dx = m + (expHigh? cellW*1.5 : cellW*0.5);
    const dy = (funcLevel==='impaired'? cellH*0.5 : cellH*1.5);
    q += `<circle cx="${dx}" cy="${dy}" r="7" fill="${vColor}" stroke="${T.dotStroke}" stroke-width="2.4"/>`;
  }
  q += `</svg>`;
  const expBtns = ['baja','media','alta'].map(l=>`<button class="exp-btn ${exp===l?'active':''}" onclick="setExposure('${l}')">${l}</button>`).join('');
  return `<div class="quad-wrap">
    <div>${q}</div>
    <div class="quad-controls">
      <div><label>Carga de exposición (Note 1)</label><div class="exp-btns">${expBtns}</div></div>
      <div class="quad-readout">
        <div>Funcionamiento actual: <b>${mean===null?'—':mean.toFixed(1)+' / 6 ('+(funcLevel==='impaired'?'pobre':'preservado')+')'}</b></div>
        <div class="quad-verdict" style="color:${vColor}">${verdict}</div>
        <div style="margin-top:4px">${explain}</div>
      </div>
    </div>
  </div>`;
}

function drawMcAdamsChart(){

  });
  if(!any) svg+=`<text x="${(px0+px1)/2}" y="${(py0+py1)/2}" font-size="12" text-anchor="middle" fill="${T.nodata}">Agrega capítulos con edad y marcas McAdams para ver la gráfica.</text>`;

  return svg+leg;

function setChapterAge(ci,fld,v){ nchap(ci)[fld]=v; saveState(); renderNarrative(); }
function setChapterTone(ci,v){ const ch=nchap(ci); ch.tone=(ch.tone===v?null:v); saveState(); renderNarrative(); }
function setCoded(ci,k,v){ const ch=nchap(ci); if(!ch.coded) ch.coded={}; ch.coded[k]=(String(ch.coded[k])===v?null:v); saveState(); renderNarrative(); }
function setPattern(p){ const N=narr(); N.pattern=(N.pattern===p?null:p); saveState(); renderNarrative(); }
function setCoherence(p){ const N=narr(); N.coherence=(N.coherence===p?null:p); saveState(); renderNarrative(); }
function setSynthesis(v){ narr().synthesis=v; saveState(); }

// Interpolación lineal del score de un eje a una edad, sólo dentro de su rango de datos.
function interpScoreInRange(points, age){
  if (!points || points.length<1) return null;
  if (age < points[0].age || age > points[points.length-1].age) return null;
  if (points.length===1) return points[0].score;
  for (let i=1;i<points.length;i++){
    if (age <= points[i].age){ const a=points[i-1], b=points[i]; const dt=(b.age-a.age)||1; const t=(age-a.age)/dt; return a.score + (b.score-a.score)*t; }
  }
  return points[points.length-1].score;
}
// LÍNEA DE TIEMPO INTEGRADA: funcional + eventos + McAdams sobre un solo eje de EDAD.
function drawUnifiedTimeline(){
  const T = ink();
  const [amin, amax] = ageDomain();
  const W=860, L=64, R=22, Tt=20, Bb=32;
  const px0=L, px1=W-R;
  const laneA=152, laneB=50, laneC=118, gap=16;
  const Ay0=Tt, Ay1=Ay0+laneA;
  const By0=Ay1+gap, By1=By0+laneB;
  const Cy0=By1+gap, Cy1=Cy0+laneC;
  const H=Cy1+Bb;
  const xFor = a => px0 + ((a-amin)/((amax-amin)||1))*(px1-px0);
  const yA = s => Ay0 + (s/6)*laneA;        // 0 arriba (mejor) .. 6 abajo (peor)
  const yC = v => Cy0 + ((2-v)/4)*laneC;    // +2 arriba .. -2 abajo
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto;display:block;margin:0 auto;overflow:visible">`;

  // ── Lane A: funcional ──
  svg += `<rect x="${px0}" y="${yA(0)}" width="${px1-px0}" height="${yA(2)-yA(0)}" fill="${T.bandG}"/>`;
  svg += `<rect x="${px0}" y="${yA(2)}" width="${px1-px0}" height="${yA(4)-yA(2)}" fill="${T.bandA}"/>`;
  svg += `<rect x="${px0}" y="${yA(4)}" width="${px1-px0}" height="${yA(6)-yA(4)}" fill="${T.bandR}"/>`;
  [0,3,6].forEach(s=>{ const y=yA(s); svg += `<line x1="${px0}" y1="${y}" x2="${px1}" y2="${y}" stroke="${s===0?T.gridZero:T.grid}" stroke-width="${s===0?1:0.6}" ${s===0?'':'stroke-dasharray="2,3"'}/>`; svg += `<text x="${px0-6}" y="${y+3}" font-size="8.5" text-anchor="end" fill="${T.tick}">${s}</text>`; });
  svg += `<text x="${px0-6}" y="${Ay0-7}" font-size="9" text-anchor="end" fill="${T.subtle}" font-weight="700">FUNCIÓN</text>`;
  svg += `<text x="${px0-50}" y="${(Ay0+Ay1)/2}" font-size="7.5" text-anchor="middle" fill="${T.subtle}" transform="rotate(-90 ${px0-50} ${(Ay0+Ay1)/2})">0 mejor · 6 peor</text>`;
  AXES.forEach(ax=>{ const pts=axisPoints(ax.id); if(pts.length<2){ if(pts.length===1){ const q=pts[0]; svg+=`<circle cx="${xFor(q.age).toFixed(1)}" cy="${yA(q.score).toFixed(1)}" r="2" fill="${axColor(ax)}" opacity="0.5"/>`; } return; } const path=pts.map((p,i)=>(i===0?'M':'L')+xFor(p.age).toFixed(1)+' '+yA(p.score).toFixed(1)).join(' '); svg+=`<path d="${path}" fill="none" stroke="${axColor(ax)}" stroke-width="1.1" opacity="0.42" stroke-linejoin="round"/>`; });
  const meanPts=[];
  for (let a=Math.floor(amin); a<=Math.ceil(amax); a++){
    const vals=AXES.map(ax=>interpScoreInRange(axisPoints(ax.id),a)).filter(v=>v!=null);
    if (vals.length) meanPts.push({a, m: vals.reduce((x,y)=>x+y,0)/vals.length});
  }
  if (meanPts.length>1){ const path=meanPts.map((q,i)=>(i===0?'M':'L')+xFor(q.a).toFixed(1)+' '+yA(q.m).toFixed(1)).join(' '); svg+=`<path d="${path}" fill="none" stroke="${T.cur}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`; }

  // ── Lane C: McAdams ──
  [-2,0,2].forEach(v=>{ const y=yC(v); const z=v===0; svg+=`<line x1="${px0}" y1="${y}" x2="${px1}" y2="${y}" stroke="${z?T.gridZero:T.grid}" stroke-width="${z?1:0.6}" ${z?'':'stroke-dasharray="2,3"'}/>`; svg+=`<text x="${px0-6}" y="${y+3}" font-size="8.5" text-anchor="end" fill="${T.tick}">${v>0?'+'+v:v}</text>`; });
  svg += `<text x="${px0-6}" y="${Cy0-7}" font-size="9" text-anchor="end" fill="${T.subtle}" font-weight="700">NARRATIVA</text>`;
  const chs = narr().chapters.map(ch=>({ch,age:chapAge(ch)})).filter(o=>o.age!=null).sort((a,b)=>a.age-b.age);
  MCAD.forEach(m=>{ const col=mcadColor(m); const pts=chs.map(o=>{ const raw=o.ch.coded&&o.ch.coded[m.k]; const v=(raw==null||raw==='')?null:parseInt(raw,10); return (v==null||isNaN(v))?null:{x:xFor(o.age),y:yC(v)}; }).filter(Boolean); if(pts.length>1){ const path=pts.map((q,i)=>(i===0?'M':'L')+q.x.toFixed(1)+' '+q.y.toFixed(1)).join(' '); svg+=`<path d="${path}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/>`; } pts.forEach(q=>{ svg+=`<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="2.6" fill="${col}"/>`; }); });

  // ── Lane B: eventos (verticales que cruzan las 3 lanes) ──
  svg += `<text x="${px0-6}" y="${(By0+By1)/2+3}" font-size="9" text-anchor="end" fill="${T.subtle}" font-weight="700">EVENTOS</text>`;
  const toneCol = t => t==='positivo'?T.green : t==='negativo'?T.red : t==='mixto'?T.orange : T.subtle;
  chs.forEach((o,idx)=>{ const x=xFor(o.age); const col=toneCol(o.ch.tone); const cy=(By0+By1)/2;
    svg += `<line x1="${x.toFixed(1)}" y1="${Ay0}" x2="${x.toFixed(1)}" y2="${Cy1}" stroke="${col}" stroke-width="0.8" stroke-dasharray="2,4" opacity="0.5"/>`;
    const tip='utl_'+idx; window['_tip_'+tip]=`<b>${escapeAttr(o.ch.title||'capítulo')}</b><br>${o.ch.ageStart||''}${o.ch.ageEnd?('–'+o.ch.ageEnd):''} años · ${o.ch.tone||'—'}<br><span style="opacity:.7">${escapeAttr(o.ch.quePaso||o.ch.comoTermino||'')}</span>`;
    svg += `<circle cx="${x.toFixed(1)}" cy="${cy}" r="9" fill="${col}" stroke="${T.dotStroke}" stroke-width="1.6" style="cursor:pointer" onmouseenter="showTip(event,'${tip}')" onclick="event.stopPropagation();showTip(event,'${tip}')" onmouseleave="hideTip()"/>`;
    svg += `<text x="${x.toFixed(1)}" y="${cy+3.3}" font-size="9" font-weight="800" text-anchor="middle" fill="#fff" style="pointer-events:none">${idx+1}</text>`;
  });

  // ── límites de etapa + edad actual + eje de edad ──
  activeStages().forEach(st=>{ if(st.lo>amin && st.lo<amax){ const x=xFor(st.lo); svg+=`<line x1="${x.toFixed(1)}" y1="${Ay0}" x2="${x.toFixed(1)}" y2="${Cy1}" stroke="${T.grid}" stroke-width="0.6" stroke-dasharray="1,4"/>`; } });
  const curAge = state.age!=null?+state.age:null;
  if (curAge!=null && curAge>=amin && curAge<=amax){ const x=xFor(curAge); svg+=`<line x1="${x.toFixed(1)}" y1="${Ay0}" x2="${x.toFixed(1)}" y2="${Cy1}" stroke="${T.curGuide}" stroke-width="1.4"/>`; svg+=`<text x="${x.toFixed(1)}" y="${Ay0-7}" font-size="8.5" text-anchor="middle" fill="${T.cur}" font-weight="700">hoy ${curAge}</text>`; }
  for(let i=0;i<=5;i++){ const a=amin+(amax-amin)*i/5; svg+=`<text x="${xFor(a).toFixed(1)}" y="${Cy1+16}" font-size="9" text-anchor="middle" fill="${T.tick}">${Math.round(a)}</text>`; }
  svg += `<text x="${(px0+px1)/2}" y="${Cy1+28}" font-size="9.5" text-anchor="middle" fill="${T.subtle}">edad →</text>`;
  svg += `</svg>`;
  const leg = `<div class="chart-legend"><span class="legend-item"><span class="sw" style="background:${T.cur}"></span>Funcionamiento medio</span><span class="legend-item" style="opacity:.75"><span class="sw" style="background:${T.subtle}"></span>ejes individuales (tenue)</span>`+MCAD.map(m=>`<span class="legend-item"><span class="sw" style="background:${mcadColor(m)}"></span>${m.label}</span>`).join('')+`</div>`;
  return svg+leg;
}

function renderProfile(){
  const c = document.getElementById('profileView');
  if (!activeStages().length){ c.innerHTML = `<div class="empty-prompt">Ingresa la edad del paciente en la pestaña <b>Funcionamiento</b> para ver el perfil.</div>`; return; }
  c.innerHTML = `
    <div class="profile-dashboard">
      <section class="dash-panel">
        <div class="panel-title">Línea de tiempo integrada</div>
        <div class="panel-sub">Todo sobre un solo eje de <b>edad</b>: funcionamiento (0 mejor → 6 peor), eventos de vida y la identidad narrativa McAdams (±2). Las verticales marcan cada evento — léelas de arriba a abajo para cruzar colapso funcional × narrativa en la misma edad.</div>
        <div class="chart-wrap">${drawUnifiedTimeline()}</div>
      </section>
      <section class="dash-panel">
        <div class="panel-title">Trayectoria por eje</div>
        <div class="panel-sub">Un recuadro por eje, lado a lado, sobre el eje de <b>edad</b> · arriba = mejor (0), abajo = peor (6) · puntos grandes = sub-puntos intra-etapa · Δ = actual − pico · bandas <b style="color:var(--green)">verde</b>/<b style="color:var(--orange)">ámbar</b>/<b style="color:var(--red)">rojo</b></div>
        <div class="tj-grid">${renderTrajectoryGrid()}</div>
      </section>
    </div>`;
}

/* ══════════════════════════════════════════════════════════════
   VIEW SWITCH
   ══════════════════════════════════════════════════════════════ */
function showView(view){
  activeView = view;
  document.body.classList.toggle('profile-mode', view!=='score');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.view===view));
  if (view==='profile') renderProfile();
  if (view==='narrative') renderNarrative();
  const map = { score:'scoreView', narrative:'narrativeView', profile:'profileView' };
  Object.keys(map).forEach(k => { const el=document.getElementById(map[k]); if(el) el.style.display = (k===view)?'':'none'; });
  const el = document.getElementById(map[view]);
  if (el){ el.style.opacity='0'; el.style.transform='translateY(5px)'; requestAnimationFrame(()=>{ el.style.transition='opacity 0.2s ease, transform 0.2s ease'; el.style.opacity='1'; el.style.transform='translateY(0)'; }); }
}
